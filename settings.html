<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>設定 - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-log.js"></script>
  <style>
    .settings-section { padding: 20px 20px 0; }
    .settings-section + .settings-section { padding-top: 8px; }

    .settings-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .settings-list {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .settings-item {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--transition);
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-item:hover { background: var(--surface); }
    .settings-item .icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .settings-item .label { flex: 1; font-size: 0.9rem; font-weight: 500; }
    .settings-item .value { font-size: 0.8rem; color: var(--muted); }
    .settings-item .arrow { color: var(--border); font-size: 0.8rem; }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .profile-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border);
    }
    .profile-info h3 { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
    .profile-info p { font-size: 0.8rem; color: var(--muted); }

    .invite-box {
      background: #FEF3EC;
      border: 1.5px dashed var(--terra);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }
    .invite-box p { font-size: 0.85rem; color: var(--brown); margin-bottom: 10px; }

    .join-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .join-box p { font-size: 0.85rem; color: var(--brown); margin-bottom: 10px; }
    .join-input-row {
      display: flex;
      gap: 8px;
    }
    .join-input-row input {
      flex: 1;
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }
    .member-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--brown);
    }
    .member-role {
      font-size: 0.7rem;
      color: var(--muted);
      background: var(--border);
      padding: 1px 7px;
      border-radius: 99px;
    }

    .version-note {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <span class="header-title">設定</span>
    </header>

    <div class="page">
      <!-- プロフィール -->
      <div class="settings-section">
        <div class="settings-label">プロフィール</div>
        <div class="profile-card" id="profileCard">
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      </div>

      <!-- 世帯設定 -->
      <div class="settings-section">
        <div class="settings-label">世帯・共有</div>
        <div class="settings-list">
          <div class="settings-item" onclick="toggleSection('inviteSection')">
            <span class="icon">📤</span>
            <span class="label">家族を招待する</span>
            <span class="arrow" id="inviteArrow">›</span>
          </div>
          <div class="settings-item" onclick="toggleSection('joinSection')">
            <span class="icon">📥</span>
            <span class="label">招待コードで参加する</span>
            <span class="arrow" id="joinArrow">›</span>
          </div>
          <div class="settings-item" onclick="toggleSection('householdNameSection')">
            <span class="icon">🏠</span>
            <span class="label">世帯名</span>
            <span class="value" id="householdName">読込中...</span>
            <span class="arrow" id="householdNameArrow">›</span>
          </div>
        </div>

        <!-- メンバー一覧 -->
        <div class="member-list" id="memberList"></div>

        <!-- 世帯を離れる -->
        <div id="leaveSection" class="hidden" style="margin-top:12px;">
          <button onclick="leaveHousehold()"
                  style="width:100%;padding:10px;background:none;border:1px solid var(--border);border-radius:var(--radius-md);color:var(--muted);font-size:0.82rem;cursor:pointer;">
            この世帯を離れる
          </button>
        </div>
      </div>

      <!-- 招待コード発行（非表示→表示） -->
      <div class="settings-section hidden" id="inviteSection">
        <div class="invite-box">
          <p>招待コードをコピーして<br>家族のTaveraアカウントで入力してもらってください</p>
          <div style="font-family:monospace;font-size:1.4rem;font-weight:700;color:var(--terra);letter-spacing:0.15em;margin-bottom:12px;" id="inviteCode">-</div>
          <button class="btn btn-primary" onclick="copyInviteCode()">コードをコピー</button>
        </div>
      </div>

      <!-- 世帯名編集（非表示→表示） -->
      <div class="settings-section hidden" id="householdNameSection">
        <div class="join-box">
          <p>新しい世帯名を入力してください</p>
          <div class="join-input-row">
            <input type="text" id="householdNameInput" class="form-input"
                   placeholder="例：田中家" maxlength="20">
            <button class="btn btn-primary" onclick="saveHouseholdName()">保存</button>
          </div>
        </div>
      </div>

      <!-- 招待コードで参加（非表示→表示） -->
      <div class="settings-section hidden" id="joinSection">
        <div class="join-box">
          <p>家族から受け取った8桁の招待コードを入力してください</p>
          <div class="join-input-row">
            <input type="text" id="joinCodeInput" class="form-input"
                   placeholder="XXXXXXXX" maxlength="8"
                   autocomplete="off" autocorrect="off"
                   autocapitalize="characters" spellcheck="false"
                   style="text-transform:uppercase;letter-spacing:0.1em;font-family:monospace;font-size:1rem;">
            <button class="btn btn-primary" onclick="joinHousehold()">参加する</button>
          </div>
        </div>
      </div>

      <!-- アプリ設定 -->
      <div class="settings-section">
        <div class="settings-label">アプリ</div>
        <div class="settings-list">
          <div class="settings-item">
            <span class="icon">🔔</span>
            <span class="label">通知設定</span>
            <span class="value">準備中</span>
          </div>
          <div class="settings-item">
            <span class="icon">📊</span>
            <span class="label">データエクスポート</span>
            <span class="value">準備中</span>
          </div>
        </div>
      </div>

      <!-- アカウント -->
      <div class="settings-section">
        <div class="settings-label">アカウント</div>
        <div class="settings-list">
          <div class="settings-item" onclick="signOut()" style="color:var(--terra)">
            <span class="icon">🚪</span>
            <span class="label" style="color:var(--terra)">ログアウト</span>
          </div>
        </div>
      </div>

      <div class="version-note">Tavera v0.1.0</div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="log.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        記録
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="suggest.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
    </nav>
  </div>

  <script>
    let householdId = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      currentUser = user;  // supabase.jsで宣言済みのグローバル変数を使用
      householdId = await getOrCreateHousehold(user.id);

      // プロフィール表示
      const card = document.getElementById('profileCard');
      const meta = user.user_metadata;
      card.innerHTML = `
        <img class="profile-avatar" src="${meta.avatar_url || ''}" alt="${meta.full_name || ''}">
        <div class="profile-info">
          <h3>${meta.full_name || 'ユーザー'}</h3>
          <p>${user.email}</p>
        </div>
      `;

      // 招待コード（世帯IDの先頭8文字）
      document.getElementById('inviteCode').textContent = householdId?.slice(0,8).toUpperCase() || '-';

      // メンバー名をGoogle表示名で更新（毎回上書きして最新に保つ）
      await db.from('menu_members')
        .update({ name: meta.full_name || 'ユーザー' })
        .eq('id', user.id);

      // 世帯名・メンバー表示
      await renderHousehold();
    }

    async function renderHousehold() {
      if (!householdId) return;

      // 世帯名
      const { data: hh } = await db.from('menu_households').select('name').eq('id', householdId).single();
      document.getElementById('householdName').textContent = hh?.name || 'わが家';

      // メンバー一覧
      const members = await getHouseholdMembers(householdId);
      const list = document.getElementById('memberList');
      if (members.length > 0) {
        list.innerHTML = members.map(m => `
          <div class="member-item">
            <span>👤</span>
            <span>${m.name || 'メンバー'}</span>
            <span class="member-role">${m.role === 'owner' ? 'オーナー' : 'メンバー'}</span>
          </div>
        `).join('');
      } else {
        list.innerHTML = '';
      }

      // 複数メンバーかつ自分がメンバー（非オーナー）の場合のみ「離れる」ボタンを表示
      const leaveSection = document.getElementById('leaveSection');
      const myRecord = members.find(m => m.id === currentUser.id);
      if (members.length > 1 && myRecord?.role === 'member') {
        leaveSection.classList.remove('hidden');
      } else {
        leaveSection.classList.add('hidden');
      }
    }

    function toggleSection(id) {
      const section = document.getElementById(id);
      const isHidden = section.classList.toggle('hidden');
      // 矢印の向きを切り替え
      const arrowId = id === 'inviteSection' ? 'inviteArrow' : 'joinArrow';
      document.getElementById(arrowId).textContent = isHidden ? '›' : '∨';
    }

    function copyInviteCode() {
      const code = document.getElementById('inviteCode').textContent;
      navigator.clipboard.writeText(code).then(() => {
        showToast('招待コードをコピーしました！', 'success');
      }).catch(() => {
        // fallback for older browsers
        showToast('コード: ' + code, 'info');
      });
    }

    async function leaveHousehold() {
      if (!confirm('この世帯を離れますか？\n\n・あなたのアカウントに新しい個人世帯が作られます\n・元の世帯の記録はそのまま残ります\n・再度招待コードで別の世帯に参加できます')) return;

      const btn = event.target;
      btn.textContent = '処理中...';
      btn.disabled = true;

      // 新しい個人世帯を作成
      const { data: newHousehold, error: hErr } = await db
        .from('menu_households')
        .insert({ created_by: currentUser.id, name: 'わが家' })
        .select()
        .single();

      if (hErr) {
        showToast('エラーが発生しました', 'error');
        btn.textContent = 'この世帯を離れる';
        btn.disabled = false;
        return;
      }

      // 自分のメンバーレコードを新世帯に移行
      const { error: mErr } = await db
        .from('menu_members')
        .update({ household_id: newHousehold.id, role: 'owner' })
        .eq('id', currentUser.id);

      if (mErr) {
        showToast('エラーが発生しました', 'error');
        btn.textContent = 'この世帯を離れる';
        btn.disabled = false;
        return;
      }

      showToast('世帯を離れました', 'info');
      setTimeout(() => location.reload(), 1200);
    }

    async function saveHouseholdName() {
      const name = document.getElementById('householdNameInput').value.trim();
      if (!name) { showToast('世帯名を入力してください', 'error'); return; }

      const btn = event.target;
      btn.textContent = '保存中...';
      btn.disabled = true;

      const { error } = await db
        .from('menu_households')
        .update({ name })
        .eq('id', householdId);

      btn.textContent = '保存';
      btn.disabled = false;

      if (!error) {
        document.getElementById('householdName').textContent = name;
        document.getElementById('householdNameInput').value = '';
        document.getElementById('householdNameSection').classList.add('hidden');
        document.getElementById('householdNameArrow').textContent = '›';
        showToast('世帯名を変更しました', 'success');
      } else {
        showToast('保存に失敗しました', 'error');
      }
    }

    async function joinHousehold() {
      const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
      if (code.length < 4) {
        showToast('招待コードを入力してください', 'error');
        return;
      }

      const btn = event.target;
      btn.textContent = '確認中...';
      btn.disabled = true;

      const result = await joinHouseholdByCode(currentUser.id, code);

      btn.textContent = '参加する';
      btn.disabled = false;

      if (result.ok) {
        showToast(`「${result.householdName}」に参加しました！`, 'success');
        householdId = await getOrCreateHousehold(currentUser.id);
        document.getElementById('inviteCode').textContent = householdId?.slice(0,8).toUpperCase() || '-';
        document.getElementById('joinCodeInput').value = '';
        document.getElementById('joinSection').classList.add('hidden');
        document.getElementById('joinArrow').textContent = '›';
        await renderHousehold();
      } else {
        showToast(result.message, 'error');
      }
    }

    init();
  </script>
</body>
</html>
