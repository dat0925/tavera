<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>設定 - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-log.js"></script>
  <style>
    .settings-section { padding: 20px 20px 0; }
    .settings-section + .settings-section { padding-top: 8px; }
    .settings-label {
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 8px;
    }
    .settings-list {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .settings-item {
      display: flex; align-items: center; padding: 14px 16px;
      gap: 12px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background var(--transition);
    }
    .settings-item:last-child { border-bottom: none; }
    .settings-item:hover { background: var(--surface); }
    .settings-item .icon { font-size: 1.2rem; width: 24px; text-align: center; }
    .settings-item .label { flex: 1; font-size: 0.9rem; font-weight: 500; }
    .settings-item .value { font-size: 0.8rem; color: var(--muted); }
    .settings-item .arrow { color: var(--border); font-size: 0.8rem; }

    .profile-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .profile-avatar { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border); }

    /* プランカード */
    .plan-card {
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .plan-badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 12px; border-radius: 99px;
      font-size: 0.78rem; font-weight: 700; margin-bottom: 10px;
    }
    .plan-badge.free     { background: var(--surface); color: var(--muted); border: 1px solid var(--border); }
    .plan-badge.premium  { background: #FEF3EC; color: var(--terra); border: 1px solid var(--terra); }
    .plan-usage {
      font-size: 0.82rem; color: var(--brown); margin-bottom: 12px; line-height: 1.6;
    }
    .plan-usage .count { font-weight: 700; }
    .plan-usage .warn   { color: var(--terra); }
    .plan-upgrade-btn {
      display: block; width: 100%; padding: 11px;
      background: var(--terra); color: #fff; border: none;
      border-radius: 99px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; font-family: inherit; text-align: center; text-decoration: none;
    }
    .plan-manage-btn {
      display: block; width: 100%; padding: 11px; margin-top: 8px;
      background: none; color: var(--muted); border: 1.5px solid var(--border);
      border-radius: 99px; font-size: 0.82rem; cursor: pointer; font-family: inherit;
    }
    .profile-info h3 { font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
    .profile-info p  { font-size: 0.8rem; color: var(--muted); }

    .invite-box {
      background: #FEF3EC; border: 1.5px dashed var(--terra);
      border-radius: var(--radius-md); padding: 16px; text-align: center;
    }
    .invite-box p { font-size: 0.85rem; color: var(--brown); margin-bottom: 10px; }

    .join-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 16px;
    }
    .join-box p { font-size: 0.85rem; color: var(--brown); margin-bottom: 10px; }
    .join-input-row { display: flex; gap: 8px; }
    .join-input-row input { flex: 1; font-family: monospace; font-size: 1rem; letter-spacing: 0.1em; text-transform: uppercase; }

    .member-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .member-item { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--brown); }
    .member-role { font-size: 0.7rem; color: var(--muted); background: var(--border); padding: 1px 7px; border-radius: 99px; }

    /* ---- 家族メンバー管理 ---- */
    .fam-list { display: flex; flex-direction: column; gap: 10px; }
    .fam-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px 16px;
    }
    .fam-card-head {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .fam-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--cream); border: 1.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }
    .fam-name { font-size: 0.95rem; font-weight: 700; color: var(--brown); flex: 1; }
    .fam-edit-btn {
      background: none; border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 4px 10px; font-size: 0.75rem; color: var(--muted); cursor: pointer;
      transition: all var(--transition);
    }
    .fam-edit-btn:hover { border-color: var(--terra); color: var(--terra); }
    .fam-del-btn {
      background: none; border: none; color: var(--muted); font-size: 1rem;
      cursor: pointer; padding: 2px 6px;
    }
    .fam-del-btn:hover { color: var(--terra); }

    .allergy-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 24px; }
    .allergy-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 99px;
      background: #FEF3EC; border: 1.5px solid var(--terra);
      color: var(--terra); font-size: 0.75rem; font-weight: 600;
    }
    .allergy-chip .chip-del {
      background: none; border: none; color: var(--terra);
      font-size: 0.65rem; cursor: pointer; padding: 0; opacity: 0.7; line-height: 1;
    }
    .allergy-chip .chip-del:hover { opacity: 1; }
    .allergy-none { font-size: 0.78rem; color: var(--muted); }

    /* メンバー編集フォーム */
    .fam-form {
      background: var(--surface); border: 1.5px solid var(--amber);
      border-radius: var(--radius-md); padding: 16px; margin-bottom: 10px;
    }
    .fam-form-title {
      font-size: 0.8rem; font-weight: 700; color: var(--brown);
      margin-bottom: 12px;
    }
    .fam-form-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
    .fam-form-row { margin-bottom: 12px; }
    .allergy-input-row { display: flex; gap: 6px; }
    .allergy-input-row input { flex: 1; }
    .fam-form-actions { display: flex; gap: 8px; margin-top: 4px; }
    .fam-form-actions .btn { flex: 1; padding: 10px; font-size: 0.85rem; }

    /* 新規追加ボタン */
    .fam-add-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 12px;
      background: none; border: 1.5px dashed var(--border);
      border-radius: var(--radius-md); color: var(--muted);
      font-size: 0.85rem; cursor: pointer; transition: all var(--transition);
    }
    .fam-add-btn:hover { border-color: var(--terra); color: var(--terra); }

    .version-note { text-align: center; font-size: 0.72rem; color: var(--muted); padding: 24px; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <span class="header-title">設定</span>
    </header>

    <div class="page" style="padding-bottom:80px">

      <!-- プロフィール -->
      <div class="settings-section">
        <div class="settings-label">プロフィール</div>
        <div class="profile-card" id="profileCard">
          <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
      </div>

      <!-- 家族メンバー管理 -->
      <div class="settings-section">
        <div class="settings-label">家族メンバー</div>
        <!-- 新規追加フォーム -->
        <div class="fam-form hidden" id="famNewForm">
          <div class="fam-form-title">&#43; 新しいメンバーを追加</div>
          <div class="fam-form-row">
            <div class="fam-form-label">名前（ニックネーム）</div>
            <input type="text" id="famNewName" class="form-input" placeholder="例：ママ・太郎・パパ" maxlength="20">
          </div>
          <div class="fam-form-row">
            <div class="fam-form-label">アレルギー食材</div>
            <div class="allergy-chips" id="famNewAllergyChips"></div>
            <div class="allergy-input-row" style="margin-top:8px">
              <input type="text" id="famNewAllergyInput" class="form-input"
                     placeholder="例：卵・小麦・乳（Enterで追加）" maxlength="20"
                     onkeydown="if(event.key==='Enter'){addAllergyChip('famNewAllergyChips','famNewAllergyInput');event.preventDefault();}">
              <button class="btn btn-secondary" onclick="addAllergyChip('famNewAllergyChips','famNewAllergyInput')" style="padding:8px 14px;font-size:0.82rem">追加</button>
            </div>
          </div>
          <div class="fam-form-actions">
            <button class="btn btn-secondary" onclick="cancelNewMember()">キャンセル</button>
            <button class="btn btn-primary" onclick="saveNewMember()">保存</button>
          </div>
        </div>
        <!-- メンバー一覧 -->
        <div class="fam-list" id="famList">
          <div class="loading-dots" style="padding:16px 0;justify-content:center"><span></span><span></span><span></span></div>
        </div>
        <!-- 追加ボタン -->
        <button class="fam-add-btn" id="famAddBtn" style="margin-top:10px" onclick="showNewMemberForm()">
          &#43; メンバーを追加
        </button>
      </div>

      <!-- 世帯設定 -->
      <div class="settings-section">
        <div class="settings-label">世帯・共有</div>
        <div class="settings-list">
          <div class="settings-item" onclick="toggleSection('inviteSection')">
            <span class="icon">&#128228;</span>
            <span class="label">家族を招待する</span>
            <span class="arrow" id="inviteArrow">&#8250;</span>
          </div>
          <div class="settings-item" onclick="toggleSection('joinSection')">
            <span class="icon">&#128229;</span>
            <span class="label">招待コードで参加する</span>
            <span class="arrow" id="joinArrow">&#8250;</span>
          </div>
          <div class="settings-item" id="householdNameItem" onclick="toggleSection('householdNameSection')">
            <span class="icon">&#127968;</span>
            <span class="label">世帯名</span>
            <span class="value" id="householdName">読込中...</span>
            <span class="arrow" id="householdNameArrow">&#8250;</span>
          </div>
        </div>

        <!-- Taveraアカウントメンバー一覧 -->
        <div id="memberSection" class="hidden" style="margin-top:4px;padding:8px 0 0;">
          <div style="font-size:0.72rem;font-weight:700;color:var(--muted);letter-spacing:0.08em;padding:0 2px 6px;">
            参加中のアカウント（<span id="memberCount">0</span>人）
          </div>
          <div class="member-list" id="memberList"></div>
        </div>

        <!-- 世帯を離れる -->
        <div id="leaveSection" class="hidden" style="margin-top:12px;">
          <button onclick="leaveHousehold()"
                  style="width:100%;padding:10px;background:none;border:1px solid var(--border);border-radius:var(--radius-md);color:var(--muted);font-size:0.82rem;cursor:pointer;">
            この世帯を離れる
          </button>
        </div>
      </div>

      <!-- 招待コード発行 -->
      <div class="settings-section hidden" id="inviteSection">
        <div class="invite-box">
          <p>招待コードをコピーして<br>家族のTaveraアカウントで入力してもらってください</p>
          <div style="font-family:monospace;font-size:1.4rem;font-weight:700;color:var(--terra);letter-spacing:0.15em;margin-bottom:12px;" id="inviteCode">-</div>
          <button class="btn btn-primary" onclick="copyInviteCode()">コードをコピー</button>
        </div>
      </div>

      <!-- 世帯名編集 -->
      <div class="settings-section hidden" id="householdNameSection">
        <div class="join-box">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
            <p style="margin:0;">世帯名を変更する</p>
            <button onclick="toggleSection('householdNameSection')"
                    style="background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:0 4px;">&#10005;</button>
          </div>
          <div class="join-input-row">
            <input type="text" id="householdNameInput" class="form-input" placeholder="例：田中家" maxlength="20">
            <button class="btn btn-primary" onclick="saveHouseholdName()">保存</button>
          </div>
        </div>
      </div>

      <!-- 招待コードで参加 -->
      <div class="settings-section hidden" id="joinSection">
        <div class="join-box">
          <p>家族から受け取った8桁の招待コードを入力してください</p>
          <div class="join-input-row">
            <input type="text" id="joinCodeInput" class="form-input"
                   placeholder="XXXXXXXX" maxlength="8"
                   oninput="this.value=this.value.toUpperCase()">
            <button class="btn btn-primary" onclick="joinHousehold()">参加する</button>
          </div>
        </div>
      </div>

      <!-- プラン -->
      <div class="settings-section" id="plan">
        <div class="settings-label">プラン</div>
        <div class="plan-card" id="planCard">
          <div class="loading-dots" style="padding:8px 0;justify-content:center"><span></span><span></span><span></span></div>
        </div>
      </div>

      <!-- その他 -->
      <div class="settings-section">
        <div class="settings-label">その他</div>
        <div class="settings-list">
          <div class="settings-item" onclick="signOut()">
            <span class="icon">&#128682;</span>
            <span class="label" style="color:var(--terra)">ログアウト</span>
          </div>
        </div>
      </div>

      <div class="version-note">Tavera v1.0.1</div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="log.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        記録
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="suggest.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
    </nav>
  </div>

  <script>
    let householdId = null;
    let famMembers  = [];   // { id, nickname, allergies[] }
    let editingId   = null; // 編集中のメンバーID

    // =====================
    //  初期化
    // =====================
    async function init() {
      const user = await requireAuth();
      if (!user) return;
      currentUser = user;
      householdId = await getOrCreateHousehold(user.id);

      // プロフィール
      const card = document.getElementById('profileCard');
      const meta = user.user_metadata;
      card.innerHTML = `
        <img class="profile-avatar" src="${meta.avatar_url || ''}" alt="${meta.full_name || ''}">
        <div class="profile-info">
          <h3>${meta.full_name || 'ユーザー'}</h3>
          <p>${user.email}</p>
        </div>`;

      // 招待コード
      document.getElementById('inviteCode').textContent = householdId?.slice(0,8).toUpperCase() || '-';

      // 自分の名前を更新
      await db.from('menu_members')
        .update({ name: meta.full_name || 'ユーザー' })
        .eq('id', user.id);

      await renderHousehold();
      await renderFamMembers();
      await renderPlanCard();

      // plan=successのクエリパラメータがあればトースト表示
      if (location.search.includes('plan=success')) {
        showToast('🎉 プレミアムプランへようこそ！');
        history.replaceState({}, '', location.pathname + '#plan');
      }
    }

    // =====================
    //  家族メンバー
    // =====================
    async function renderFamMembers() {
      const list = document.getElementById('famList');
      const { data, error } = await db
        .from('menu_family_members')
        .select('*')
        .eq('household_id', householdId)
        .order('created_at');
      famMembers = data || [];

      if (!famMembers.length) {
        list.innerHTML = '<div style="font-size:0.82rem;color:var(--muted);padding:4px 2px">まだメンバーが登録されていません</div>';
        return;
      }

      list.innerHTML = famMembers.map(m => buildFamCard(m)).join('');
    }

    function buildFamCard(m) {
      const allergies = (m.allergies || []);
      const allergyHtml = allergies.length
        ? allergies.map(a => `<span class="allergy-chip">${a}</span>`).join('')
        : '<span class="allergy-none">アレルギーなし</span>';

      // 編集中はフォームを展開
      if (editingId === m.id) {
        return `<div class="fam-card" id="fam-${m.id}">
          <div class="fam-card-head">
            <div class="fam-avatar">&#128100;</div>
            <span class="fam-name">${m.nickname}</span>
          </div>
          <div class="fam-form" style="margin:0;border-color:var(--olive)">
            <div class="fam-form-row">
              <div class="fam-form-label">名前</div>
              <input type="text" id="famEditName" class="form-input" value="${m.nickname}" maxlength="20">
            </div>
            <div class="fam-form-row">
              <div class="fam-form-label">アレルギー食材</div>
              <div class="allergy-chips" id="famEditAllergyChips">
                ${allergies.map(a => `<span class="allergy-chip">${a}<button class="chip-del" onclick="removeAllergyChip(this)">&#10005;</button></span>`).join('')}
              </div>
              <div class="allergy-input-row" style="margin-top:8px">
                <input type="text" id="famEditAllergyInput" class="form-input"
                       placeholder="食材名を入力（Enterで追加）" maxlength="20"
                       onkeydown="if(event.key==='Enter'){addAllergyChip('famEditAllergyChips','famEditAllergyInput');event.preventDefault();}">
                <button class="btn btn-secondary" onclick="addAllergyChip('famEditAllergyChips','famEditAllergyInput')" style="padding:8px 14px;font-size:0.82rem">追加</button>
              </div>
            </div>
            <div class="fam-form-actions">
              <button class="btn btn-secondary" onclick="cancelEdit()">キャンセル</button>
              <button class="btn btn-primary"   onclick="saveEditMember('${m.id}')">保存</button>
            </div>
          </div>
        </div>`;
      }

      return `<div class="fam-card" id="fam-${m.id}">
        <div class="fam-card-head">
          <div class="fam-avatar">&#128100;</div>
          <span class="fam-name">${m.nickname}</span>
          <button class="fam-edit-btn" onclick="startEdit('${m.id}')">編集</button>
          <button class="fam-del-btn"  onclick="deleteMember('${m.id}', '${m.nickname}')" title="削除">&#128465;</button>
        </div>
        <div class="allergy-chips">${allergyHtml}</div>
      </div>`;
    }

    // ---- 新規追加 ----
    function showNewMemberForm() {
      cancelEdit();
      document.getElementById('famNewAllergyChips').innerHTML = '';
      document.getElementById('famNewName').value = '';
      document.getElementById('famNewForm').classList.remove('hidden');
      document.getElementById('famAddBtn').classList.add('hidden');
      setTimeout(() => document.getElementById('famNewName').focus(), 100);
    }
    function cancelNewMember() {
      document.getElementById('famNewForm').classList.add('hidden');
      document.getElementById('famAddBtn').classList.remove('hidden');
    }
    async function saveNewMember() {
      const nickname = document.getElementById('famNewName').value.trim();
      if (!nickname) { showToast('名前を入力してください', 'error'); return; }
      const allergies = getChipValues('famNewAllergyChips');

      const { data, error } = await db.from('menu_family_members').insert({
        household_id: householdId,
        nickname,
        allergies,
        created_by: currentUser.id,
      }).select().single();

      if (error) { showToast('保存に失敗しました', 'error'); return; }
      showToast(`${nickname} を追加しました`, 'success');
      cancelNewMember();
      await renderFamMembers();
    }

    // ---- 編集 ----
    function startEdit(id) {
      cancelNewMember();
      editingId = id;
      renderFamMembersSync();
    }
    function cancelEdit() {
      editingId = null;
      renderFamMembersSync();
    }
    function renderFamMembersSync() {
      const list = document.getElementById('famList');
      if (!famMembers.length) {
        list.innerHTML = '<div style="font-size:0.82rem;color:var(--muted);padding:4px 2px">まだメンバーが登録されていません</div>';
        return;
      }
      list.innerHTML = famMembers.map(m => buildFamCard(m)).join('');
    }
    async function saveEditMember(id) {
      const nickname = document.getElementById('famEditName').value.trim();
      if (!nickname) { showToast('名前を入力してください', 'error'); return; }
      const allergies = getChipValues('famEditAllergyChips');

      const { error } = await db.from('menu_family_members')
        .update({ nickname, allergies })
        .eq('id', id);

      if (error) { showToast('保存に失敗しました', 'error'); return; }
      showToast('更新しました', 'success');
      editingId = null;
      await renderFamMembers();
    }

    // ---- 削除 ----
    async function deleteMember(id, nickname) {
      if (!confirm(`「${nickname}」を削除しますか？`)) return;
      const { error } = await db.from('menu_family_members').delete().eq('id', id);
      if (error) { showToast('削除に失敗しました', 'error'); return; }
      showToast(`${nickname} を削除しました`, 'info');
      await renderFamMembers();
    }

    // =====================
    //  アレルギーチップ操作
    // =====================
    function addAllergyChip(chipsId, inputId) {
      const input = document.getElementById(inputId);
      const val = input.value.trim();
      if (!val) return;
      const chips = document.getElementById(chipsId);
      // 重複チェック
      const existing = getChipValues(chipsId);
      if (existing.includes(val)) { showToast('すでに追加されています', 'info'); input.value = ''; return; }
      const chip = document.createElement('span');
      chip.className = 'allergy-chip';
      chip.innerHTML = `${val}<button class="chip-del" onclick="removeAllergyChip(this)">&#10005;</button>`;
      chips.appendChild(chip);
      input.value = '';
      input.focus();
    }
    function removeAllergyChip(btn) {
      btn.closest('.allergy-chip').remove();
    }
    function getChipValues(chipsId) {
      return Array.from(document.querySelectorAll(`#${chipsId} .allergy-chip`))
        .map(c => c.childNodes[0].textContent.trim())
        .filter(Boolean);
    }

    // =====================
    //  世帯・その他
    // =====================
    async function renderHousehold() {
      if (!householdId) return;
      const { data: hh } = await db.from('menu_households').select('name').eq('id', householdId).single();
      document.getElementById('householdName').textContent = hh?.name || 'わが家';

      const members = await getHouseholdMembers(householdId);
      const memberSection = document.getElementById('memberSection');
      const list = document.getElementById('memberList');
      if (members.length > 0) {
        document.getElementById('memberCount').textContent = members.length;
        list.innerHTML = members.map(m => `
          <div class="member-item">
            <span>&#128100;</span>
            <span>${m.name || 'メンバー'}</span>
            <span class="member-role">${m.role === 'owner' ? 'オーナー' : 'メンバー'}</span>
          </div>`).join('');
        memberSection.classList.remove('hidden');
      } else {
        memberSection.classList.add('hidden');
      }

      const myRecord = members.find(m => m.id === currentUser.id);
      const isOwner = myRecord?.role === 'owner';
      const householdNameItem  = document.getElementById('householdNameItem');
      const householdNameArrow = document.getElementById('householdNameArrow');
      if (!isOwner) {
        householdNameItem.style.cursor = 'default';
        householdNameItem.onclick = null;
        householdNameArrow.style.display = 'none';
      }
      const leaveSection = document.getElementById('leaveSection');
      if (members.length > 1 && !isOwner) {
        leaveSection.classList.remove('hidden');
      } else {
        leaveSection.classList.add('hidden');
      }
    }

    function toggleSection(id) {
      const section = document.getElementById(id);
      const isHidden = section.classList.toggle('hidden');
      const arrowMap = { inviteSection: 'inviteArrow', joinSection: 'joinArrow' };
      const arrowId = arrowMap[id];
      if (arrowId) document.getElementById(arrowId).textContent = isHidden ? '&#8250;' : '&#8964;';
      if (id === 'householdNameSection' && !isHidden) {
        const currentName = document.getElementById('householdName').textContent;
        const input = document.getElementById('householdNameInput');
        input.value = currentName;
        setTimeout(() => input.focus(), 100);
      }
    }

    function copyInviteCode() {
      const code = document.getElementById('inviteCode').textContent;
      navigator.clipboard.writeText(code)
        .then(() => showToast('招待コードをコピーしました！', 'success'))
        .catch(() => showToast('コード: ' + code, 'info'));
    }

    async function leaveHousehold() {
      if (!confirm('この世帯を離れますか？\n\n・あなたのアカウントに新しい個人世帯が作られます\n・元の世帯の記録はそのまま残ります')) return;
      const btn = event.target;
      btn.textContent = '処理中...'; btn.disabled = true;
      const { data: newHousehold, error: hErr } = await db
        .from('menu_households').insert({ created_by: currentUser.id, name: 'わが家' }).select().single();
      if (hErr) { showToast('エラーが発生しました', 'error'); btn.textContent = 'この世帯を離れる'; btn.disabled = false; return; }
      const { error: mErr } = await db.from('menu_members')
        .update({ household_id: newHousehold.id, role: 'owner' }).eq('id', currentUser.id);
      if (mErr) { showToast('エラーが発生しました', 'error'); btn.textContent = 'この世帯を離れる'; btn.disabled = false; return; }
      showToast('世帯を離れました', 'info');
      setTimeout(() => location.reload(), 1200);
    }

    async function saveHouseholdName() {
      const name = document.getElementById('householdNameInput').value.trim();
      if (!name) { showToast('世帯名を入力してください', 'error'); return; }
      const btn = event.target;
      btn.textContent = '保存中...'; btn.disabled = true;
      const { error } = await db.from('menu_households').update({ name }).eq('id', householdId);
      btn.textContent = '保存'; btn.disabled = false;
      if (!error) {
        document.getElementById('householdName').textContent = name;
        document.getElementById('householdNameInput').value = '';
        document.getElementById('householdNameSection').classList.add('hidden');
        document.getElementById('householdNameArrow').textContent = '&#8250;';
        showToast('世帯名を変更しました', 'success');
      } else { showToast('保存に失敗しました', 'error'); }
    }

    async function joinHousehold() {
      const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
      if (code.length < 4) { showToast('招待コードを入力してください', 'error'); return; }
      const btn = event.target;
      btn.textContent = '確認中...'; btn.disabled = true;
      const result = await joinHouseholdByCode(currentUser.id, code);
      btn.textContent = '参加する'; btn.disabled = false;
      if (result.ok) {
        showToast(`「${result.householdName}」に参加しました！`, 'success');
        householdId = await getOrCreateHousehold(currentUser.id);
        document.getElementById('inviteCode').textContent = householdId?.slice(0,8).toUpperCase() || '-';
        document.getElementById('joinCodeInput').value = '';
        document.getElementById('joinSection').classList.add('hidden');
        document.getElementById('joinArrow').textContent = '&#8250;';
        await renderHousehold();
        await renderFamMembers();
      } else { showToast(result.message, 'error'); }
    }

    init();

    // =====================
    //  プランカード
    // =====================
    async function renderPlanCard() {
      if (!currentUser) return;
      const card = document.getElementById('planCard');
      if (!card) return;

      const { data: member } = await db
        .from('menu_members')
        .select('plan, plan_expires_at')
        .eq('id', currentUser.id)
        .single();

      const plan = member?.plan || 'free';
      const isPremium = plan === 'premium' &&
        (!member?.plan_expires_at || new Date(member.plan_expires_at) > new Date());

      if (isPremium) {
        const expires = member.plan_expires_at
          ? new Date(member.plan_expires_at).toLocaleDateString('ja-JP')
          : '';
        card.innerHTML = `
          <div class="plan-badge premium">✨ プレミアム</div>
          <div class="plan-usage">AI提案は<span class="count">無制限</span>でご利用いただけます。${expires ? '<br>次回更新日：' + expires : ''}</div>
          <button class="plan-manage-btn" onclick="manageSubscription()">サブスクリプションを管理</button>`;
      } else {
        const month = new Date().toISOString().slice(0, 7);
        const { data: usage } = await db
          .from('menu_ai_usage')
          .select('count')
          .eq('user_id', currentUser.id)
          .eq('month', month)
          .maybeSingle();
        const used = usage?.count || 0;
        const remaining = 10 - used;
        const warnClass = remaining <= 3 ? 'warn' : '';
        card.innerHTML = `
          <div class="plan-badge free">無料プラン</div>
          <div class="plan-usage">今月のAI提案：<span class="count ${warnClass}">${used} / 10回</span>使用<br>残り<span class="count ${warnClass}">${remaining}回</span>利用できます。</div>
          <button class="plan-upgrade-btn" onclick="startCheckout()">✨ プレミアムにアップグレード（¥480/月）</button>`;
      }
    }

    async function startCheckout() {
      const btn = document.querySelector('.plan-upgrade-btn');
      if (btn) { btn.textContent = '処理中...'; btn.disabled = true; }
      try {
        const { data, error } = await db.functions.invoke('tavera-checkout', {
          body: {
            successUrl: location.origin + '/settings.html?plan=success',
            cancelUrl: location.origin + '/settings.html#plan',
          },
        });
        if (error) throw error;
        if (data?.url) {
          location.href = data.url;
        } else {
          showToast('決済ページへの遷移に失敗しました', 'error');
          if (btn) { btn.textContent = '✨ プレミアムにアップグレード（¥480/月）'; btn.disabled = false; }
        }
      } catch(e) {
        showToast('エラーが発生しました', 'error');
        if (btn) { btn.textContent = '✨ プレミアムにアップグレード（¥480/月）'; btn.disabled = false; }
      }
    }

    function manageSubscription() {
      showToast('解約はStripeカスタマーポータルから行えます');
    }
  </script>
</body>
</html>
