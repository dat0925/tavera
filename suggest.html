<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AI献立提案 - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-log.js"></script>
  <script src="js/suggest.js"></script>
  <style>
    .chat-page {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 57px - 60px);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-bubble { animation: fadeInUp 0.3s ease; }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0 8px;
    }
    .quick-chip {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 0.8rem;
      color: var(--brown);
      cursor: pointer;
      transition: all var(--transition);
    }
    .quick-chip:hover {
      border-color: var(--terra);
      color: var(--terra);
      background: #FEF3EC;
    }

    /* 冷蔵庫バナー */
    .fridge-banner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #EEF3E2;
      border: 1.5px solid var(--olive);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: var(--olive);
      font-weight: 500;
    }
    .fridge-banner-items {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggest-card {
      background: var(--white);
      border: 1.5px solid var(--amber);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: 8px;
    }
    .suggest-card h4 {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--terra);
      margin-bottom: 6px;
    }
    .suggest-card p {
      font-size: 0.85rem;
      color: var(--brown);
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .chat-input-wrap {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--white);
    }
    .chat-input-wrap textarea {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      max-height: 100px;
      overflow-y: auto;
      font-family: var(--font-body);
      line-height: 1.5;
    }
    .chat-input-wrap textarea:focus { border-color: var(--terra); }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--terra);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      transition: background var(--transition);
      font-size: 1.1rem;
    }
    .send-btn:hover { background: #b8451f; }
    .send-btn:disabled { background: var(--border); cursor: default; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <span class="header-title">✨ AI献立提案</span>
    </header>

    <div class="chat-page">
      <div class="chat-messages" id="chatMessages">
        <div class="chat-bubble ai">
          <div class="loading-dots" style="padding:8px 0"><span></span><span></span><span></span></div>
        </div>
      </div>

      <div class="chat-input-wrap">
        <textarea id="chatInput" rows="1" placeholder="食材・気分・予算など..."
                  onkeydown="handleKey(event)"
                  oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="log.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        記録
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="suggest.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
    </nav>
  </div>

  <script>
    let householdId = null;
    let isLoading = false;
    let recentDishes = [];
    let likedDishesCache = [];
    let fridgeItemsCache = [];
    const messages = [];

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      householdId = await getOrCreateHousehold(user.id);

      try {
        [recentDishes, likedDishesCache, fridgeItemsCache] = await Promise.all([
          getLogsForWeek(householdId),
          getLikedDishes(householdId, 5),
          getFridgeItems(householdId),
        ]);
      } catch (_) {}

      renderWelcome();
    }

    function renderWelcome() {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';

      const weekNames = [...new Set(recentDishes.map(l => l.dish_name))];

      // 冷蔵庫バナー
      let fridgeBannerHtml = '';
      if (fridgeItemsCache.length > 0) {
        const names = fridgeItemsCache.map(i => i.name).join('・');
        fridgeBannerHtml = `
          <div class="fridge-banner">
            <span>🧊</span>
            <span class="fridge-banner-items">${names}</span>
          </div>
        `;
      }

      // 挨拶文
      let greeting;
      if (fridgeItemsCache.length > 0) {
        const fridgeNames = fridgeItemsCache.slice(0, 3).map(i => i.name).join('・');
        greeting = `こんにちは！🍳
冷蔵庫に${fridgeNames}${fridgeItemsCache.length > 3 ? 'など' : ''}がありますね。
これを使った献立を提案できます！`;
      } else if (weekNames.length === 0) {
        greeting = 'こんにちは！今日の献立をお手伝いします🍳
まだ今週の記録がないですね。どんなメニューにしますか？';
      } else {
        const preview = weekNames.slice(0, 3).join('・');
        const suffix = weekNames.length > 3 ? `など${weekNames.length}品` : '';
        greeting = `こんにちは！🍳
今週は${preview}${suffix}を食べましたね。
明日の夕食はどうしますか？`;
      }

      const chips = buildChips(weekNames);

      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ai';
      bubble.innerHTML = `
        ${fridgeBannerHtml}
        <div class="card-surface" style="padding:14px;white-space:pre-wrap;font-size:0.88rem;line-height:1.7;">${greeting}</div>
        <div class="quick-chips" id="quickChips">
          ${chips.map(c => `<button class="quick-chip" onclick="sendQuick(${JSON.stringify(c.message)})">${c.label}</button>`).join('')}
        </div>
      `;
      container.appendChild(bubble);
    }

    function buildChips(weekNames) {
      const chips = [];

      // 冷蔵庫食材があれば最優先チップ
      if (fridgeItemsCache.length > 0) {
        const fridgeNames = fridgeItemsCache.map(i => i.name).join('・');
        chips.push({
          label: '🧊 冷蔵庫の食材を使いたい',
          message: `冷蔵庫に${fridgeNames}があります。これらを使った献立を3つ提案してください。`,
        });
      }

      if (weekNames.length > 0) {
        chips.push({
          label: '今週と違うものがいい',
          message: `今週は${weekNames.slice(0,3).join('・')}を食べました。かぶらない別ジャンルのメニューを3つ提案してください。`,
        });
      }

      if (likedDishesCache.length > 0) {
        const liked = likedDishesCache.slice(0,3).map(d => d.dish_name).join('・');
        chips.push({
          label: '好評メニューに近いものがいい',
          message: `家族に好評だったのは${liked}です。これに近いテイストのメニューを3つ提案してください。`,
        });
      }

      chips.push({
        label: '簡単に作れるものがいい',
        message: '30分以内で作れる簡単なメニューを3つ提案してください。',
      });

      chips.push({
        label: 'お任せで！',
        message: weekNames.length > 0
          ? `今週は${weekNames.slice(0,3).join('・')}を食べました。明日の夕食にぴったりのメニューを3つ提案してください。`
          : '今日の夕食にいいメニューを3つ提案してください。',
      });

      return chips;
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function sendQuick(text) {
      document.getElementById('chatInput').value = text;
      sendMessage();
    }

    function addBubble(text, role) {
      const container = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${role}`;
      bubble.textContent = text;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    function addLoadingBubble() {
      const container = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ai';
      bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      if (isLoading) return;
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';

      addBubble(text, 'user');
      messages.push({ role: 'user', content: text });

      isLoading = true;
      document.getElementById('sendBtn').disabled = true;
      const loadingBubble = addLoadingBubble();

      try {
        const session = await getSession();
        const response = await fetch('https://sfhtvtcmgueystyuhzvd.supabase.co/functions/v1/tavera-suggest', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session?.access_token}`,
          },
          body: JSON.stringify({
            messages,
            likedDishes: likedDishesCache,
            recentDishes: recentDishes.slice(0, 10),
            fridgeItems: fridgeItemsCache.map(i => i.name),  // 冷蔵庫食材を追加
          }),
        });

        const data = await response.json();
        const reply = data.reply || '提案の取得に失敗しました。';

        loadingBubble.remove();
        messages.push({ role: 'assistant', content: reply });

        const replyBubble = document.createElement('div');
        replyBubble.className = 'chat-bubble ai';
        replyBubble.style.whiteSpace = 'pre-wrap';
        replyBubble.style.fontSize = '0.88rem';
        replyBubble.style.lineHeight = '1.7';
        replyBubble.textContent = reply;

        const lines = reply.split('
').filter(l => l.trim());
        const dishCandidates = [];
        lines.forEach(line => {
          const m = line.match(/^[①②③\d]+[\.．\s。]?\s*\*{0,2}([^\*
（(]{2,20})\*{0,2}/);
          if (m) dishCandidates.push(m[1].trim());
        });

        const btnWrap = document.createElement('div');
        btnWrap.style.cssText = 'margin-top:12px;display:flex;flex-direction:column;gap:6px;';

        if (dishCandidates.length > 0) {
          dishCandidates.slice(0, 3).forEach(dish => {
            const btn = document.createElement('button');
            btn.textContent = '📝 ' + dish + ' を記録する';
            btn.style.cssText = 'display:block;padding:8px 16px;border-radius:99px;background:var(--terra);color:#fff;border:none;cursor:pointer;font-size:0.8rem;font-family:inherit;text-align:left;';
            btn.onclick = () => {
              const today = new Date().toISOString().split('T')[0];
              location.href = 'log.html?date=' + today + '&dish=' + encodeURIComponent(dish);
            };
            btnWrap.appendChild(btn);
          });
        } else {
          const btn = document.createElement('button');
          btn.textContent = '📝 この献立を記録する';
          btn.style.cssText = 'display:block;padding:8px 16px;border-radius:99px;background:var(--terra);color:#fff;border:none;cursor:pointer;font-size:0.8rem;font-family:inherit;';
          btn.onclick = () => location.href = 'log.html';
          btnWrap.appendChild(btn);
        }

        replyBubble.appendChild(btnWrap);
        document.getElementById('chatMessages').appendChild(replyBubble);
        document.getElementById('chatMessages').scrollTop = 999999;

      } catch (e) {
        loadingBubble.remove();
        addBubble('エラーが発生しました。もう一度お試しください。', 'ai');
        console.error(e);
      }

      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
    }

    init();
  </script>
</body>
</html>
