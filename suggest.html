<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AI献立提案 - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-log.js"></script>
  <script src="js/suggest.js"></script>
  <style>
    .chat-page {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 57px - 60px);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-bubble { animation: fadeInUp 0.3s ease; }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0 8px;
    }
    .quick-chip {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 0.8rem;
      color: var(--brown);
      cursor: pointer;
      transition: all var(--transition);
    }
    .quick-chip:hover {
      border-color: var(--terra);
      color: var(--terra);
      background: #FEF3EC;
    }

    .suggest-card {
      background: var(--white);
      border: 1.5px solid var(--amber);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-top: 8px;
    }
    .suggest-card h4 {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--terra);
      margin-bottom: 6px;
    }
    .suggest-card p {
      font-size: 0.85rem;
      color: var(--brown);
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .suggest-card .adopt-btn {
      font-size: 0.8rem;
      padding: 6px 14px;
      border-radius: 99px;
      background: var(--terra);
      color: var(--white);
      border: none;
      cursor: pointer;
    }

    .chat-input-wrap {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--white);
    }
    .chat-input-wrap textarea {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      max-height: 100px;
      overflow-y: auto;
      font-family: var(--font-body);
      line-height: 1.5;
    }
    .chat-input-wrap textarea:focus { border-color: var(--terra); }

    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--terra);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: none;
      cursor: pointer;
      transition: background var(--transition);
      font-size: 1.1rem;
    }
    .send-btn:hover { background: #b8451f; }
    .send-btn:disabled { background: var(--border); cursor: default; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <span class="header-title">✨ AI献立提案</span>
    </header>

    <div class="chat-page">
      <div class="chat-messages" id="chatMessages">
        <!-- 初期メッセージ -->
        <div class="chat-bubble ai">
          <div class="card-surface" style="padding:14px;">
            こんにちは！今日の献立をお手伝いします🍳<br>
            冷蔵庫の食材や気分を教えてください。
          </div>
          <div class="quick-chips">
            <button class="quick-chip" onclick="sendQuick('冷蔵庫にある食材から提案して')">食材から提案</button>
            <button class="quick-chip" onclick="sendQuick('今日は簡単に作れるものがいい')">簡単なもの</button>
            <button class="quick-chip" onclick="sendQuick('家族が喜ぶメニューを提案して')">家族が喜ぶ</button>
            <button class="quick-chip" onclick="sendQuick('今日の夕食、予算500円で考えて')">予算500円</button>
          </div>
        </div>
      </div>

      <!-- 入力エリア -->
      <div class="chat-input-wrap">
        <textarea id="chatInput" rows="1" placeholder="食材・気分・予算など..."
                  onkeydown="handleKey(event)"
                  oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="log.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        記録
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="suggest.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
    </nav>
  </div>

  <script>
    let householdId = null;
    let isLoading = false;
    const messages = []; // チャット履歴

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      householdId = await getOrCreateHousehold(user.id);
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 100) + 'px';
    }

    function sendQuick(text) {
      document.getElementById('chatInput').value = text;
      sendMessage();
    }

    function addBubble(text, role) {
      const container = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${role}`;
      bubble.textContent = text;
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    function addLoadingBubble() {
      const container = document.getElementById('chatMessages');
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ai';
      bubble.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
      container.appendChild(bubble);
      container.scrollTop = container.scrollHeight;
      return bubble;
    }

    async function sendMessage() {
      if (isLoading) return;
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      input.style.height = 'auto';

      addBubble(text, 'user');
      messages.push({ role: 'user', content: text });

      isLoading = true;
      document.getElementById('sendBtn').disabled = true;
      const loadingBubble = addLoadingBubble();

      try {
        // 高評価メニューを取得してプロンプトに組み込む
        const liked = await getLikedDishes(householdId, 5);
        const likedNames = liked.map(d => d.dish_name).join('、') || 'なし';

        const systemPrompt = `あなたは家庭料理の献立提案アシスタントです。
家族の好きなメニュー（過去の高評価）: ${likedNames}
ユーザーの要望に応じて、具体的で作りやすい献立を提案してください。
料理名・材料・簡単な作り方・おおよそのコストを含めて提案してください。
日本語で、温かみのある口調で答えてください。`;

        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 1000,
            system: systemPrompt,
            messages: messages,
          }),
        });

        const data = await response.json();
        const reply = data.content?.[0]?.text || '提案の取得に失敗しました。';

        loadingBubble.remove();
        messages.push({ role: 'assistant', content: reply });

        const replyBubble = document.createElement('div');
        replyBubble.className = 'chat-bubble ai';
        replyBubble.style.whiteSpace = 'pre-wrap';
        replyBubble.style.fontSize = '0.88rem';
        replyBubble.style.lineHeight = '1.7';
        replyBubble.textContent = reply;

        // 「記録する」ボタンを追加
        const adoptBtn = document.createElement('button');
        adoptBtn.className = 'adopt-btn';
        adoptBtn.textContent = '📝 この献立を記録する';
        adoptBtn.style.cssText = 'display:block;margin-top:12px;padding:8px 16px;border-radius:99px;background:var(--terra);color:#fff;border:none;cursor:pointer;font-size:0.8rem;font-family:inherit;';
        adoptBtn.onclick = () => location.href = 'log.html';

        replyBubble.appendChild(adoptBtn);
        document.getElementById('chatMessages').appendChild(replyBubble);
        document.getElementById('chatMessages').scrollTop = 999999;

      } catch (e) {
        loadingBubble.remove();
        addBubble('エラーが発生しました。もう一度お試しください。', 'ai');
        console.error(e);
      }

      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
    }

    init();
  </script>
</body>
</html>
