<!DOCTYPE html>
<html lang="ja">
<head>

  <meta http-equiv="Expires" content="0">

  <style>
    /* suggest.html 専用：app-containerをflexにして高さを画面に収める */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;      /* dvh = dynamic viewport height (iOSアドレスバー考慮) */
      overflow: hidden;
    }
    .chat-page { display:flex; flex-direction:column; flex:1; min-height:0; overflow:hidden; }
    @media (min-width: 769px) {
      .chat-page {
        grid-column: 2;
        grid-row: 1 / 3;
        height: 100vh;
        overflow: hidden;
      }
    }
    .chat-messages { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
    .chat-bubble { animation:fadeInUp 0.3s ease; }
    .quick-chips { display:flex; flex-wrap:wrap; gap:8px; padding:4px 0 8px; }
    .quick-chip {
      padding:6px 14px; border-radius:99px;
      border:1.5px solid var(--border); background:var(--white);
      font-size:0.8rem; color:var(--brown); cursor:pointer; transition:all var(--transition);
    }
    .quick-chip:hover { border-color:var(--terra); color:var(--terra); background:#FEF3EC; }
    .fridge-banner {
      display:flex; align-items:center; gap:8px;
      background:#EEF3E2; border:1.5px solid var(--olive);
      border-radius:var(--radius-sm); padding:8px 12px; margin-bottom:4px;
      font-size:0.8rem; color:var(--olive); font-weight:500;
    }
    .fridge-banner-items { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .chat-input-wrap {
      border-top:1px solid var(--border); padding:10px 14px;
      display:flex; gap:10px; align-items:flex-end; background:var(--white);
    }
    .chat-input-wrap textarea {
      flex:1; border:1.5px solid var(--border); border-radius:var(--radius-sm);
      padding:10px 14px; font-size:0.9rem; resize:none; outline:none;
      max-height:100px; overflow-y:auto; font-family:var(--font-body); line-height:1.5;
    }
    .chat-input-wrap textarea:focus { border-color:var(--terra); }
    .send-btn {
      width:42px; height:42px; border-radius:50%;
      background:var(--terra); color:var(--white);
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; border:none; cursor:pointer;
      transition:background var(--transition); font-size:1.1rem;
    }
    .send-btn:hover { background:#b8451f; }
    .send-btn:disabled { background:var(--border); cursor:default; }
    .usage-bar {
      display:flex; align-items:center; gap:8px;
      padding:6px 14px; background:var(--surface);
      border-bottom:1px solid var(--border);
      font-size:0.75rem; color:var(--muted);
    }
    .usage-bar .usage-count { font-weight:700; color:var(--brown); }
    .usage-bar .upgrade-link {
      margin-left:auto; color:var(--terra); font-weight:700;
      text-decoration:none; font-size:0.75rem;
    }
    .paywall-msg {
      margin:20px 16px; padding:20px;
      background:#FEF3EC; border:1.5px solid var(--terra);
      border-radius:var(--radius-md); text-align:center;
    }
    .paywall-msg p { font-size:0.88rem; color:var(--brown); margin-bottom:14px; line-height:1.7; }
    .paywall-btn {
      display:inline-block; padding:10px 28px;
      background:var(--terra); color:#fff; border:none;
      border-radius:99px; font-size:0.88rem; font-weight:700;
      cursor:pointer; font-family:inherit; text-decoration:none;
    }

    /* ---- 記録モーダル（日付・食事区分選択） ---- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(74,46,26,0.4);
      z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    .modal-sheet {
      width: 100%; max-width: 480px;
      background: var(--white);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 24px 20px 32px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform:translateY(60px);opacity:0 } to { transform:translateY(0);opacity:1 } }
    .modal-handle { width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 20px; }
    .modal-title { font-family:var(--font-display);font-size:1.1rem;color:var(--brown);margin-bottom:16px;line-height:1.5; }
    .record-field-label { font-size:0.75rem;font-weight:700;color:var(--muted);letter-spacing:0.04em;margin-bottom:6px; }
    .record-date-input {
      width:100%; padding:10px 14px; margin-bottom:16px;
      border:1.5px solid var(--border); border-radius:var(--radius-sm);
      font-size:0.9rem; font-family:inherit; color:var(--brown);
    }
    .record-meal-tab { position: relative; }
    .record-meal-tab .filled-badge {
      position:absolute; top:-6px; right:-4px;
      background:var(--amber); color:#fff;
      font-size:0.6rem; font-weight:700; line-height:1;
      padding:2px 5px; border-radius:99px; white-space:nowrap;
    }
    .record-warning {
      margin-top:12px; padding:10px 12px;
      background:#FEF3EC; border:1.5px solid var(--terra);
      border-radius:var(--radius-sm);
      font-size:0.78rem; color:var(--terra); line-height:1.6;
      display:none;
    }
    .record-warning.visible { display:block; }
    .modal-actions { display:flex;gap:10px;margin-top:20px; }
    .modal-actions .btn { flex:1;padding:14px;font-size:0.88rem; }

    /* ---- 新しい相談ボタン ----
       .app-header .header-right / .kyushoku-btn はiPad/PCレイアウトで
       display:none!important になる既存ルールがあるため、それに巻き込まれないよう
       .chat-page内に独立したツールバーとして置く */
    .chat-toolbar { display:flex; justify-content:flex-end; padding:8px 16px 0; }
    .chat-toolbar-link {
      font-size:0.75rem; color:var(--muted); white-space:nowrap;
      padding:4px 10px; border:1px solid var(--border); border-radius:99px;
      text-decoration:none; transition:all var(--transition);
    }
    .chat-toolbar-link:hover { border-color:var(--terra); color:var(--terra); }
  </style>
</head>
<body>

  <script>
    var householdId = null;
    var familyMembers = [];
    var isLoading = false;
    var pendingRecord = null;  // { dish, ingredients, description } AI提案から記録待ちの内容
    var recordLogsCache = {};  // dateStr -> その日のmenu_logs（記録モーダルの「登録済み」表示用）
    var CHAT_STORAGE_PREFIX = 'tavera_suggest_chat_';
    var chatStorageKey = null;  // ユーザーごとに会話を分けるため、init()でuser.idから組み立てる
    var lastUsageState = null;  // { used, remaining, limit, plan } 復元時の利用回数バー表示用

    function updateUsageBar(used, remaining, limit, plan) {
      lastUsageState = { used: used, remaining: remaining, limit: limit, plan: plan };
      var bar = document.getElementById('usageBar');
      var cnt = document.getElementById('usageCount');
      var limitEl = document.getElementById('usageLimit');
      var upgradeLink = document.getElementById('upgradeLink');
      bar.style.display = 'flex';
      cnt.textContent = used;
      limitEl.textContent = limit;
      upgradeLink.style.display = plan === 'premium' ? 'none' : '';
      if (remaining <= 0) {
        cnt.style.color = 'var(--terra)';
      } else if (remaining <= Math.max(3, limit * 0.1)) {
        cnt.style.color = '#E8932A';
      } else {
        cnt.style.color = 'var(--brown)';
      }
    }

    // 会話の保存・復元（画面を切り替えて戻ってきても提案が消えないようにする）
    // localStorageに保存するため、アプリを完全に閉じても次回起動時まで残る。
    // ユーザーごとにキーを分けているので、同じ端末で別アカウントに切り替えても
    // 他人の相談内容が混ざらない。
    function loadChatState() {
      if (!chatStorageKey) return null;
      try {
        var raw = localStorage.getItem(chatStorageKey);
        return raw ? JSON.parse(raw) : null;
      } catch(e) { return null; }
    }

    function saveChatState() {
      if (!chatStorageKey) return;
      try {
        localStorage.setItem(chatStorageKey, JSON.stringify({
          messages: chatMessages,
          usage: lastUsageState,
        }));
      } catch(e) { /* 容量超過・プライベートモード等は無視して継続 */ }
    }

    function startNewConversation() {
      if (chatMessages.length > 0 && !confirm('今の相談内容を消して、新しく始めますか？')) return;
      chatMessages = [];
      lastUsageState = null;
      if (chatStorageKey) {
        try { localStorage.removeItem(chatStorageKey); } catch(e) {}
      }
      document.getElementById('usageBar').style.display = 'none';
      renderWelcome();
    }

    function showPaywall(limit, plan) {
      var c = document.getElementById('chatMessages');
      var div = document.createElement('div');
      div.className = 'paywall-msg';
      div.innerHTML = '<p>今月のAI提案（' + (limit || 10) + '回）を使い切りました。<br>' +
        (plan === 'premium' ? '来月また利用できます。' : 'プレミアムプランなら月300回までご利用いただけます。') + '</p>' +
        '<a href="settings.html#plan" class="paywall-btn">✨ プレミアムにアップグレード</a>';
      c.appendChild(div);
      c.scrollTop = 999999;
    }
    var recentDishes = [];
    var likedDishesCache = [];
    var fridgeItemsCache = [];
    var chatMessages = [];

    async function init() {
      try {
        var user = await requireAuth();
        if (!user) return;
        householdId = await getOrCreateHousehold(user.id);
        chatStorageKey = CHAT_STORAGE_PREFIX + user.id;
        try { familyMembers = await getFamilyMembers(householdId); } catch(e) { familyMembers = []; }
        try { recentDishes = await getLogsForWeek(householdId); } catch(e) { recentDishes = []; }
        try { likedDishesCache = await getLikedDishes(householdId, 5); } catch(e) { likedDishesCache = []; }
        try {
          if (typeof getFridgeItems === 'function') {
            fridgeItemsCache = await getFridgeItems(householdId);
          }
        } catch(e) { fridgeItemsCache = []; }

        // 保存済みの会話があれば復元し、無ければウェルカム表示
        var saved = loadChatState();
        if (saved && saved.messages && saved.messages.length > 0) {
          chatMessages = saved.messages;
          var container = document.getElementById('chatMessages');
          container.innerHTML = '';
          chatMessages.forEach(function(m) {
            if (m.role === 'user') {
              addBubble(m.content, 'user');
            } else {
              renderAssistantReply(m.content, false);
            }
          });
          if (saved.usage) {
            updateUsageBar(saved.usage.used, saved.usage.remaining, saved.usage.limit, saved.usage.plan);
          }
          container.scrollTop = 999999;
        } else {
          chatMessages = [];
          renderWelcome();
        }
      } catch(e) {
        console.error('init error:', e);
        renderWelcome();
      }
    }

    function renderWelcome() {
      var container = document.getElementById('chatMessages');
      container.innerHTML = '';
      var weekNames = Array.from(new Set((recentDishes || []).map(function(l) { return l.dish_name; })));

      var fridgeBannerHtml = '';
      if (fridgeItemsCache && fridgeItemsCache.length > 0) {
        var names = fridgeItemsCache.map(function(i) { return i.name; }).join('・');
        fridgeBannerHtml = '<div class="fridge-banner"><span>🧊</span><span class="fridge-banner-items">' + names + '</span></div>';
      }

      var greeting;
      if (fridgeItemsCache && fridgeItemsCache.length > 0) {
        var fn = fridgeItemsCache.slice(0, 3).map(function(i) { return i.name; }).join('・');
        var suffix = fridgeItemsCache.length > 3 ? 'など' : '';
        greeting = 'こんにちは！🍳\n冷蔵庫に' + fn + suffix + 'がありますね。\nこれを使った献立を提案できます！';
      } else if (weekNames.length === 0) {
        greeting = 'こんにちは！今日の献立をお手伝いします🍳\nまだ今週の記録がないですね。どんなメニューにしますか？';
      } else {
        var preview = weekNames.slice(0, 3).join('・');
        var suf = weekNames.length > 3 ? ('など' + weekNames.length + '品') : '';
        greeting = 'こんにちは！🍳\n今週は' + preview + suf + 'を食べましたね。\n明日の夕食はどうしますか？';
      }

      var chips = buildChips(weekNames);
      var chipsHtml = chips.map(function(c) {
        return '<button class="quick-chip" onclick=\'sendQuick(' + JSON.stringify(c.message) + ')\'>' + c.label + '</button>';
      }).join('');

      var bubble = document.createElement('div');
      bubble.className = 'chat-bubble ai';
      bubble.innerHTML = fridgeBannerHtml +
        '<div class="card-surface" style="padding:14px;white-space:pre-wrap;font-size:0.88rem;line-height:1.7;">' + greeting + '</div>' +
        '<div class="quick-chips">' + chipsHtml + '</div>';
      container.appendChild(bubble);
    }

    function buildChips(weekNames) {
      var chips = [];
      if (fridgeItemsCache && fridgeItemsCache.length > 0) {
        var fn = fridgeItemsCache.map(function(i) { return i.name; }).join('・');
        chips.push({ label: '🧊 冷蔵庫の食材を使いたい', message: '冷蔵庫に' + fn + 'があります。これらを使った献立を3つ提案してください。' });
      }
      if (weekNames.length > 0) {
        chips.push({ label: '今週と違うものがいい', message: '今週は' + weekNames.slice(0,3).join('・') + 'を食べました。かぶらない別ジャンルのメニューを3つ提案してください。' });
      }
      if (likedDishesCache && likedDishesCache.length > 0) {
        var liked = likedDishesCache.slice(0, 3).map(function(d) { return d.dish_name; }).join('・');
        chips.push({ label: '好評メニューに近いものがいい', message: '家族に好評だったのは' + liked + 'です。これに近いテイストのメニューを3つ提案してください。' });
      }
      chips.push({ label: '簡単に作れるものがいい', message: '30分以内で作れる簡単なメニューを3つ提案してください。' });
      chips.push({ label: 'お任せで！', message: weekNames.length > 0 ? ('今週は' + weekNames.slice(0,3).join('・') + 'を食べました。明日の夕食にぴったりのメニューを3つ提案してください。') : '今日の夕食にいいメニューを3つ提案してください。' });
      return chips;
    }

    // AI返答から料理名と食材を抽出
    function parseDishBlocks(reply) {
      var results = [];
      var lines = reply.split('\n');
      var currentDish = null;

      lines.forEach(function(line) {
        var trimmed = line.trim();
        if (!trimmed) return;

        // 料理名行: 番号で始まる行（①②③ or 1. 2. 3.）
        var nameCandidate = null;
        if (/^[①②③]/.test(trimmed)) {
          nameCandidate = trimmed.slice(1).replace(/^\s*\**\s*/, '').replace(/\**\s*$/, '').trim();
        } else if (/^\d+[.\s]/.test(trimmed)) {
          nameCandidate = trimmed.replace(/^\d+[.\s]\s*/, '').replace(/^\**\s*/, '').replace(/\**\s*$/, '').trim();
        }
        if (nameCandidate && nameCandidate.length >= 2 && nameCandidate.length <= 25) {
          if (currentDish) results.push(currentDish);
          currentDish = { name: nameCandidate, ingredients: [], description: '' };
          return;
        }

        if (!currentDish) return;

        // 食材行: 「食材：」「材料：」に続く行
        if (/[食材材料][：:]/.test(trimmed)) {
          var afterColon = trimmed.replace(/^.+[：:]/, '').trim();
          var ings = afterColon.split(/[、,・\s]+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length > 0 && s.length <= 15; });
          currentDish.ingredients = currentDish.ingredients.concat(ings);
          return;
        }

        // 箇条書き食材: 「・鶏もも肉」「- 醤油」
        if (/^[・\-]/.test(trimmed)) {
          var ing = trimmed.slice(1).trim();
          if (ing.length >= 1 && ing.length <= 15 && !/[。！？]/.test(ing)) {
            currentDish.ingredients.push(ing);
          }
          return;
        }

        // 説明文: 食材行・箇条書き以外で句読点を含む行を説明として取得
        if (!currentDish.description && trimmed.length > 10 && /[。、]/.test(trimmed)) {
          currentDish.description = trimmed;
        }
      });

      if (currentDish) results.push(currentDish);
      return results;
    }

        function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
    function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; }
    function sendQuick(text) { document.getElementById('chatInput').value = text; sendMessage(); }

    function addBubble(text, role) {
      var c = document.getElementById('chatMessages');
      var b = document.createElement('div');
      b.className = 'chat-bubble ' + role;
      b.textContent = text;
      c.appendChild(b); c.scrollTop = c.scrollHeight;
      return b;
    }
    function addLoadingBubble() {
      var c = document.getElementById('chatMessages');
      var b = document.createElement('div');
      b.className = 'chat-bubble ai';
      b.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span></div>';
      c.appendChild(b); c.scrollTop = c.scrollHeight;
      return b;
    }

    async function sendMessage() {
      if (isLoading) return;
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      if (!text) return;
      input.value = ''; input.style.height = 'auto';
      addBubble(text, 'user');
      chatMessages.push({ role: 'user', content: text });
      saveChatState();
      isLoading = true;
      document.getElementById('sendBtn').disabled = true;
      var lb = addLoadingBubble();
      try {
        var session = await getSession();
        var res = await fetch('https://sfhtvtcmgueystyuhzvd.supabase.co/functions/v1/tavera-suggest', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (session && session.access_token ? session.access_token : '')
          },
          body: JSON.stringify({
            messages: chatMessages,
            likedDishes: likedDishesCache,
            recentDishes: recentDishes.slice(0, 10),
            fridgeItems: (fridgeItemsCache || []).map(function(i) { return i.name; })
          })
        });

        // 上限超過チェック
        if (res.status === 429) {
          const errData = await res.json().catch(function() { return {}; });
          lb.remove();
          showPaywall(errData.limit, errData.plan);
          isLoading = false;
          document.getElementById('sendBtn').disabled = false;
          return;
        }

        var data = await res.json();

        // 残り回数バー更新（プラン問わず正確な上限/残数を表示）
        if (data.limit !== null && data.limit !== undefined && data.remaining !== null && data.remaining !== undefined) {
          updateUsageBar(data.limit - data.remaining, data.remaining, data.limit, data.plan);
        }

        var reply = data.reply || '提案の取得に失敗しました。';
        lb.remove();
        renderAssistantReply(reply);
        saveChatState();
      } catch(e) {
        lb.remove();
        addBubble('エラーが発生しました。もう一度お試しください。', 'ai');
        console.error(e);
      }
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
    }

    // AIの返信1件を画面に描画する（料理名の抽出・記録ボタン・食材プレビュー・
    // アレルギー警告まで含む）。pushToHistoryがfalseの場合はchatMessagesへの
    // 追加をスキップする（保存済み会話を復元表示する時に二重登録を防ぐため）
    function renderAssistantReply(reply, pushToHistory) {
      if (pushToHistory !== false) {
        chatMessages.push({ role: 'assistant', content: reply });
      }
      var rb = document.createElement('div');
      rb.className = 'chat-bubble ai';
      rb.style.whiteSpace = 'pre-wrap';
      rb.style.fontSize = '0.88rem';
      rb.style.lineHeight = '1.7';
      rb.textContent = reply;
      // parseDishBlocksで料理名と食材を抽出
      var parsedDishes = parseDishBlocks(reply);
      var bw = document.createElement('div');
      bw.style.cssText = 'margin-top:12px;display:flex;flex-direction:column;gap:6px;';
      if (parsedDishes.length === 0) {
        var btn = document.createElement('button');
        btn.textContent = '📝 この献立を記録する';
        btn.style.cssText = 'display:block;padding:8px 16px;border-radius:99px;background:var(--terra);color:#fff;border:none;cursor:pointer;font-size:0.8rem;font-family:inherit;';
        btn.onclick = function() { openRecordModal('', [], ''); };
        bw.appendChild(btn);
      } else {
        parsedDishes.slice(0, 3).forEach(function(item) {
          var btn = document.createElement('button');
          btn.textContent = '📝 ' + item.name + ' を記録する';
          btn.style.cssText = 'display:block;padding:8px 16px;border-radius:99px;background:var(--terra);color:#fff;border:none;cursor:pointer;font-size:0.8rem;font-family:inherit;text-align:left;';
          btn.onclick = (function(dish, ings, desc) {
            return function() { openRecordModal(dish, ings, desc); };
          })(item.name, item.ingredients, item.description);
          bw.appendChild(btn);
          // 食材プレビュー
          if (item.ingredients && item.ingredients.length > 0) {
            var preview = document.createElement('div');
            preview.style.cssText = 'font-size:0.72rem;color:var(--muted);padding:0 16px 4px;';
            preview.textContent = '🥕 ' + item.ingredients.slice(0, 5).join('・');
            bw.appendChild(preview);
          }
          // アレルギー警告
          if (item.ingredients && item.ingredients.length > 0 && familyMembers.length > 0) {
            var hits = checkAllergies(item.ingredients, familyMembers);
            if (hits.length > 0) {
              var byMember = {};
              hits.forEach(function(h) {
                (byMember[h.memberName] = byMember[h.memberName] || []).push(h.allergen);
              });
              var alertEl = document.createElement('div');
              alertEl.style.cssText = 'font-size:0.75rem;color:var(--terra);padding:2px 16px 8px;line-height:1.6;';
              alertEl.innerHTML = Object.entries(byMember)
                .map(function(e) { return '⚠️ ' + e[0] + '：' + e[1].join('・') + ' が含まれています'; })
                .join('<br>');
              bw.appendChild(alertEl);
            }
          }
        });
      }
      rb.appendChild(bw);
      document.getElementById('chatMessages').appendChild(rb);
      document.getElementById('chatMessages').scrollTop = 999999;
    }

    // ---- 記録モーダル（日付・食事区分の選択） ----
    // AI提案を記録する際、現在時刻から「次に記録するのに最も近い」食事区分を
    // 既定値にしつつ、日付・朝昼夜をユーザーが選び直せるようにする。
    // すでに同じ日付・区分に献立が登録済みの場合は警告を表示する。

    async function getLogsForDateCached(dateStr) {
      if (recordLogsCache[dateStr]) return recordLogsCache[dateStr];
      var logs = [];
      try { logs = await getLogsByDate(householdId, dateStr); } catch(e) { logs = []; }
      recordLogsCache[dateStr] = logs || [];
      return recordLogsCache[dateStr];
    }

    async function refreshRecordModalState() {
      var dateStr = document.getElementById('recordDateInput').value;
      var logs = await getLogsForDateCached(dateStr);
      var filledMeals = {};
      logs.forEach(function(l) { filledMeals[l.meal_type] = l; });

      document.querySelectorAll('.record-meal-tab').forEach(function(tab) {
        var badge = tab.querySelector('.filled-badge');
        badge.classList.toggle('hidden', !filledMeals[tab.dataset.meal]);
      });

      var activeTab = document.querySelector('.record-meal-tab.active');
      var selectedMeal = activeTab ? activeTab.dataset.meal : null;
      var warning = document.getElementById('recordWarning');
      var existing = selectedMeal ? filledMeals[selectedMeal] : null;
      if (existing) {
        warning.textContent = '⚠️ ' + dateStr + 'の' + MEAL_LABELS[selectedMeal] +
          'にはすでに「' + existing.dish_name + '」が登録されています。記録すると上書きされます。';
        warning.classList.add('visible');
      } else {
        warning.classList.remove('visible');
      }
    }

    function selectRecordMealTab(meal) {
      document.querySelectorAll('.record-meal-tab').forEach(function(tab) {
        tab.classList.toggle('active', tab.dataset.meal === meal);
      });
      refreshRecordModalState();
    }

    function openRecordModal(dish, ingredientsArr, description) {
      pendingRecord = { dish: dish || '', ingredients: ingredientsArr || [], description: description || '' };
      recordLogsCache = {};
      var slot = getDefaultMealSlot();
      document.getElementById('recordModalTitle').textContent = dish ? (dish + 'を記録する') : 'この献立を記録する';
      document.getElementById('recordDateInput').value = slot.date;
      selectRecordMealTab(slot.mealType);
      document.getElementById('recordModal').classList.remove('hidden');
    }

    function closeRecordModal(e) {
      if (e && e.target.id !== 'recordModal') return;
      document.getElementById('recordModal').classList.add('hidden');
    }

    function confirmRecord() {
      if (!pendingRecord) return;
      var dateStr = document.getElementById('recordDateInput').value;
      var activeTab = document.querySelector('.record-meal-tab.active');
      var meal = activeTab ? activeTab.dataset.meal : 'dinner';
      var url = 'log.html?date=' + dateStr + '&meal=' + meal;
      if (pendingRecord.dish) {
        url += '&dish=' + encodeURIComponent(pendingRecord.dish);
      }
      if (pendingRecord.ingredients && pendingRecord.ingredients.length > 0) {
        url += '&ingredients=' + encodeURIComponent(pendingRecord.ingredients.join(','));
      }
      if (pendingRecord.description) {
        url += '&memo=' + encodeURIComponent('【AI提案より】\n' + pendingRecord.description);
      }
      location.href = url;
    }

    init();
    initPullToRefresh(async () => { await init(); });
  </script>

  <!-- 記録する日付・食事区分を選ぶモーダル -->
  <div class="modal-overlay hidden" id="recordModal" onclick="closeRecordModal(event)">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title" id="recordModalTitle">この献立を記録する</div>

      <div class="record-field-label">日付</div>
      <input type="date" class="record-date-input" id="recordDateInput" onchange="refreshRecordModalState()">

      <div class="record-field-label">どの食事として記録しますか？</div>
      <div class="meal-tabs" id="recordMealTabs" style="padding:0;">
        <button type="button" class="meal-tab record-meal-tab" data-meal="breakfast" onclick="selectRecordMealTab('breakfast')">
          🌅 朝<span class="filled-badge hidden">済</span>
        </button>
        <button type="button" class="meal-tab record-meal-tab" data-meal="lunch" onclick="selectRecordMealTab('lunch')">
          ☀️ 昼<span class="filled-badge hidden">済</span>
        </button>
        <button type="button" class="meal-tab record-meal-tab" data-meal="dinner" onclick="selectRecordMealTab('dinner')">
          🌙 夜<span class="filled-badge hidden">済</span>
        </button>
      </div>

      <div class="record-warning" id="recordWarning"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeRecordModal()">キャンセル</button>
        <button type="button" class="btn btn-primary" id="recordConfirmBtn" onclick="confirmRecord()">記録する</button>
      </div>
    </div>
  </div>
</body>
</html>
