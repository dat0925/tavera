<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AI献立提案 - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-log.js"></script>
  <style>
    .chat-page {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 57px - 60px);
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .chat-bubble { animation: fadeInUp 0.3s ease; }
    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0 8px;
    }
    .quick-chip {
      padding: 6px 14px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 0.8rem;
      color: var(--brown);
      cursor: pointer;
    }
    .chat-input-wrap {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--white);
    }
    .chat-input-wrap textarea {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.9rem;
      resize: none;
      outline: none;
      max-height: 100px;
      font-family: var(--font-body);
    }
    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--terra);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      border: none; cursor: pointer; font-size: 1.1rem;
    }
    .send-btn:disabled { background: var(--border); }
    #debugLog {
      font-size: 0.7rem; color: red;
      padding: 4px 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <span class="header-title">✨ AI献立提案</span>
    </header>

    <div class="chat-page">
      <div id="debugLog"></div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-bubble ai">
          <div class="loading-dots" style="padding:8px 0"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="chat-input-wrap">
        <textarea id="chatInput" rows="1" placeholder="食材・気分・予算など..."
                  onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="log.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        記録
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="suggest.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
    </nav>
  </div>

  <script>
    let householdId = null;
    let isLoading = false;
    let recentDishes = [];
    let likedDishesCache = [];
    let fridgeItemsCache = [];
    const messages = [];

    function dbg(msg) {
      const el = document.getElementById('debugLog');
      if (el) el.textContent += msg + '
';
      console.log('[DBG]', msg);
    }

    async function init() {
      dbg('init開始');
      try {
        const user = await requireAuth();
        dbg('user: ' + (user ? user.email : 'null'));
        if (!user) return;

        dbg('getOrCreateHousehold...');
        householdId = await getOrCreateHousehold(user.id);
        dbg('householdId: ' + householdId);

        try { recentDishes = await getLogsForWeek(householdId); dbg('recentDishes: ' + recentDishes.length); } catch(e) { dbg('recentDishes失敗: '+e); }
        try { likedDishesCache = await getLikedDishes(householdId, 5); dbg('likedDishes: ' + likedDishesCache.length); } catch(e) { dbg('likedDishes失敗: '+e); }
        try {
          if (typeof getFridgeItems === 'function') {
            fridgeItemsCache = await getFridgeItems(householdId);
            dbg('fridgeItems: ' + fridgeItemsCache.length);
          } else {
            dbg('getFridgeItems未定義');
          }
        } catch(e) { dbg('fridgeItems失敗: '+e); fridgeItemsCache = []; }

        dbg('renderWelcome呼び出し');
        renderWelcome();
        dbg('renderWelcome完了');
      } catch(e) {
        dbg('init例外: ' + e);
        renderWelcome();
      }
    }

    function renderWelcome() {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      const weekNames = [...new Set((recentDishes || []).map(l => l.dish_name))];
      let greeting = 'こんにちは！今日の献立をお手伝いします🍳
どんなメニューにしますか？';
      if (fridgeItemsCache && fridgeItemsCache.length > 0) {
        const n = fridgeItemsCache.slice(0,3).map(i=>i.name).join('・');
        greeting = `こんにちは！🍳
冷蔵庫に${n}がありますね。これを使った献立を提案できます！`;
      } else if (weekNames.length > 0) {
        const preview = weekNames.slice(0,3).join('・');
        greeting = `こんにちは！🍳
今週は${preview}を食べましたね。明日の夕食はどうしますか？`;
      }
      const chips = buildChips(weekNames);
      const bubble = document.createElement('div');
      bubble.className = 'chat-bubble ai';
      bubble.innerHTML = `
        <div class="card-surface" style="padding:14px;white-space:pre-wrap;font-size:0.88rem;line-height:1.7;">${greeting}</div>
        <div class="quick-chips">${chips.map(c=>`<button class="quick-chip" onclick="sendQuick(${JSON.stringify(c.message)})">${c.label}</button>`).join('')}</div>
      `;
      container.appendChild(bubble);
    }

    function buildChips(weekNames) {
      const chips = [];
      if (fridgeItemsCache && fridgeItemsCache.length > 0) {
        const n = fridgeItemsCache.map(i=>i.name).join('・');
        chips.push({ label:'🧊 冷蔵庫の食材を使いたい', message:`冷蔵庫に${n}があります。これらを使った献立を3つ提案してください。` });
      }
      if (weekNames.length > 0) chips.push({ label:'今週と違うものがいい', message:`今週は${weekNames.slice(0,3).join('・')}を食べました。かぶらない別ジャンルのメニューを3つ提案してください。` });
      chips.push({ label:'簡単に作れるものがいい', message:'30分以内で作れる簡単なメニューを3つ提案してください。' });
      chips.push({ label:'お任せで！', message:'今日の夕食にいいメニューを3つ提案してください。' });
      return chips;
    }

    function handleKey(e) { if (e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();} }
    function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
    function sendQuick(text) { document.getElementById('chatInput').value=text; sendMessage(); }

    function addBubble(text, role) {
      const c = document.getElementById('chatMessages');
      const b = document.createElement('div');
      b.className=`chat-bubble ${role}`; b.textContent=text;
      c.appendChild(b); c.scrollTop=c.scrollHeight; return b;
    }
    function addLoadingBubble() {
      const c = document.getElementById('chatMessages');
      const b = document.createElement('div');
      b.className='chat-bubble ai';
      b.innerHTML='<div class="loading-dots"><span></span><span></span><span></span></div>';
      c.appendChild(b); c.scrollTop=c.scrollHeight; return b;
    }

    async function sendMessage() {
      if (isLoading) return;
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      input.value=''; input.style.height='auto';
      addBubble(text,'user');
      messages.push({role:'user',content:text});
      isLoading=true;
      document.getElementById('sendBtn').disabled=true;
      const lb = addLoadingBubble();
      try {
        const session = await getSession();
        const res = await fetch('https://sfhtvtcmgueystyuhzvd.supabase.co/functions/v1/tavera-suggest',{
          method:'POST',
          headers:{'Content-Type':'application/json','Authorization':`Bearer ${session?.access_token}`},
          body:JSON.stringify({messages,likedDishes:likedDishesCache,recentDishes:recentDishes.slice(0,10),fridgeItems:(fridgeItemsCache||[]).map(i=>i.name)}),
        });
        const data = await res.json();
        const reply = data.reply||'提案の取得に失敗しました。';
        lb.remove();
        messages.push({role:'assistant',content:reply});
        const rb = document.createElement('div');
        rb.className='chat-bubble ai';
        rb.style.cssText='white-space:pre-wrap;font-size:0.88rem;line-height:1.7;';
        rb.textContent=reply;
        const lines=reply.split('
').filter(l=>l.trim());
        const dishes=[];
        lines.forEach(l=>{const m=l.match(/^[①②③\d]+[\.．\s。]?\s*\*{0,2}([^\*
（(]{2,20})\*{0,2}/);if(m)dishes.push(m[1].trim());});
        const bw=document.createElement('div');
        bw.style.cssText='margin-top:12px;display:flex;flex-direction:column;gap:6px;';
        (dishes.length>0?dishes.slice(0,3):['この献立']).forEach((d,i)=>{
          const btn=document.createElement('button');
          btn.textContent='📝 '+(dishes.length>0?d:'この献立')+' を記録する';
          btn.style.cssText='display:block;padding:8px 16px;border-radius:99px;background:var(--terra);color:#fff;border:none;cursor:pointer;font-size:0.8rem;font-family:inherit;text-align:left;';
          btn.onclick=()=>{const t=new Date().toISOString().split('T')[0];location.href='log.html?date='+t+'&dish='+encodeURIComponent(d);};
          bw.appendChild(btn);
        });
        rb.appendChild(bw);
        document.getElementById('chatMessages').appendChild(rb);
        document.getElementById('chatMessages').scrollTop=999999;
      } catch(e) {
        lb.remove(); addBubble('エラーが発生しました。もう一度お試しください。','ai'); console.error(e);
      }
      isLoading=false; document.getElementById('sendBtn').disabled=false;
    }

    init();
  </script>
</body>
</html>
