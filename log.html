<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title id="pageTitle">献立を記録 - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=20260629"></script>
  <script src="js/auth.js?v=20260629"></script>
  <script src="js/menu-log.js?v=20260703b"></script>
  <style>
    .log-form { padding: 20px; }

    .date-picker-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .date-picker-row input[type="date"] {
      flex: 1;
    }

    .ingredient-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .ingredient-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #FEF3EC;
      border: 1px solid var(--terra);
      color: var(--terra);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 0.75rem;
    }
    .ingredient-tag button {
      color: var(--terra);
      font-size: 0.9rem;
      line-height: 1;
      padding: 0;
    }

    /* 昨日と同じボタン */
    .yesterday-hint {
      margin-top: 8px;
    }
    .yesterday-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--white); color: var(--brown);
      font-size: 0.82rem; font-family: inherit; cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .yesterday-btn:active { background: var(--surface); border-color: var(--terra); color: var(--terra); }
    .yesterday-btn-dish {
      max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-weight: 600; color: var(--terra);
    }

    .save-area {
      padding: 0 20px 20px;
    }

    .existing-banner {
      display: flex; align-items: center; gap: 8px;
      background: #FEF3EC; border: 1px solid var(--terra);
      border-radius: var(--radius-md); padding: 10px 14px;
      font-size: 0.82rem; color: var(--brown);
      margin: 0 20px 16px;
    }
    .existing-banner .icon { font-size: 1rem; flex-shrink: 0; }

    .comment-toggle-btn {
      width: 100%; display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      font-size: 0.9rem; font-weight: 600; color: var(--brown);
      font-family: inherit; cursor: pointer;
    }
    .comment-toggle-count {
      background: var(--terra); color: #fff;
      font-size: 0.7rem; font-weight: 700;
      min-width: 18px; height: 18px; padding: 0 5px;
      border-radius: 99px; display: inline-flex; align-items: center; justify-content: center;
    }
    .comment-toggle-arrow { margin-left: auto; color: var(--muted); transition: transform 0.15s; }
    .comment-toggle-arrow.open { transform: rotate(90deg); }
    .comment-panel {
      margin-top: 10px; padding: 14px;
      background: var(--surface); border-radius: var(--radius-md);
    }
    .comment-list {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 30vh; overflow-y: auto;
      margin-bottom: 12px;
    }
    .comment-item {
      background: var(--white); border-radius: 12px;
      padding: 8px 12px; font-size: 0.85rem; color: var(--brown);
    }
    .comment-item .meta {
      font-size: 0.68rem; color: var(--muted); margin-top: 3px;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .comment-action-btn {
      background: none; border: none; padding: 0; margin-left: 6px;
      font-size: 0.68rem; color: var(--olive); font-family: inherit; cursor: pointer;
      text-decoration: underline; -webkit-tap-highlight-color: transparent;
    }
    .comment-edited-tag { color: var(--muted); }
    .comment-edit-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #FEF3EC; border: 1px solid var(--terra);
      border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
      font-size: 0.8rem; color: var(--terra);
    }
    .comment-edit-bar button {
      background: none; border: none; color: var(--terra);
      font-size: 0.75rem; text-decoration: underline; cursor: pointer; font-family: inherit;
    }
    .comment-empty {
      font-size: 0.82rem; color: var(--muted); text-align: center; padding: 8px 0;
    }
    .comment-role-toggle {
      display: flex;
      background: var(--white);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .comment-role-toggle button {
      flex: 1; padding: 8px 6px;
      font-size: 0.72rem; font-weight: 600;
      border: none; background: none; color: var(--muted);
      cursor: pointer; transition: all 0.15s; font-family: inherit;
      white-space: nowrap;
    }
    .comment-role-toggle button.active {
      background: var(--terra); color: #fff;
    }
    .comment-stamps {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
    }
    .comment-stamp-btn {
      padding: 7px 12px; border-radius: 99px;
      border: 1.5px solid var(--border); background: var(--white);
      font-size: 0.8rem; color: var(--brown); cursor: pointer;
      font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .comment-stamp-btn:active { border-color: var(--terra); color: var(--terra); background: #FEF3EC; }
    .comment-input-row { display: flex; gap: 8px; }
    .comment-input-row input {
      flex: 1;
      border: 1.5px solid var(--border); border-radius: 99px;
      padding: 10px 14px; font-size: 0.85rem;
      outline: none; font-family: var(--font-body); color: var(--brown);
    }
    .comment-input-row input:focus { border-color: var(--olive); }
    .comment-send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--terra); color: #fff; border: none;
      font-size: 1rem; flex-shrink: 0; cursor: pointer;
    }

    .tip-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--border);
      color: var(--muted);
      font-size: 0.65rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: background var(--transition);
    }
    .tip-icon:hover { background: var(--muted); color: var(--white); }

    .ingredient-tip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.6;
    }
    @media (min-width: 769px) {
      .app-header .btn-ghost { display: none !important; }
      #sidebarLogo { display: flex !important; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <button class="btn-ghost" onclick="history.back()" style="flex-shrink:0;">← 戻る</button>
      <a href="home.html" class="logo" style="display:none;align-items:center;gap:8px;text-decoration:none;" id="sidebarLogo">
        <img src="assets/logo.png" alt="Tavera" style="width:32px;height:32px;object-fit:contain;">
        <span class="logo-text">Tavera</span>
      </a>
      <span class="header-title" id="headerTitle">献立を記録</span>
      <div style="width:60px"></div>
    </header>

    <div class="page">
      <div class="log-form">
        <!-- 既存記録が読み込まれた場合の通知 -->
        <div class="existing-banner" id="existingBanner" style="display:none;">
          <span class="icon" id="existingBannerIcon">📝</span>
          <span id="existingBannerText"></span>
        </div>

        <!-- 日付 -->
        <div class="form-group date-picker-row">
          <input type="date" id="dateInput" class="form-input">
        </div>

        <!-- 朝昼夜タブ -->
        <div class="meal-tabs" style="padding:0 0 16px;">
          <button class="meal-tab active" data-meal="breakfast">🌅 朝</button>
          <button class="meal-tab" data-meal="lunch">☀️ 昼</button>
          <button class="meal-tab" data-meal="dinner">🌙 夜</button>
        </div>

        <!-- 料理名 -->
        <div class="form-group">
          <label class="form-label">料理名</label>
          <input type="text" id="dishName" class="form-input" placeholder="例：鶏の照り焼き" maxlength="50">
        </div>

        <!-- 昨日と同じ -->
        <div class="yesterday-hint" id="yesterdayHint" style="display:none;">
          <button class="yesterday-btn" onclick="applyYesterday()">
            <span>↩ 前日と同じ:</span>
            <span class="yesterday-btn-dish" id="yesterdayDishLabel"></span>
          </button>
        </div>

        <!-- 使用食材 -->
        <div class="form-group">
          <label class="form-label" style="display:flex;align-items:center;gap:6px;">
            使用食材
            <span class="tip-icon" onclick="toggleTip()" title="">？</span>
          </label>
          <div id="ingredientTip" class="ingredient-tip hidden">
            スペース・読点・カンマで区切ると一度に複数登録できます。<br>例：鶏もも肉 醤油 みりん
          </div>
          <input type="text" id="ingredientInput" class="form-input"
                 placeholder="食材名を入力してEnter（複数可）"
                 onkeydown="handleIngredientKey(event)">
          <div class="ingredient-tags" id="ingredientTags"></div>
          <div id="allergyAlert" style="display:none;margin-top:8px;padding:10px 12px;background:#FEF3EC;border:1.5px solid var(--terra);border-radius:8px;font-size:0.8rem;color:var(--terra);line-height:1.6"></div>
        </div>

        <!-- メモ -->
        <div class="form-group">
          <label class="form-label">メモ</label>
          <textarea id="memo" class="form-input" placeholder="アレンジや家族の反応など..." rows="3"></textarea>
        </div>

        <!-- また食べたい度 -->
        <div class="form-group">
          <label class="form-label">また食べたい度</label>
          <div class="rating" id="ratingStars">
            <span class="star" data-val="1">★</span>
            <span class="star" data-val="2">★</span>
            <span class="star" data-val="3">★</span>
            <span class="star" data-val="4">★</span>
            <span class="star" data-val="5">★</span>
          </div>
        </div>

        <!-- コメント -->
        <div class="form-group">
          <button type="button" class="comment-toggle-btn" id="commentToggleBtn" onclick="toggleCommentPanel()">
            💬 コメント<span class="comment-toggle-count" id="commentToggleCount" style="display:none;"></span>
            <span class="comment-toggle-arrow" id="commentToggleArrow">›</span>
          </button>
          <div class="comment-panel hidden" id="commentPanel">
            <div class="comment-list" id="logCommentList"></div>
            <div class="comment-edit-bar" id="logCommentEditBar" style="display:none;">
              <span>✏️ コメントを編集中</span>
              <button type="button" onclick="cancelLogCommentEdit()">キャンセル</button>
            </div>
            <div class="comment-role-toggle" id="logRoleToggle">
              <button id="logRoleEater" onclick="setLogCommentStampMode('eater')">🙏 いただく側</button>
              <button id="logRoleCooker" onclick="setLogCommentStampMode('cooker')">👩‍🍳 つくってくれる側</button>
            </div>
            <div class="comment-stamps" id="logStamps"></div>
            <div class="comment-input-row">
              <input type="text" id="logCommentInput" placeholder="一言メモ（任意）" maxlength="100"
                     onkeydown="if(event.key==='Enter')sendLogComment(null)">
              <button class="comment-send-btn" type="button" onclick="sendLogComment(null)">➤</button>
            </div>
          </div>
        </div>
      </div>

      <div class="save-area">
        <button class="btn btn-primary btn-full" id="saveBtn" onclick="saveMeal()">
          この献立を記録する
        </button>

        <button class="btn btn-ghost btn-full mt-8" id="deleteBtn"
                onclick="deleteMeal()" style="display:none;color:var(--muted)">
          この献立を削除する
        </button>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="log.html" class="nav-add">
        <div class="nav-add-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </a>
      <a href="suggest.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
      <a href="kyushoku.html" class="nav-sidebar-only">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        給食
      </a>
    </nav>
  </div>

  <script>
    let selectedMeal = 'breakfast';
    let selectedRating = 0;
    let ingredients = [];
    let householdId = null;
    let currentMemberId = null;
    let existingLogId = null;
    let isEditMode = false;
    let familyMembers = [];
    let yesterdayLog = null; // 「前日と同じ」の参照元ログ

    // アレルギー警告を更新
    function updateAllergyAlert() {
      const alert = document.getElementById('allergyAlert');
      if (!familyMembers.length || !ingredients.length) { alert.style.display = 'none'; return; }
      const hits = checkAllergies(ingredients, familyMembers);
      if (!hits.length) { alert.style.display = 'none'; return; }
      // メンバーごとにまとめる
      const byMember = {};
      hits.forEach(h => {
        (byMember[h.memberName] = byMember[h.memberName] || []).push(h.allergen);
      });
      const lines = Object.entries(byMember)
        .map(([name, allergens]) => `⚠️ ${name}：${allergens.join('・')} が含まれています`);
      alert.innerHTML = lines.join('<br>');
      alert.style.display = '';
    }

    // 前日の同じ食事区分を確認してヒントを表示
    async function checkYesterdayHint(dateStr, mealType) {
      const hintEl = document.getElementById('yesterdayHint');
      yesterdayLog = null;
      hintEl.style.display = 'none';

      // 既に料理名が入力済み or 既存ログあり → ヒント不要
      if (existingLogId || document.getElementById('dishName').value.trim()) return;

      // 前日の日付を計算
      const d = new Date(dateStr + 'T00:00:00');
      d.setDate(d.getDate() - 1);
      const prevDate = [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');

      const prevLogs = await getLogsByDate(householdId, prevDate);
      const match = prevLogs.find(l => l.meal_type === mealType);
      if (!match || !match.dish_name) return;

      yesterdayLog = match;
      document.getElementById('yesterdayDishLabel').textContent = match.dish_name;
      hintEl.style.display = '';
    }

    // 「前日と同じ」を適用
    function applyYesterday() {
      if (!yesterdayLog) return;
      document.getElementById('dishName').value = yesterdayLog.dish_name || '';
      document.getElementById('memo').value = yesterdayLog.memo || '';
      if (yesterdayLog.ingredients && yesterdayLog.ingredients.length) {
        ingredients = [...yesterdayLog.ingredients];
        renderIngredientTags();
      }
      if (yesterdayLog.rating) setRating(yesterdayLog.rating);
      document.getElementById('yesterdayHint').style.display = 'none';
      yesterdayLog = null;
    }

    function toggleTip() {
      const tip = document.getElementById('ingredientTip');
      tip.classList.toggle('hidden');
    }

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      currentMemberId = user.id;
      householdId = await getOrCreateHousehold(user.id);
      // 家族メンバー（アレルギー照合用）
      familyMembers = await getFamilyMembers(householdId);

      // URLパラメータから日付・食事タイプを取得
      // パラメータが無い場合（例：ボトムナビの＋ボタン）は、現在時刻から
      // 「次に記録するのに最も近い」食事区分・日付を既定値にする
      const params = new URLSearchParams(location.search);
      const defaultSlot = getDefaultMealSlot();
      const dateParam = params.get('date') || defaultSlot.date;
      const mealParam = params.get('meal') || defaultSlot.mealType;
      const dishParam = params.get('dish') || '';
      isEditMode = params.get('edit') === '1';

      document.getElementById('dateInput').value = dateParam;
      selectMealTab(mealParam);

      // AI提案から料理名が渡されていればセット
      if (dishParam) {
        document.getElementById('dishName').value = dishParam;
      }

      // AI提案から食材が渡されていればプリセット（カンマ区切り）
      const ingredientsParam = params.get('ingredients') || '';
      if (ingredientsParam) {
        const preset = ingredientsParam.split(',').map(s => s.trim()).filter(Boolean);
        preset.forEach(ing => {
          if (!ingredients.includes(ing)) ingredients.push(ing);
        });
        renderIngredientTags();
      }

      // AI提案からメモが渡されていればプリセット
      const memoParam = params.get('memo') || '';
      if (memoParam) {
        document.getElementById('memo').value = memoParam;
      }

      // AI提案からの値（dish/ingredients/memo）は、既存データより優先する。
      // そうしないと「すでに記録済みの食事区分」にAI提案を記録しようとした際、
      // 既存データでAI提案の内容が静かに上書きされてしまう（v1.16.2で修正）。
      await loadExisting(dateParam, mealParam, {
        keepDish: !!dishParam,
        keepIngredients: !!ingredientsParam,
        keepMemo: !!memoParam,
      });
      // AI提案・URL経由でもなく新規記録のときだけ前日ヒントを表示
      if (!dishParam && !ingredientsParam && !memoParam && !isEditMode) {
        await checkYesterdayHint(dateParam, mealParam);
      }
      await refreshCommentCount();
    }

    // 既存データ読み込み
    // presetFlagsで指定したフィールドは、既存データがあっても上書きしない
    // （AI提案やURLパラメータから渡された内容を優先するため）
    async function loadExisting(dateStr, mealType, presetFlags) {
      presetFlags = presetFlags || {};
      const banner = document.getElementById('existingBanner');
      banner.style.display = 'none';

      const logs = await getLogsByDate(householdId, dateStr);
      const log = logs.find(l => l.meal_type === mealType);
      if (!log) return;

      existingLogId = log.id;
      if (!presetFlags.keepDish) {
        document.getElementById('dishName').value = log.dish_name || '';
      }
      // 既存ログのメモがある場合は既存を優先（ただしAI提案由来のメモがあれば維持）
      if (!presetFlags.keepMemo && log.memo) {
        document.getElementById('memo').value = log.memo;
      }
      // 既存ログに食材がある場合は既存を優先（ただしAI提案由来の食材があれば維持）
      if (!presetFlags.keepIngredients && log.ingredients && log.ingredients.length > 0) {
        ingredients = log.ingredients;
        renderIngredientTags();
      }
      setRating(log.rating || 0);
      document.getElementById('deleteBtn').style.display = '';

      // すでにこの日・この食事区分に記録がある旨を通知（給食インポート由来かどうかで文言を出し分け）
      document.getElementById('existingBannerIcon').textContent = log.source === 'kyushoku' ? '🍱' : '📝';
      document.getElementById('existingBannerText').textContent = log.source === 'kyushoku'
        ? 'この食事はすでに給食インポートで記録済みです。内容を編集できます'
        : 'この日・この食事区分はすでに記録済みです。内容を編集できます';
      banner.style.display = '';

      // edit=1 で来た場合のみ編集モードUIに切り替え
      if (isEditMode) {
        document.getElementById('headerTitle').textContent = '献立を編集';
        document.getElementById('pageTitle').textContent = '献立を編集 - Tavera';
        document.getElementById('saveBtn').textContent = '変更を保存する';
        document.querySelector('.meal-tabs').style.display = 'none';
      }
    }

    // 食事タイプ切替
    function selectMealTab(mealType) {
      selectedMeal = mealType;
      document.querySelectorAll('.meal-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.meal === mealType);
      });
    }

    document.querySelectorAll('.meal-tab').forEach(tab => {
      tab.addEventListener('click', async () => {
        const dateStr = document.getElementById('dateInput').value;
        selectMealTab(tab.dataset.meal);
        existingLogId = null;
        document.getElementById('dishName').value = '';
        document.getElementById('memo').value = '';
        ingredients = [];
        renderIngredientTags();
        setRating(0);
        document.getElementById('deleteBtn').style.display = 'none';
        document.getElementById('existingBanner').style.display = 'none';
        await loadExisting(dateStr, tab.dataset.meal);
        if (!isEditMode) await checkYesterdayHint(dateStr, tab.dataset.meal);
        await refreshCommentCount();
      });
    });

    document.getElementById('dateInput').addEventListener('change', async (e) => {
      existingLogId = null;
      document.getElementById('dishName').value = '';
      document.getElementById('memo').value = '';
      ingredients = [];
      renderIngredientTags();
      setRating(0);
      document.getElementById('deleteBtn').style.display = 'none';
      document.getElementById('existingBanner').style.display = 'none';
      await loadExisting(e.target.value, selectedMeal);
      if (!isEditMode) await checkYesterdayHint(e.target.value, selectedMeal);
      await refreshCommentCount();
    });

    // 食材タグ
    function handleIngredientKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addIngredient();
      }
    }

    function addIngredient() {
      const input = document.getElementById('ingredientInput');
      const raw = input.value.trim();
      if (!raw) return;
      // 全角・半角スペース、読点、カンマで分割
      const vals = raw.split(/[\s　、,，]+/).map(s => s.trim()).filter(Boolean);
      vals.forEach(val => {
        if (val && !ingredients.includes(val)) {
          ingredients.push(val);
        }
      });
      renderIngredientTags();
      input.value = '';
    }

    document.getElementById('ingredientInput').addEventListener('blur', addIngredient);

    function renderIngredientTags() {
      const container = document.getElementById('ingredientTags');
      container.innerHTML = ingredients.map((ing, i) => `
        <span class="ingredient-tag">
          ${ing}
          <button onclick="removeIngredient(${i})">×</button>
        </span>
      `).join('');
      updateAllergyAlert();
    }

    function removeIngredient(index) {
      ingredients.splice(index, 1);
      renderIngredientTags();
    }

    // 評価
    function setRating(val) {
      selectedRating = val;
      document.querySelectorAll('.star').forEach(s => {
        s.classList.toggle('active', parseInt(s.dataset.val) <= val);
      });
    }

    document.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => setRating(parseInt(star.dataset.val)));
    });

    // 保存
    async function saveMeal() {
      const dishName = document.getElementById('dishName').value.trim();
      if (!dishName) {
        showToast('料理名を入力してください', 'error');
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.textContent = '保存中...';
      btn.disabled = true;

      const dateStr = document.getElementById('dateInput').value;
      const memo = document.getElementById('memo').value.trim();

      const result = await saveLog({
        householdId,
        date: dateStr,
        mealType: selectedMeal,
        dishName,
        memo,
        ingredients,
        rating: selectedRating || null,
      });

      btn.textContent = isEditMode ? '変更を保存する' : 'この献立を記録する';
      btn.disabled = false;

      if (result) {
        showToast(isEditMode ? '更新しました！' : '記録しました！', 'success');
        setTimeout(() => location.href = 'home.html', 1000);
      } else {
        showToast('保存に失敗しました', 'error');
      }
    }

    // 削除
    async function deleteMeal() {
      if (!existingLogId) return;
      if (!confirm('この献立を削除しますか？')) return;

      const ok = await deleteLog(existingLogId);
      if (ok) {
        showToast('削除しました', 'info');
        setTimeout(() => history.back(), 800);
      }
    }

    // ---- コメント ----
    let commentPanelOpen = false;
    let lastLogComments = [];
    let editingLogCommentId = null;
    let editingLogStamp = null;
    let logMemberRole = null;
    let logCommentStampMode = 'eater';

    function setLogCommentStampMode(mode) {
      logCommentStampMode = mode;
      document.getElementById('logRoleEater').classList.toggle('active', mode === 'eater');
      document.getElementById('logRoleCooker').classList.toggle('active', mode === 'cooker');
      const stamps = mode === 'eater' ? EATER_STAMPS : COOKER_STAMPS;
      document.getElementById('logStamps').innerHTML = Object.entries(stamps).map(([key, label]) =>
        `<button class="comment-stamp-btn" onclick="sendLogComment('${key}')">${label}</button>`
      ).join('');
    }

    async function refreshCommentCount() {
      const dateStr = document.getElementById('dateInput').value;
      const counts = await getMealCommentCounts(householdId, dateStr);
      const count = counts[selectedMeal] || 0;
      const countEl = document.getElementById('commentToggleCount');
      if (count) {
        countEl.textContent = count > 9 ? '9+' : count;
        countEl.style.display = '';
      } else {
        countEl.style.display = 'none';
      }
      // パネルが開いたままタブ・日付を切り替えた場合は中身も更新
      if (commentPanelOpen) await renderLogCommentList();
    }

    async function toggleCommentPanel() {
      commentPanelOpen = !commentPanelOpen;
      document.getElementById('commentPanel').classList.toggle('hidden', !commentPanelOpen);
      document.getElementById('commentToggleArrow').classList.toggle('open', commentPanelOpen);
      if (commentPanelOpen) {
        if (logMemberRole === null) logMemberRole = await getMemberRole(currentMemberId);
        setLogCommentStampMode(logMemberRole === 'owner' ? 'cooker' : 'eater');
        renderLogCommentList();
      } else {
        cancelLogCommentEdit();
      }
    }

    async function renderLogCommentList() {
      const dateStr = document.getElementById('dateInput').value;
      const list = document.getElementById('logCommentList');
      list.innerHTML = '<div class="loading-dots" style="justify-content:center;padding:8px 0"><span></span><span></span><span></span></div>';
      const comments = await getMealComments(householdId, dateStr, selectedMeal);
      lastLogComments = comments;
      if (!comments.length) {
        list.innerHTML = '<div class="comment-empty">まだコメントはありません</div>';
        return;
      }
      list.innerHTML = comments.map(c => {
        const name = c.menu_members?.name || (c.source === 'line' ? 'LINEから' : '家族');
        const text = [c.stamp ? MEAL_COMMENT_STAMPS[c.stamp] || c.stamp : null, c.body].filter(Boolean).join('　');
        const time = new Date(c.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const editedTag = c.edited_at
          ? `<span class="comment-edited-tag">（編集済み ${new Date(c.edited_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}）</span>`
          : '';
        const actions = c.author_id === currentMemberId
          ? `<button class="comment-action-btn" onclick="startEditLogComment('${c.id}')">編集</button><button class="comment-action-btn" onclick="deleteLogCommentItem('${c.id}')">削除</button>`
          : '';
        return `
          <div class="comment-item">
            <div>${text}</div>
            <div class="meta">${name}・${time}${c.source === 'line' ? '・LINE' : ''}${editedTag}${actions}</div>
          </div>`;
      }).join('');
      list.scrollTop = list.scrollHeight;
    }

    function startEditLogComment(id) {
      const c = lastLogComments.find(x => x.id === id);
      if (!c) return;
      editingLogCommentId = id;
      editingLogStamp = c.stamp || null;
      if (c.stamp && COOKER_STAMPS[c.stamp]) setLogCommentStampMode('cooker');
      else if (c.stamp && EATER_STAMPS[c.stamp]) setLogCommentStampMode('eater');
      const input = document.getElementById('logCommentInput');
      input.value = c.body || '';
      input.focus();
      document.getElementById('logCommentEditBar').style.display = 'flex';
    }

    function cancelLogCommentEdit() {
      editingLogCommentId = null;
      editingLogStamp = null;
      document.getElementById('logCommentInput').value = '';
      document.getElementById('logCommentEditBar').style.display = 'none';
    }

    async function deleteLogCommentItem(id) {
      if (!confirm('このコメントを削除しますか？')) return;
      const ok = await deleteMealComment(id);
      if (!ok) { showToast('削除に失敗しました', 'error'); return; }
      if (editingLogCommentId === id) cancelLogCommentEdit();
      await renderLogCommentList();
      await refreshCommentCount();
    }

    async function sendLogComment(stamp) {
      const dateStr = document.getElementById('dateInput').value;
      const input = document.getElementById('logCommentInput');
      const body = input.value.trim();

      if (editingLogCommentId) {
        const finalStamp = stamp || editingLogStamp;
        if (!finalStamp && !body) { showToast('内容を入力してください', 'error'); return; }
        const result = await updateMealComment(editingLogCommentId, { stamp: finalStamp, body: body || null });
        cancelLogCommentEdit();
        if (!result) { showToast('コメントの更新に失敗しました', 'error'); return; }
        await renderLogCommentList();
        return;
      }

      if (!stamp && !body) return;
      const result = await postMealComment(householdId, dateStr, selectedMeal, currentMemberId, { stamp, body: body || null });
      if (!result) { showToast('コメントの投稿に失敗しました', 'error'); return; }
      input.value = '';
      await renderLogCommentList();
      await refreshCommentCount();
    }

    init();
  </script>
</body>
</html>
