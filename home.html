<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ホーム - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-log.js"></script>
  <style>
    .date-strip {
      display: flex;
      gap: 6px;
      padding: 16px 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .date-strip::-webkit-scrollbar { display: none; }

    .date-chip {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--white);
      cursor: pointer;
      transition: all var(--transition);
      min-width: 44px;
    }
    .date-chip.active {
      background: var(--terra);
      border-color: var(--terra);
      color: var(--white);
    }
    .date-chip.has-log { border-color: var(--amber); }
    .date-chip .chip-day { font-size: 0.65rem; color: inherit; opacity: 0.7; }
    .date-chip .chip-date { font-size: 1rem; font-weight: 700; }
    .date-chip.active .chip-day { opacity: 0.8; }

    .today-section { padding: 16px 20px 0; }
    .today-date {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--brown);
      margin-bottom: 14px;
    }

    .liked-section { padding: 0 20px; }
    .liked-list { display: flex; flex-direction: column; gap: 8px; }
    .liked-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .liked-rank {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--amber);
      width: 24px;
      text-align: center;
    }
    .liked-name { font-size: 0.9rem; font-weight: 500; flex: 1; }


    /* =====================
       冷蔵庫セクション
    ===================== */
    .fridge-section { padding: 0 20px; }

    .fridge-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 32px;
    }

    .fridge-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 99px;
      background: #EEF3E2;
      border: 1.5px solid var(--olive);
      color: var(--olive);
      font-size: 0.8rem;
      font-weight: 500;
      transition: all var(--transition);
    }

    .fridge-chip.expiring-soon {
      background: #FEF3EC;
      border-color: var(--terra);
      color: var(--terra);
    }

    /* チップ内ボタン共通 */
    .fridge-chip button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      font-family: var(--font-body);
    }

    /* 📅 / ✏️ アフォーダンスボタン */
    .chip-date-btn {
      font-size: 0.72rem;
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    .chip-date-btn:hover { opacity: 1; }
    .chip-date-btn.has-date {
      opacity: 0.8;
      font-size: 0.7rem;
      font-weight: 600;
    }

    /* 削除ボタン */
    .chip-del {
      font-size: 0.72rem;
      opacity: 0.5;
      margin-left: 1px;
    }
    .chip-del:hover { opacity: 1; }

    /* ボトムシート */
    .bottom-sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      animation: fadeIn 0.2s ease;
    }
    .bottom-sheet-overlay.open { display: block; }
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 40px;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .bottom-sheet.open { transform: translateY(0); }
    .bs-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }
    .bs-title {
      font-size: 1rem; font-weight: 700;
      color: var(--brown); margin-bottom: 16px;
    }
    .bs-row {
      display: flex; align-items: center;
      gap: 10px; margin-bottom: 14px;
    }
    .bs-label {
      font-size: 0.82rem; color: var(--muted);
      white-space: nowrap; width: 60px;
    }
    .bs-date-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
      font-family: var(--font-body);
      color: var(--brown);
    }
    .bs-date-input:focus { border-color: var(--olive); }
    .bs-actions {
      display: flex; gap: 10px; margin-top: 18px;
    }
    .bs-btn-save {
      flex: 1; padding: 13px;
      background: var(--olive); color: white;
      border: none; border-radius: 99px;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: var(--font-body);
    }
    .bs-btn-clear {
      padding: 13px 18px;
      background: none; color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer; font-family: var(--font-body);
    }
    .bs-btn-delete {
      padding: 13px 18px;
      background: none; color: var(--terra);
      border: 1.5px solid var(--terra);
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer; font-family: var(--font-body);
    }

    .fridge-add-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .fridge-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 9px 16px;
      font-size: 0.88rem;
      outline: none;
      background: var(--white);
      font-family: var(--font-body);
      color: var(--brown);
      transition: border-color var(--transition);
    }
    .fridge-input:focus { border-color: var(--olive); }
    .fridge-input::placeholder { color: var(--border); }

    .fridge-guide {
      font-size: 0.75rem;
      color: var(--terra);
      margin-top: 6px;
      padding: 0 2px;
    }

    .fridge-scan-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.75rem; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--olive); background: var(--white);
      color: var(--olive); cursor: pointer; font-family: inherit;
    }
    .fridge-scan-result {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px 16px; margin-top: 10px;
    }
    .fridge-scan-result-title { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
    .fridge-scan-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .fridge-scan-chip {
      padding: 5px 10px; border-radius: 99px; font-size: 0.8rem;
      background: #EEF3E2; border: 1.5px solid var(--olive);
      color: var(--olive); cursor: pointer; font-family: inherit;
    }
    .fridge-scan-chip.deselected {
      background: var(--white); border-color: var(--border);
      color: var(--muted); text-decoration: line-through;
    }
    .fridge-scan-actions { display: flex; gap: 8px; }
    .fridge-scan-actions .btn { flex: 1; padding: 9px; font-size: 0.85rem; }
    .fridge-scanning { font-size: 0.82rem; color: var(--muted); padding: 8px 0; }
    .fridge-empty {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 4px 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <div class="header-right">
        <a href="kyushoku.html" class="kyushoku-btn">&#128203; 給食</a>
        <div id="userAvatar" style="cursor:pointer;display:flex;align-items:center;flex-shrink:0;" onclick="signOut()"></div>
      </div>
    </header>

    <div class="page">
      <!-- 日付スクロールバー -->
      <div class="date-strip" id="dateStrip"></div>

      <!-- 今日の献立 -->
      <div class="today-section">
        <div class="today-date" id="todayLabel">今日の献立</div>
        <div class="meal-grid" id="mealGrid">
          <div class="meal-cell">
            <div class="meal-type">朝</div>
            <div class="meal-empty">未登録</div>
          </div>
          <div class="meal-cell">
            <div class="meal-type">昼</div>
            <div class="meal-empty">未登録</div>
          </div>
          <div class="meal-cell">
            <div class="meal-type">夜</div>
            <div class="meal-empty">未登録</div>
          </div>
        </div>
      </div>

      <!-- 区切り -->
      <div class="divider" style="margin:20px 20px 0;"></div>

      <!-- 冷蔵庫食材メモ -->
      <div class="section-header">
        <span class="section-title">🧊 冷蔵庫の食材</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="fridge-scan-btn" onclick="triggerFridgeScan()">📷 写真で入力</button>
          <span style="font-size:0.75rem;color:var(--muted);">AI提案に自動反映</span>
        </div>
      </div>
      <input type="file" id="fridgeScanInput" accept="image/*"
             style="display:none" onchange="handleFridgeScan(event)">
      <div id="fridgeScanResult" class="fridge-scan-result hidden" style="margin:0 20px 12px;">
        <div class="fridge-scan-result-title">📷 認識した食材 — タップして除外</div>
        <div class="fridge-scan-chips" id="fridgeScanChips"></div>
        <div class="fridge-scan-actions">
          <button class="btn btn-secondary" onclick="cancelFridgeScan()">キャンセル</button>
          <button class="btn btn-primary" onclick="confirmFridgeScan()">追加する</button>
        </div>
      </div>
      <div class="fridge-section">
        <!-- 登録済み食材チップ -->
        <div class="fridge-chips" id="fridgeChips">
          <span class="fridge-empty">食材を登録するとAIが献立を提案しやすくなります</span>
        </div>
        <!-- 追加フォーム -->
        <div class="fridge-add-row">
          <input type="text" id="fridgeInput" class="fridge-input"
                 placeholder="早めに使いたい食材を登録（Enterで追加）"
                 maxlength="20"
                 onkeydown="if(event.key==='Enter')addFridgeItemUI()">
        </div>
        <div id="fridgeGuide" class="fridge-guide hidden"></div>
      </div>

    <!-- 食材編集ボトムシート -->
    <div class="bottom-sheet-overlay" id="bsOverlay" onclick="closeFridgeSheet()"></div>
    <div class="bottom-sheet" id="fridgeSheet">
      <div class="bs-handle"></div>
      <div class="bs-title" id="bsTitle">食材を編集</div>
      <div class="bs-row">
        <span class="bs-label">消費期限</span>
        <input type="date" class="bs-date-input" id="bsDateInput">
      </div>
      <div class="bs-actions">
        <button class="bs-btn-save" onclick="saveFridgeSheet()">保存</button>
        <button class="bs-btn-clear" onclick="clearFridgeSheetDate()">期限を削除</button>
        <button class="bs-btn-delete" onclick="deleteFridgeSheetItem()">食材を削除</button>
      </div>
    </div>

      <!-- 区切り -->
      <div class="divider" style="margin:20px 20px 0;"></div>

      <!-- また食べたいランキング -->
      <div class="section-header">
        <span class="section-title">⭐ また食べたいランキング</span>
      </div>
      <div class="liked-section">
        <div class="liked-list" id="likedList">
          <div class="empty-state" style="padding:24px 0;">
            <p class="text-sm text-muted">献立を記録すると<br>ランキングが表示されます</p>
          </div>
        </div>
      </div>
    </div>


    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        ログ
      </a>
      <a href="log.html" class="nav-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </a>
      <a href="suggest.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
    </nav>
  </div>

  <script>
    const DAY_LABELS = ['日','月','火','水','木','金','土'];
    let selectedDate = toDateStr();
    let householdId = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      renderUserInfo('userAvatar');
      householdId = await getOrCreateHousehold(user.id);
      currentHousehold = householdId;

      renderDateStrip();
      await renderMealGrid(selectedDate);
      await renderFridgeItems();
      await renderLikedList();
    }

    function renderDateStrip() {
      const strip = document.getElementById('dateStrip');
      strip.innerHTML = '';
      const today = new Date();

      for (let i = -3; i <= 3; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dateStr = toDateStr(d);

        const chip = document.createElement('div');
        chip.className = 'date-chip' + (dateStr === selectedDate ? ' active' : '');
        chip.innerHTML = `
          <span class="chip-day">${DAY_LABELS[d.getDay()]}</span>
          <span class="chip-date">${d.getDate()}</span>
        `;
        chip.addEventListener('click', () => selectDate(dateStr, chip));
        strip.appendChild(chip);
      }
    }

    async function selectDate(dateStr, chipEl) {
      selectedDate = dateStr;
      document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');

      const d = new Date(dateStr);
      const label = dateStr === toDateStr()
        ? '今日の献立'
        : `${d.getMonth()+1}月${d.getDate()}日（${DAY_LABELS[d.getDay()]}）の献立`;
      document.getElementById('todayLabel').textContent = label;

      await renderMealGrid(dateStr);
    }

    async function renderMealGrid(dateStr) {
      const grid = document.getElementById('mealGrid');
      if (!householdId) return;

      const logs = await getLogsByDate(householdId, dateStr);
      const logMap = {};
      logs.forEach(l => logMap[l.meal_type] = l);

      const meals = ['breakfast','lunch','dinner'];
      const labels = { breakfast:'朝', lunch:'昼', dinner:'夜' };

      grid.innerHTML = meals.map(type => {
        const log = logMap[type];
        return `
          <div class="meal-cell ${log ? 'has-entry' : ''}"
               onclick="location.href='log.html?date=${dateStr}&meal=${type}'">
            <div class="meal-type">${labels[type]}</div>
            ${log
              ? `<div class="meal-name">${log.dish_name}</div>`
              : `<div class="meal-empty">タップして登録</div>`
            }
          </div>
        `;
      }).join('');
    }

    // ---- 冷蔵庫食材 ----
    // ---- 冷蔵庫食材ボトムシート ----
    let sheetItemId = null;

    function buildExpiryText(item, today) {
      if (!item.expires_on) return null;
      const diffDays = Math.ceil((new Date(item.expires_on) - new Date(today)) / 86400000);
      if (diffDays <= 0) return { label: '期限切れ', soon: true };
      if (diffDays <= 3) return { label: 'あと' + diffDays + '日', soon: true };
      return { label: item.expires_on.slice(5).replace('-', '/'), soon: false };
    }

    function openFridgeSheet(itemId, itemName, expiresOn) {
      sheetItemId = itemId;
      document.getElementById('bsTitle').textContent = itemName;
      document.getElementById('bsDateInput').value = expiresOn || '';
      document.getElementById('bsOverlay').classList.add('open');
      document.getElementById('fridgeSheet').classList.add('open');
    }

    function closeFridgeSheet() {
      sheetItemId = null;
      document.getElementById('bsOverlay').classList.remove('open');
      document.getElementById('fridgeSheet').classList.remove('open');
    }

    async function saveFridgeSheet() {
      if (!sheetItemId) return;
      const val = document.getElementById('bsDateInput').value || null;
      const ok = await updateFridgeExpiry(sheetItemId, val);
      if (ok) {
        closeFridgeSheet();
        await renderFridgeItems();
        showToast(val ? '期限を設定しました' : '保存しました');
      } else {
        showToast('更新に失敗しました', 'error');
      }
    }

    async function clearFridgeSheetDate() {
      if (!sheetItemId) return;
      const ok = await updateFridgeExpiry(sheetItemId, null);
      if (ok) {
        closeFridgeSheet();
        await renderFridgeItems();
        showToast('期限を削除しました');
      } else {
        showToast('更新に失敗しました', 'error');
      }
    }

    async function deleteFridgeSheetItem() {
      if (!sheetItemId) return;
      const ok = await deleteFridgeItem(sheetItemId);
      if (ok) {
        closeFridgeSheet();
        await renderFridgeItems();
      } else {
        showToast('削除に失敗しました', 'error');
      }
    }

    async function renderFridgeItems() {
      const container = document.getElementById('fridgeChips');
      if (!householdId) return;

      const items = await getFridgeItems(householdId);
      if (items.length === 0) {
        container.innerHTML = '<span class="fridge-empty">食材を登録するとAIが献立を提案しやすくなります</span>';
        return;
      }

      const today = toDateStr();
      container.innerHTML = items.map(item => {
        const expiry = buildExpiryText(item, today);
        const soon = expiry && expiry.soon;
        const chipClass = 'fridge-chip' + (soon ? ' expiring-soon' : '');
        const dateBtn = expiry
          ? `<button class="chip-date-btn has-date" title="期限を変更">${expiry.label} ✏️</button>`
          : `<button class="chip-date-btn" title="消費期限を設定">📅</button>`;
        return `<span class="${chipClass}" data-id="${item.id}" data-name="${item.name.replace(/"/g,'&quot;')}" data-expires="${item.expires_on || ''}">${item.name}${dateBtn}</span>`;
      }).join('');

      // チップタップ → ボトムシート（1つのイベントデリゲートで管理）
      container.onclick = e => {
        const chip = e.target.closest('[data-id]');
        if (!chip) return;
        openFridgeSheet(chip.dataset.id, chip.dataset.name, chip.dataset.expires);
      };
    }

    const FRIDGE_MAX = 30;

    async function addFridgeItemUI() {
      const input = document.getElementById('fridgeInput');
      const name = input.value.trim();
      if (!name) return;

      const current = document.querySelectorAll('.fridge-chip').length;
      if (current >= FRIDGE_MAX) {
        const guide = document.getElementById('fridgeGuide');
        guide.textContent = '上限（' + FRIDGE_MAX + '個）に達しました。使い切った食材を削除してください。';
        guide.classList.remove('hidden');
        return;
      }

      input.value = '';
      const guide = document.getElementById('fridgeGuide');
      guide.classList.add('hidden');

      const result = await addFridgeItem(householdId, name, null);
      if (result) {
        await renderFridgeItems();
        const after = document.querySelectorAll('.fridge-chip').length;
        if (after >= FRIDGE_MAX - 5) {
          guide.textContent = '残り' + (FRIDGE_MAX - after) + '個登録できます。調味料など常備品は登録不要です。';
          guide.classList.remove('hidden');
        }
      } else {
        showToast('追加に失敗しました', 'error');
      }
    }

    async function removeFridgeItemUI(itemId) {
      const ok = await deleteFridgeItem(itemId);
      if (ok) {
        await renderFridgeItems();
      } else {
        showToast('削除に失敗しました', 'error');
      }
    }

    // ---- また食べたいランキング ----
    async function renderLikedList() {
      const list = document.getElementById('likedList');
      if (!householdId) return;

      const dishes = await getLikedDishes(householdId, 5);
      if (!dishes.length) return;

      const medals = ['🥇','🥈','🥉','4','5'];
      list.innerHTML = dishes.map((d, i) => `
        <div class="liked-item fade-in" style="animation-delay:${i*0.08}s">
          <div class="liked-rank">${medals[i]}</div>
          <div class="liked-name">${d.dish_name}</div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
            <span style="font-size:0.75rem;color:var(--muted)">${d.rating >= 5 ? '❤️ また食べたい' : '★'.repeat(d.rating)}</span>
          </div>
        </div>
      `).join('');
    }

    // 冷蔵庫スキャン
    function triggerFridgeScan() {
      document.getElementById("fridgeScanInput").click();
    }
    async function handleFridgeScan(e) {
      const file = e.target.files[0];
      if (!file) return;
      const resultEl = document.getElementById("fridgeScanResult");
      const chipsEl = document.getElementById("fridgeScanChips");
      const actionsEl = resultEl.querySelector(".fridge-scan-actions");
      resultEl.classList.remove("hidden");
      chipsEl.innerHTML = "<div class=\"fridge-scanning\">🔍 認識中...</div>";
      actionsEl.style.display = "none";
      try {
        const b64 = await new Promise(function(res, rej) {
          const r = new FileReader();
          r.onload = function() { res(r.result.split(",")[1]); };
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        const resp = await fetch("https://sfhtvtcmgueystyuhzvd.supabase.co/functions/v1/tavera-fridge-scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: b64, mediaType: file.type })
        });
        const d = await resp.json();
        const items = d.items || [];
        if (!items.length) {
          chipsEl.innerHTML = "<span style=\"font-size:0.82rem;color:var(--muted)\">食材を認識できませんでした。別の写真を試してください。</span>";
          actionsEl.style.display = "flex";
          e.target.value = "";
          return;
        }
        chipsEl.innerHTML = items.map(function(item) {
          return "<button class=\"fridge-scan-chip\" onclick=\"this.classList.toggle('deselected')\">" + item + "</button>";
        }).join("");
        actionsEl.style.display = "flex";
      } catch(err) {
        chipsEl.innerHTML = "<span style=\"font-size:0.82rem;color:var(--terra)\">エラーが発生しました。</span>";
        actionsEl.style.display = "flex";
      }
      e.target.value = "";
    }
    function cancelFridgeScan() {
      document.getElementById("fridgeScanResult").classList.add("hidden");
    }
    async function confirmFridgeScan() {
      const chips = document.querySelectorAll("#fridgeScanChips .fridge-scan-chip:not(.deselected)");
      const items = Array.from(chips).map(function(c) { return c.textContent.trim(); });
      if (!items.length) { cancelFridgeScan(); return; }
      const existing = (await getFridgeItems(householdId)).map(function(i) { return i.name; });
      const newItems = items.filter(function(i) { return !existing.includes(i); });
      for (var n = 0; n < newItems.length; n++) {
        await addFridgeItem(householdId, newItems[n], null);
      }
      cancelFridgeScan();
      await renderFridgeItems();
      showToast(newItems.length + "件の食材を追加しました 🧊");
    }

    init();
  </script>
</body>
</html>
