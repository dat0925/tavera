  <meta charset="UTF-8">

  <title>ホーム - Tavera</title>
  <link rel="icon" href="assets/logo.png">

  <link rel="manifest" href="manifest.json">

  <style>
    .date-strip {
      display: flex;
      gap: 6px;
      padding: 16px 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .date-strip::-webkit-scrollbar { display: none; }

    .date-chip {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--white);
      cursor: pointer;
      transition: all var(--transition);
      min-width: 44px;
    }
    .date-chip.active {
      background: var(--terra);
      border-color: var(--terra);
      color: var(--white);
    }
    .date-chip.has-log { border-color: var(--amber); }
    .date-chip .chip-day { font-size: 0.65rem; color: inherit; opacity: 0.7; }
    .date-chip .chip-date { font-size: 1rem; font-weight: 700; }
    .date-chip.active .chip-day { opacity: 0.8; }

    .today-section { padding: 16px 20px 0; }
    .today-date {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--brown);
      margin-bottom: 14px;
    }

    .liked-section { padding: 0 20px; }
    .liked-list { display: flex; flex-direction: column; gap: 8px; }
    .liked-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .liked-rank {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--amber);
      width: 24px;
      text-align: center;
    }
    .liked-name { font-size: 0.9rem; font-weight: 500; flex: 1; }


    /* =====================
       冷蔵庫セクション
    ===================== */
    .fridge-section { padding: 0 20px; }

    .fridge-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 32px;
    }

    .fridge-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      border-radius: 99px;
      background: #EEF3E2;
      border: 1.5px solid var(--olive);
      color: var(--olive);
      font-size: 0.8rem;
      font-weight: 500;
      transition: all var(--transition);
    }

    .fridge-chip.expiring-soon {
      background: #FEF3EC;
      border-color: var(--terra);
      color: var(--terra);
    }

    /* チップ内ボタン共通 */
    .fridge-chip button {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      padding: 0 2px;
      line-height: 1;
      font-family: var(--font-body);
    }

    /* 📅 / ✏️ アフォーダンスボタン */
    .chip-date-btn {
      font-size: 0.72rem;
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    .chip-date-btn:hover { opacity: 1; }
    .chip-date-btn.has-date {
      opacity: 0.8;
      font-size: 0.7rem;
      font-weight: 600;
    }

    /* 削除ボタン */
    .chip-del {
      font-size: 0.72rem;
      opacity: 0.5;
      margin-left: 1px;
    }
    .chip-del:hover { opacity: 1; }

    /* ボトムシート */
    .bottom-sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      animation: fadeIn 0.2s ease;
    }
    .bottom-sheet-overlay.open { display: block; }
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 40px;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .bottom-sheet.open { transform: translateY(0); }
    .bs-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }
    .bs-title {
      font-size: 1rem; font-weight: 700;
      color: var(--brown); margin-bottom: 16px;
    }
    .bs-row {
      display: flex; align-items: center;
      gap: 10px; margin-bottom: 14px;
    }
    .bs-label {
      font-size: 0.82rem; color: var(--muted);
      white-space: nowrap; width: 60px;
    }
    .bs-date-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
      font-family: var(--font-body);
      color: var(--brown);
    }
    .bs-date-input:focus { border-color: var(--olive); }
    .bs-actions {
      display: flex; gap: 10px; margin-top: 18px;
    }
    .bs-btn-save {
      flex: 1; padding: 13px;
      background: var(--olive); color: white;
      border: none; border-radius: 99px;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: var(--font-body);
    }
    .bs-btn-clear {
      padding: 13px 18px;
      background: none; color: var(--muted);
      border: 1.5px solid var(--border);
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer; font-family: var(--font-body);
    }
    .bs-btn-delete {
      padding: 13px 18px;
      background: none; color: var(--terra);
      border: 1.5px solid var(--terra);
      border-radius: 99px;
      font-size: 0.82rem;
      cursor: pointer; font-family: var(--font-body);
    }
    .bs-btn-to-shopping {
      width: 100%; margin-top: 10px; padding: 12px;
      background: none; color: var(--olive);
      border: 1.5px solid var(--olive);
      border-radius: 99px;
      font-size: 0.82rem; font-weight: 600;
      cursor: pointer; font-family: var(--font-body);
    }
    .bs-btn-to-shopping:active { background: #F1F4E8; }

    .fridge-add-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .fridge-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 9px 16px;
      font-size: 0.88rem;
      outline: none;
      background: var(--white);
      font-family: var(--font-body);
      color: var(--brown);
      transition: border-color var(--transition);
    }
    .fridge-input:focus { border-color: var(--olive); }
    .fridge-input::placeholder { color: var(--border); }

    .fridge-guide {
      font-size: 0.75rem;
      color: var(--terra);
      margin-top: 6px;
      padding: 0 2px;
    }

    .fridge-scan-btn {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 0.75rem; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--olive); background: var(--white);
      color: var(--olive); cursor: pointer; font-family: inherit;
    }
    .fridge-scan-result {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 14px 16px; margin-top: 10px;
    }
    .fridge-scan-result-title { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
    .fridge-scan-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .fridge-scan-chip {
      padding: 5px 10px; border-radius: 99px; font-size: 0.8rem;
      background: #EEF3E2; border: 1.5px solid var(--olive);
      color: var(--olive); cursor: pointer; font-family: inherit;
    }
    .fridge-scan-chip.deselected {
      background: var(--white); border-color: var(--border);
      color: var(--muted); text-decoration: line-through;
    }
    .fridge-scan-actions { display: flex; gap: 8px; }
    .fridge-scan-actions .btn { flex: 1; padding: 9px; font-size: 0.85rem; }
    .fridge-scanning { font-size: 0.82rem; color: var(--muted); padding: 8px 0; }
    .fridge-empty {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 4px 2px;
    }

    /* ===== 買い物リスト ===== */
    .shopping-section { padding: 0 20px; }

    .shopping-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .shopping-meta {
      font-size: 0.72rem; color: var(--muted);
    }
    .shopping-refresh-btn {
      font-size: 0.72rem; padding: 4px 10px; border-radius: 99px;
      border: 1px solid var(--border); background: var(--white);
      color: var(--muted); cursor: pointer; font-family: inherit;
    }
    .shopping-refresh-btn:active { background: var(--surface); }

    .shopping-list {
      display: flex; flex-direction: column; gap: 4px;
      margin-bottom: 12px;
    }
    .shopping-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .shopping-item.checked {
      opacity: 0.45;
    }
    .shopping-item.checked .shopping-item-name {
      text-decoration: line-through; color: var(--muted);
    }
    .shopping-checkbox {
      width: 20px; height: 20px; border-radius: 50%;
      border: 2px solid var(--border); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.15s;
    }
    .shopping-item.checked .shopping-checkbox {
      background: var(--olive); border-color: var(--olive);
    }
    .shopping-item.checked .shopping-checkbox::after {
      content: '✓'; color: #fff; font-size: 0.7rem; font-weight: 700;
    }
    .shopping-item-name { font-size: 0.88rem; flex: 1; }
    .shopping-item-del {
      flex-shrink: 0; width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      border: none; background: none; color: var(--muted);
      font-size: 0.9rem; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .shopping-item-del:active { color: var(--terra); }
    .shopping-item-manual-tag {
      font-size: 0.65rem; color: var(--olive); border: 1px solid var(--olive);
      border-radius: 99px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
    }
    .shopping-add-row {
      display: flex; gap: 8px; margin-bottom: 4px;
    }
    .shopping-add-input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 9px 12px; font-size: 0.85rem; outline: none;
      font-family: var(--font-body); color: var(--brown);
    }
    .shopping-add-input:focus { border-color: var(--olive); }
    .shopping-add-btn {
      padding: 0 16px; border-radius: 10px; border: none;
      background: var(--surface); border: 1.5px solid var(--border);
      color: var(--brown); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .shopping-add-btn:active { border-color: var(--terra); color: var(--terra); }

    .shopping-actions {
      display: flex; gap: 8px; margin-top: 4px;
    }
    .shopping-copy-btn {
      flex: 1; padding: 10px;
      background: var(--terra); color: #fff;
      border: none; border-radius: 99px;
      font-size: 0.88rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .shopping-copy-btn:active { background: #b8451f; }
    .shopping-empty {
      font-size: 0.82rem; color: var(--muted); padding: 16px 0; text-align: center;
    }

    /* 献立コメント */
    .meal-cell { position: relative; }
    .meal-comment-btn {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--muted);
      z-index: 1;
    }
    .meal-comment-btn.has-comments {
      border-color: var(--terra); color: var(--terra); background: #FEF3EC;
    }
    .meal-comment-btn .count {
      position: absolute; top: -5px; right: -5px;
      background: var(--terra); color: #fff;
      font-size: 0.6rem; font-weight: 700;
      min-width: 14px; height: 14px; padding: 0 2px;
      border-radius: 99px;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .comment-sheet-label {
      font-size: 0.82rem; color: var(--muted); margin-bottom: 12px;
    }
    .comment-list {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 30vh; overflow-y: auto;
      margin-bottom: 14px;
    }
    .comment-item {
      background: var(--surface); border-radius: 12px;
      padding: 8px 12px; font-size: 0.85rem; color: var(--brown);
    }
    .comment-item .meta {
      font-size: 0.68rem; color: var(--muted); margin-top: 3px;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .comment-action-btn {
      background: none; border: none; padding: 0; margin-left: 6px;
      font-size: 0.68rem; color: var(--olive); font-family: inherit; cursor: pointer;
      text-decoration: underline; -webkit-tap-highlight-color: transparent;
    }
    .comment-edited-tag { color: var(--muted); }
    .comment-edit-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #FEF3EC; border: 1px solid var(--terra);
      border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
      font-size: 0.8rem; color: var(--terra);
    }
    .comment-edit-bar button {
      background: none; border: none; color: var(--terra);
      font-size: 0.75rem; text-decoration: underline; cursor: pointer; font-family: inherit;
    }
    .comment-empty {
      font-size: 0.82rem; color: var(--muted); text-align: center; padding: 12px 0;
    }
    .comment-role-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .comment-role-toggle button {
      flex: 1; padding: 8px 6px;
      font-size: 0.72rem; font-weight: 600;
      border: none; background: none; color: var(--muted);
      cursor: pointer; transition: all 0.15s; font-family: inherit;
      white-space: nowrap;
    }
    .comment-role-toggle button.active {
      background: var(--terra); color: #fff;
    }
    .comment-stamps {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
    }
    .comment-stamp-btn {
      padding: 7px 12px; border-radius: 99px;
      border: 1.5px solid var(--border); background: var(--white);
      font-size: 0.8rem; color: var(--brown); cursor: pointer;
      font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .comment-stamp-btn:active { border-color: var(--terra); color: var(--terra); background: #FEF3EC; }
    .comment-input-row {
      display: flex; gap: 8px;
    }
    .comment-input-row input {
      flex: 1;
      border: 1.5px solid var(--border); border-radius: 99px;
      padding: 10px 14px; font-size: 0.85rem;
      outline: none; font-family: var(--font-body); color: var(--brown);
    }
    .comment-input-row input:focus { border-color: var(--olive); }
    .comment-send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--terra); color: #fff; border: none;
      font-size: 1rem; flex-shrink: 0; cursor: pointer;
    }
    .comment-send-btn:disabled, .comment-stamp-btn:disabled {
      opacity: .4; cursor: default;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-ML7NKTDR"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <span class="header-title">ホーム</span>
      <div class="header-right">
        <a href="kyushoku.html" class="kyushoku-btn">&#128203; 給食</a>
        <div id="userAvatar" style="cursor:pointer;display:flex;align-items:center;flex-shrink:0;" onclick="showAccountMenu()"></div>

      <!-- アカウントメニュー -->
      <div id="accountMenu" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;" onclick="hideAccountMenu()">
        <div style="position:absolute;top:60px;right:16px;background:#fff;border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.15);overflow:hidden;min-width:180px;" onclick="event.stopPropagation()">
          <div id="accountMenuEmail" style="padding:14px 16px 10px;font-size:0.78rem;color:var(--muted);border-bottom:1px solid var(--border);"></div>
          <button onclick="switchAccount()" style="display:block;width:100%;padding:13px 16px;text-align:left;font-size:0.875rem;background:none;border:none;cursor:pointer;color:var(--brown);font-family:inherit;">🔄 アカウント切り替え</button>
          <button onclick="confirmSignOut()" style="display:block;width:100%;padding:13px 16px;text-align:left;font-size:0.875rem;background:none;border:none;cursor:pointer;color:var(--terra);font-family:inherit;border-top:1px solid var(--border);">🚪 ログアウト</button>
        </div>
      </div>
      </div>
    </header>

    <div class="page">
      <!-- 日付スクロールバー -->
      <div class="date-strip" id="dateStrip"></div>

      <!-- 今日の献立 -->
      <div class="today-section">
        <div class="today-date" id="todayLabel">今日の献立</div>
        <div class="meal-grid" id="mealGrid">
          <div class="meal-cell">
            <div class="meal-type">朝</div>
            <div class="meal-empty">未登録</div>
          </div>
          <div class="meal-cell">
            <div class="meal-type">昼</div>
            <div class="meal-empty">未登録</div>
          </div>
          <div class="meal-cell">
            <div class="meal-type">夜</div>
            <div class="meal-empty">未登録</div>
          </div>
        </div>
      </div>

      <!-- 区切り -->
      <div class="divider" style="margin:20px 20px 0;"></div>

      <!-- 冷蔵庫食材メモ -->
      <div class="section-header">
        <span class="section-title">🧊 冷蔵庫の食材</span>
        <div style="display:flex;align-items:center;gap:8px;">
          <button class="fridge-scan-btn" onclick="triggerFridgeScan()">📷 写真で入力</button>
          <span style="font-size:0.75rem;color:var(--muted);">AI提案に自動反映</span>
        </div>
      </div>
      <input type="file" id="fridgeScanInput" accept="image/*"
             style="display:none" onchange="handleFridgeScan(event)">
      <div id="fridgeScanResult" class="fridge-scan-result hidden" style="margin:0 20px 12px;">
        <div class="fridge-scan-result-title">📷 認識した食材 — タップして除外</div>
        <div class="fridge-scan-chips" id="fridgeScanChips"></div>
        <div class="fridge-scan-actions">
          <button class="btn btn-secondary" onclick="cancelFridgeScan()">キャンセル</button>
          <button class="btn btn-primary" onclick="confirmFridgeScan()">追加する</button>
        </div>
      </div>
      <div class="fridge-section">
        <!-- 登録済み食材チップ -->
        <div class="fridge-chips" id="fridgeChips">
          <span class="fridge-empty">食材を登録するとAIが献立を提案しやすくなります</span>
        </div>
        <!-- 追加フォーム -->
        <div class="fridge-add-row">
          <input type="text" id="fridgeInput" class="fridge-input"
                 placeholder="早めに使いたい食材を登録（Enterで追加）"
                 maxlength="20"
                 onkeydown="if(event.key==='Enter')addFridgeItemUI()">
        </div>
        <div id="fridgeGuide" class="fridge-guide hidden"></div>
      </div>

    <!-- 食材編集ボトムシート -->
    <div class="bottom-sheet-overlay" id="bsOverlay" onclick="closeFridgeSheet()"></div>
    <div class="bottom-sheet" id="fridgeSheet">
      <div class="bs-handle"></div>
      <div class="bs-title" id="bsTitle">食材を編集</div>
      <div class="bs-row">
        <span class="bs-label">消費期限</span>
        <input type="date" class="bs-date-input" id="bsDateInput">
      </div>
      <div class="bs-actions">
        <button class="bs-btn-save" onclick="saveFridgeSheet()">保存</button>
        <button class="bs-btn-clear" onclick="clearFridgeSheetDate()">期限を削除</button>
        <button class="bs-btn-delete" onclick="deleteFridgeSheetItem()">食材を削除</button>
      </div>
      <button class="bs-btn-to-shopping" onclick="deleteFridgeSheetItemToShoppingList()">🛒 削除して買い物リストへ</button>
    </div>

    <!-- 献立コメントボトムシート -->
    <div class="bottom-sheet-overlay" id="csOverlay" onclick="closeCommentSheet()"></div>
    <div class="bottom-sheet" id="commentSheet">
      <div class="bs-handle"></div>
      <div class="bs-title" id="csTitle">コメント</div>
      <div class="comment-sheet-label" id="csLabel"></div>
      <div class="comment-list" id="csList"></div>
      <div class="comment-edit-bar" id="csEditBar" style="display:none;">
        <span>✏️ コメントを編集中</span>
        <button type="button" onclick="cancelCommentEdit()">キャンセル</button>
      </div>
      <div class="comment-role-toggle" id="csRoleToggle">
        <button id="csRoleEater" onclick="setCommentStampMode('eater')">🙏 いただく側</button>
        <button id="csRoleCooker" onclick="setCommentStampMode('cooker')">👩‍🍳 つくってくれる側</button>
      </div>
      <div class="comment-stamps" id="csStamps"></div>
      <div class="comment-input-row">
        <input type="text" id="csInput" placeholder="一言メモ（任意）" maxlength="100"
               onkeydown="if(event.key==='Enter')sendComment(null)">
        <button class="comment-send-btn" onclick="sendComment(null)">➤</button>
      </div>
    </div>

      <!-- 区切り -->
      <div class="divider" style="margin:20px 20px 0;"></div>

      <!-- また食べたいランキング -->
      <div class="section-header">
        <span class="section-title">⭐ また食べたいランキング</span>
      </div>
      <div class="liked-section">
        <div class="liked-list" id="likedList">
          <div class="empty-state" style="padding:24px 0;">
            <p class="text-sm text-muted">献立を記録すると<br>ランキングが表示されます</p>
          </div>
        </div>
      </div>

      <!-- 区切り -->
      <div class="divider" style="margin:20px 20px 0;"></div>

      <!-- 買い物リスト -->
      <div class="section-header">
        <span class="section-title">🛒 今週の買い物リスト</span>
        <button class="shopping-refresh-btn" onclick="renderShoppingList()">↺ 更新</button>
      </div>
      <div class="shopping-section">
        <div class="shopping-meta" id="shoppingMeta"></div>
        <div class="shopping-list" id="shoppingList">
          <div class="shopping-empty">献立を記録すると食材リストが自動生成されます</div>
        </div>
        <div class="shopping-add-row">
          <input type="text" id="shoppingManualInput" class="shopping-add-input"
                 placeholder="食材以外も追加できます（例：ラップ）" maxlength="30"
                 onkeydown="if(event.key==='Enter')addShoppingManualItemUI()">
          <button class="shopping-add-btn" onclick="addShoppingManualItemUI()">追加</button>
        </div>
        <div class="shopping-actions" id="shoppingActions" style="display:none;">
          <button class="shopping-copy-btn" onclick="copyShoppingList()">📋 リストをコピー</button>
        </div>
      </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="log.html" class="nav-add">
        <div class="nav-add-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </a>
      <a href="suggest.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
      <a href="kyushoku.html" class="nav-sidebar-only">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        給食
      </a>
    </nav>
  </div>

  <script>
    const DAY_LABELS = ['日','月','火','水','木','金','土'];
    let selectedDate = toDateStr();
    let householdId = null;
    let currentMemberId = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      currentMemberId = user.id;

      renderUserInfo('userAvatar');
      householdId = await getOrCreateHousehold(user.id);
      currentHousehold = householdId;

      // URLパラメータで日付・食事区分が指定されている場合（LINE通知のリンクなど）は、
      // その献立を選択した状態で開き、コメントシートも自動的に表示する
      const deepLinkParams = new URLSearchParams(location.search);
      const deepLinkDate = deepLinkParams.get('date');
      const deepLinkMeal = deepLinkParams.get('meal');
      if (deepLinkDate) selectedDate = deepLinkDate;

      renderDateStrip();
      await renderMealGrid(selectedDate);
      await renderFridgeItems();
      await renderLikedList();
      await renderShoppingList();

      if (deepLinkDate) {
        const d = new Date(deepLinkDate + 'T00:00:00');
        document.getElementById('todayLabel').textContent = deepLinkDate === toDateStr()
          ? '今日の献立'
          : `${d.getMonth()+1}月${d.getDate()}日（${DAY_LABELS[d.getDay()]}）の献立`;
      }
      if (deepLinkDate && deepLinkMeal) {
        const mealLabels = { breakfast:'朝', lunch:'昼', dinner:'夜' };
        openCommentSheet(deepLinkDate, deepLinkMeal, mealLabels[deepLinkMeal] || deepLinkMeal);
      }
    }

    function renderDateStrip() {
      const strip = document.getElementById('dateStrip');
      strip.innerHTML = '';
      const today = new Date();

      for (let i = -3; i <= 3; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dateStr = toDateStr(d);

        const chip = document.createElement('div');
        chip.className = 'date-chip' + (dateStr === selectedDate ? ' active' : '');
        chip.innerHTML = `
          <span class="chip-day">${DAY_LABELS[d.getDay()]}</span>
          <span class="chip-date">${d.getDate()}</span>
        `;
        chip.addEventListener('click', () => selectDate(dateStr, chip));
        strip.appendChild(chip);
      }
    }

    async function selectDate(dateStr, chipEl) {
      selectedDate = dateStr;
      document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');

      const d = new Date(dateStr);
      const label = dateStr === toDateStr()
        ? '今日の献立'
        : `${d.getMonth()+1}月${d.getDate()}日（${DAY_LABELS[d.getDay()]}）の献立`;
      document.getElementById('todayLabel').textContent = label;

      await renderMealGrid(dateStr);
    }

    async function renderMealGrid(dateStr) {
      const grid = document.getElementById('mealGrid');
      if (!householdId) return;

      currentGridDate = dateStr;
      const [logs, commentCounts] = await Promise.all([
        getLogsByDate(householdId, dateStr),
        getMealCommentCounts(householdId, dateStr),
      ]);
      const logMap = {};
      logs.forEach(l => logMap[l.meal_type] = l);

      const meals = ['breakfast','lunch','dinner'];
      const labels = { breakfast:'朝', lunch:'昼', dinner:'夜' };

      grid.innerHTML = meals.map(type => {
        const log = logMap[type];
        const count = commentCounts[type] || 0;
        return `
          <div class="meal-cell ${log ? 'has-entry' : ''}"
               onclick="location.href='log.html?date=${dateStr}&meal=${type}'">
            <button class="meal-comment-btn ${count ? 'has-comments' : ''}"
              onclick="event.stopPropagation(); openCommentSheet('${dateStr}', '${type}', '${labels[type]}')">
              💬${count ? `<span class="count">${count > 9 ? '9+' : count}</span>` : ''}
            </button>
            <div class="meal-type">${labels[type]}</div>
            ${log
              ? `<div class="meal-name">${log.dish_name}${srcBadge(log)}</div>`
              : `<div class="meal-empty">タップして登録</div>`
            }
          </div>
        `;
      }).join('');
    }

    // ---- 献立コメント ----
    let currentGridDate = null;
    let commentSheetDate = null;
    let commentSheetMeal = null;
    let lastComments = [];
    let editingCommentId = null;
    let editingStamp = null;
    let currentMemberRole = null;   // 'owner' | 'member'
    let commentStampMode = 'eater'; // 'eater' | 'cooker'（コメントシートを開くたびroleから初期化）

    async function openCommentSheet(dateStr, mealType, label) {
      commentSheetDate = dateStr;
      commentSheetMeal = mealType;
      document.getElementById('csTitle').textContent = `${label}のコメント`;
      const d = new Date(dateStr + 'T00:00:00');
      document.getElementById('csLabel').textContent = `${d.getMonth()+1}月${d.getDate()}日`;
      cancelCommentEdit();
      if (currentMemberRole === null) currentMemberRole = await getMemberRole(currentMemberId);
      setCommentStampMode(currentMemberRole === 'owner' ? 'cooker' : 'eater');
      document.getElementById('csOverlay').classList.add('open');
      document.getElementById('commentSheet').classList.add('open');
      await renderCommentList();
    }

    function setCommentStampMode(mode) {
      commentStampMode = mode;
      document.getElementById('csRoleEater').classList.toggle('active', mode === 'eater');
      document.getElementById('csRoleCooker').classList.toggle('active', mode === 'cooker');
      const stamps = mode === 'eater' ? EATER_STAMPS : COOKER_STAMPS;
      document.getElementById('csStamps').innerHTML = Object.entries(stamps).map(([key, label]) =>
        `<button class="comment-stamp-btn" onclick="sendComment('${key}')">${label}</button>`
      ).join('');
    }

    function closeCommentSheet() {
      document.getElementById('csOverlay').classList.remove('open');
      document.getElementById('commentSheet').classList.remove('open');
    }

    async function renderCommentList() {
      const list = document.getElementById('csList');
      list.innerHTML = '<div class="loading-dots" style="justify-content:center;padding:8px 0"><span></span><span></span><span></span></div>';
      const comments = await getMealComments(householdId, commentSheetDate, commentSheetMeal);
      lastComments = comments;
      if (!comments.length) {
        list.innerHTML = '<div class="comment-empty">まだコメントはありません</div>';
        return;
      }
      list.innerHTML = comments.map(c => {
        const name = c.menu_members?.name || (c.source === 'line' ? 'LINEから' : '家族');
        const text = [c.stamp ? MEAL_COMMENT_STAMPS[c.stamp] || c.stamp : null, c.body].filter(Boolean).join('　');
        const time = new Date(c.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const editedTag = c.edited_at
          ? `<span class="comment-edited-tag">（編集済み ${new Date(c.edited_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}）</span>`
          : '';
        const actions = c.author_id === currentMemberId
          ? `<button class="comment-action-btn" onclick="startEditComment('${c.id}')">編集</button><button class="comment-action-btn" onclick="deleteCommentItem('${c.id}')">削除</button>`
          : '';
        return `
          <div class="comment-item">
            <div>${text}</div>
            <div class="meta">${name}・${time}${c.source === 'line' ? '・LINE' : ''}${editedTag}${actions}</div>
          </div>`;
      }).join('');
      list.scrollTop = list.scrollHeight;
    }

    function startEditComment(id) {
      const c = lastComments.find(x => x.id === id);
      if (!c) return;
      editingCommentId = id;
      editingStamp = c.stamp || null;
      if (c.stamp && COOKER_STAMPS[c.stamp]) setCommentStampMode('cooker');
      else if (c.stamp && EATER_STAMPS[c.stamp]) setCommentStampMode('eater');
      const input = document.getElementById('csInput');
      input.value = c.body || '';
      input.focus();
      document.getElementById('csEditBar').style.display = 'flex';
    }

    function cancelCommentEdit() {
      editingCommentId = null;
      editingStamp = null;
      document.getElementById('csInput').value = '';
      document.getElementById('csEditBar').style.display = 'none';
    }

    async function deleteCommentItem(id) {
      if (!confirm('このコメントを削除しますか？')) return;
      const ok = await deleteMealComment(id);
      if (!ok) { showToast('削除に失敗しました', 'error'); return; }
      if (editingCommentId === id) cancelCommentEdit();
      await renderCommentList();
      if (commentSheetDate === currentGridDate) await renderMealGrid(currentGridDate);
    }

    let commentSending = false;

    function setCommentSendingUI(busy) {
      const btn = document.querySelector('#commentSheet .comment-send-btn');
      if (btn) { btn.disabled = busy; btn.textContent = busy ? '…' : '➤'; }
      document.querySelectorAll('#csStamps button').forEach(b => b.disabled = busy);
    }

    async function sendComment(stamp) {
      if (commentSending) return;
      const input = document.getElementById('csInput');
      const body = input.value.trim();

      if (editingCommentId) {
        const finalStamp = stamp || editingStamp;
        if (!finalStamp && !body) { showToast('内容を入力してください', 'error'); return; }
        commentSending = true;
        setCommentSendingUI(true);
        try {
          const result = await updateMealComment(editingCommentId, { stamp: finalStamp, body: body || null });
          cancelCommentEdit();
          if (!result) { showToast('コメントの更新に失敗しました', 'error'); return; }
          await renderCommentList();
          return;
        } finally {
          commentSending = false;
          setCommentSendingUI(false);
        }
      }

      if (!stamp && !body) return;
      commentSending = true;
      setCommentSendingUI(true);
      try {
        const result = await postMealComment(householdId, commentSheetDate, commentSheetMeal, currentMemberId, { stamp, body: body || null });
        if (!result) { showToast('コメントの投稿に失敗しました', 'error'); return; }
        input.value = '';
        await renderCommentList();
        if (commentSheetDate === currentGridDate) await renderMealGrid(currentGridDate);
      } finally {
        commentSending = false;
        setCommentSendingUI(false);
      }
    }

    // ---- 冷蔵庫食材 ----
    // ---- 冷蔵庫食材ボトムシート ----
    let sheetItemId = null;

    function buildExpiryText(item, today) {
      if (!item.expires_on) return null;
      const diffDays = Math.ceil((new Date(item.expires_on) - new Date(today)) / 86400000);
      if (diffDays <= 0) return { label: '期限切れ', soon: true };
      if (diffDays <= 3) return { label: 'あと' + diffDays + '日', soon: true };
      return { label: item.expires_on.slice(5).replace('-', '/'), soon: false };
    }

    function openFridgeSheet(itemId, itemName, expiresOn) {
      sheetItemId = itemId;
      document.getElementById('bsTitle').textContent = itemName;
      document.getElementById('bsDateInput').value = expiresOn || '';
      document.getElementById('bsOverlay').classList.add('open');
      document.getElementById('fridgeSheet').classList.add('open');
    }

    function closeFridgeSheet() {
      sheetItemId = null;
      document.getElementById('bsOverlay').classList.remove('open');
      document.getElementById('fridgeSheet').classList.remove('open');
    }

    async function saveFridgeSheet() {
      if (!sheetItemId) return;
      const val = document.getElementById('bsDateInput').value || null;
      const ok = await updateFridgeExpiry(sheetItemId, val);
      if (ok) {
        closeFridgeSheet();
        await renderFridgeItems();
        showToast(val ? '期限を設定しました' : '保存しました');
      } else {
        showToast('更新に失敗しました', 'error');
      }
    }

    async function clearFridgeSheetDate() {
      if (!sheetItemId) return;
      const ok = await updateFridgeExpiry(sheetItemId, null);
      if (ok) {
        closeFridgeSheet();
        await renderFridgeItems();
        showToast('期限を削除しました');
      } else {
        showToast('更新に失敗しました', 'error');
      }
    }

    async function deleteFridgeSheetItem() {
      if (!sheetItemId) return;
      const ok = await deleteFridgeItem(sheetItemId);
      if (ok) {
        closeFridgeSheet();
        await renderFridgeItems();
      } else {
        showToast('削除に失敗しました', 'error');
      }
    }

    // 「使い切ったので削除、かつ買い忘れないよう買い物リストへ」をワンタップで行う
    async function deleteFridgeSheetItemToShoppingList() {
      if (!sheetItemId) return;
      const name = document.getElementById('bsTitle').textContent.trim();
      await addShoppingManualItem(householdId, name);
      const ok = await deleteFridgeItem(sheetItemId);
      if (ok) {
        closeFridgeSheet();
        await renderFridgeItems();
        await renderShoppingList();
        showToast(name + ' を買い物リストに追加しました 🛒');
      } else {
        showToast('削除に失敗しました', 'error');
      }
    }

    async function renderFridgeItems() {
      const container = document.getElementById('fridgeChips');
      if (!householdId) return;

      const items = await getFridgeItems(householdId);
      if (items.length === 0) {
        container.innerHTML = '<span class="fridge-empty">食材を登録するとAIが献立を提案しやすくなります</span>';
        return;
      }

      const today = toDateStr();
      container.innerHTML = items.map(item => {
        const expiry = buildExpiryText(item, today);
        const soon = expiry && expiry.soon;
        const chipClass = 'fridge-chip' + (soon ? ' expiring-soon' : '');
        const dateBtn = expiry
          ? `<button class="chip-date-btn has-date" title="期限を変更">${expiry.label} ✏️</button>`
          : `<button class="chip-date-btn" title="消費期限を設定">📅</button>`;
        return `<span class="${chipClass}" data-id="${item.id}" data-name="${item.name.replace(/"/g,'&quot;')}" data-expires="${item.expires_on || ''}">${item.name}${dateBtn}</span>`;
      }).join('');

      // チップタップ → ボトムシート（1つのイベントデリゲートで管理）
      container.onclick = e => {
        const chip = e.target.closest('[data-id]');
        if (!chip) return;
        openFridgeSheet(chip.dataset.id, chip.dataset.name, chip.dataset.expires);
      };
    }

    const FRIDGE_MAX = 30;

    async function addFridgeItemUI() {
      const input = document.getElementById('fridgeInput');
      const name = input.value.trim();
      if (!name) return;

      const current = document.querySelectorAll('.fridge-chip').length;
      if (current >= FRIDGE_MAX) {
        const guide = document.getElementById('fridgeGuide');
        guide.textContent = '上限（' + FRIDGE_MAX + '個）に達しました。使い切った食材を削除してください。';
        guide.classList.remove('hidden');
        return;
      }

      input.value = '';
      const guide = document.getElementById('fridgeGuide');
      guide.classList.add('hidden');

      const result = await addFridgeItem(householdId, name, null);
      if (result) {
        await renderFridgeItems();
        const after = document.querySelectorAll('.fridge-chip').length;
        if (after >= FRIDGE_MAX - 5) {
          guide.textContent = '残り' + (FRIDGE_MAX - after) + '個登録できます。調味料など常備品は登録不要です。';
          guide.classList.remove('hidden');
        }
      } else {
        showToast('追加に失敗しました', 'error');
      }
    }

    async function removeFridgeItemUI(itemId) {
      const ok = await deleteFridgeItem(itemId);
      if (ok) {
        await renderFridgeItems();
      } else {
        showToast('削除に失敗しました', 'error');
      }
    }

    // ---- また食べたいランキング ----
    async function renderLikedList() {
      const list = document.getElementById('likedList');
      if (!householdId) return;

      const dishes = await getLikedDishes(householdId, 5);
      if (!dishes.length) return;

      const medals = ['🥇','🥈','🥉','4','5'];
      list.innerHTML = dishes.map((d, i) => `
        <div class="liked-item fade-in" style="animation-delay:${i*0.08}s">
          <div class="liked-rank">${medals[i]}</div>
          <div class="liked-name">${d.dish_name}</div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
            <span style="font-size:0.75rem;color:var(--muted)">${d.rating >= 5 ? '❤️ また食べたい' : '★'.repeat(d.rating)}</span>
          </div>
        </div>
      `).join('');
    }

    // ---- 買い物リスト ----
    async function renderShoppingList() {
      const listEl = document.getElementById('shoppingList');
      const metaEl = document.getElementById('shoppingMeta');
      const actionsEl = document.getElementById('shoppingActions');
      if (!householdId) return;

      listEl.innerHTML = '<div class="shopping-empty">読み込み中...</div>';
      actionsEl.style.display = 'none';
      metaEl.textContent = '';

      // 今週 (今日〜6日前) のログを取得
      const today = new Date();
      const logs = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() - i);
        const dateStr = toDateStr(d);
        const dayLogs = await getLogsByDate(householdId, dateStr);
        logs.push(...dayLogs);
      }

      // ingredients を展開・集約
      // 給食（source==='kyushoku'）は学校が用意するもので家庭で買う必要が無いため、
      // 買い物リストの自動生成対象からは除外する
      const ingredientCount = {};
      logs.forEach(log => {
        if (log.source === 'kyushoku') return;
        if (!log.ingredients || !log.ingredients.length) return;
        log.ingredients.forEach(ing => {
          const name = ing.trim();
          if (!name) return;
          ingredientCount[name] = (ingredientCount[name] || 0) + 1;
        });
      });

      // 冷蔵庫にある食材・削除（非表示）指定した食材を除外
      const fridgeItems = await getFridgeItems(householdId);
      const fridgeNames = fridgeItems.map(f => f.name);
      const dismissedNames = await getShoppingDismissed(householdId);
      const manualItems = await getShoppingManualItems(householdId);

      // 使用頻度順でソート・冷蔵庫食材＆削除指定は除外
      const allItems = Object.entries(ingredientCount)
        .sort((a, b) => b[1] - a[1])
        .map(([name]) => name);
      const autoNeedToBuy = allItems.filter(name => !fridgeNames.includes(name) && !dismissedNames.includes(name));
      const alreadyHave = allItems.filter(name => fridgeNames.includes(name));

      // 手動追加分（自動検出とかぶるものは除く）
      const autoNames = new Set(autoNeedToBuy);
      const manualNeedToBuy = manualItems.filter(m => !autoNames.has(m.name));

      const totalCount = autoNeedToBuy.length + manualNeedToBuy.length;

      if (totalCount === 0) {
        listEl.innerHTML = allItems.length
          ? '<div class="shopping-empty">今週の食材は冷蔵庫にすべて揃っています 🎉</div>'
          : '<div class="shopping-empty">今週の献立に食材情報がありません。<br>献立記録時に食材を入力するか、下から手動で追加できます。</div>';
        metaEl.textContent = alreadyHave.length ? '冷蔵庫に' + alreadyHave.length + '品あり' : '';
        actionsEl.style.display = 'flex';
        return;
      }

      metaEl.textContent = totalCount + '品 · 冷蔵庫に' + alreadyHave.length + '品あり';
      const autoHtml = autoNeedToBuy.map(name => `
        <div class="shopping-item">
          <div class="shopping-checkbox-area" onclick="toggleShoppingItem(this.parentElement)" style="display:flex;align-items:center;gap:10px;flex:1;">
            <div class="shopping-checkbox"></div>
            <div class="shopping-item-name">${name}</div>
          </div>
          <button class="shopping-item-del" onclick="event.stopPropagation(); removeShoppingItem(this, '${name.replace(/'/g, "\\'")}')" title="リストから削除">✕</button>
        </div>
      `).join('');
      const manualHtml = manualNeedToBuy.map(m => `
        <div class="shopping-item" data-manual="1">
          <div class="shopping-checkbox-area" onclick="toggleShoppingItem(this.parentElement)" style="display:flex;align-items:center;gap:10px;flex:1;">
            <div class="shopping-checkbox"></div>
            <div class="shopping-item-name">${m.name}</div>
            <span class="shopping-item-manual-tag">手動</span>
          </div>
          <button class="shopping-item-del" onclick="event.stopPropagation(); removeManualShoppingItem(this, '${m.id}')" title="リストから削除">✕</button>
        </div>
      `).join('');
      listEl.innerHTML = autoHtml + manualHtml;
      actionsEl.style.display = 'flex';
    }

    async function addShoppingManualItemUI() {
      const input = document.getElementById('shoppingManualInput');
      const name = input.value.trim();
      if (!name) return;
      input.value = '';
      const result = await addShoppingManualItem(householdId, name);
      if (!result) { showToast('追加に失敗しました', 'error'); return; }
      await renderShoppingList();
    }

    async function removeManualShoppingItem(btn, id) {
      const ok = await deleteShoppingManualItem(id);
      if (!ok) { showToast('削除に失敗しました', 'error'); return; }
      btn.closest('.shopping-item').remove();
      const remaining = document.querySelectorAll('#shoppingList .shopping-item').length;
      const metaEl = document.getElementById('shoppingMeta');
      if (!remaining) {
        document.getElementById('shoppingList').innerHTML = '<div class="shopping-empty">今週の食材は冷蔵庫にすべて揃っています 🎉</div>';
      } else {
        metaEl.textContent = metaEl.textContent.replace(/^\d+品/, remaining + '品');
      }
    }

    async function removeShoppingItem(btn, name) {
      const ok = await dismissShoppingItem(householdId, name);
      if (!ok) { showToast('削除に失敗しました', 'error'); return; }
      btn.closest('.shopping-item').remove();
      const remaining = document.querySelectorAll('#shoppingList .shopping-item').length;
      const metaEl = document.getElementById('shoppingMeta');
      if (!remaining) {
        document.getElementById('shoppingList').innerHTML = '<div class="shopping-empty">今週の食材は冷蔵庫にすべて揃っています 🎉</div>';
      } else {
        metaEl.textContent = metaEl.textContent.replace(/^\d+品/, remaining + '品');
      }
    }

    async function toggleShoppingItem(el) {
      const wasChecked = el.classList.contains('checked');
      el.classList.toggle('checked');

      // チェックを入れた（＝買った）ときだけ冷蔵庫に自動登録。
      // チェックを外しても冷蔵庫からは削除しない（誤操作で消えると困るため）。
      if (wasChecked) return;

      // 手動追加した項目（ティッシュ・洗剤など食材とは限らないもの）は、
      // 自動検出と違って食材かどうか分からないため、追加前に確認する
      const isManual = el.dataset.manual === '1';
      const name = el.querySelector('.shopping-item-name').textContent.trim();
      if (isManual && !confirm(name + ' を冷蔵庫の食材に追加しますか？')) return;

      const fridgeCount = document.querySelectorAll('.fridge-chip').length;
      if (fridgeCount >= FRIDGE_MAX) {
        showToast('冷蔵庫の登録上限（' + FRIDGE_MAX + '個）に達しているため追加できませんでした', 'error');
        return;
      }
      const result = await addFridgeItem(householdId, name, null);
      if (result) {
        showToast(name + ' を冷蔵庫に追加しました 🧊');
        await renderFridgeItems();
      }
    }

    function copyShoppingList() {
      const items = Array.from(document.querySelectorAll('#shoppingList .shopping-item:not(.checked)'))
        .map(el => '・' + el.querySelector('.shopping-item-name').textContent.trim());
      if (!items.length) {
        showToast('未購入の食材がありません');
        return;
      }
      const text = ['\u{1F6D2} 今週の買い物リスト', ...items].join('\n');
      navigator.clipboard.writeText(text).then(() => {
        showToast('リストをコピーしました 📋');
      }).catch(() => {
        showToast('コピーできませんでした', 'error');
      });
    }

    // 冷蔵庫スキャン
    function triggerFridgeScan() {
      document.getElementById("fridgeScanInput").click();
    }
    async function handleFridgeScan(e) {
      const file = e.target.files[0];
      if (!file) return;
      const resultEl = document.getElementById("fridgeScanResult");
      const chipsEl = document.getElementById("fridgeScanChips");
      const actionsEl = resultEl.querySelector(".fridge-scan-actions");
      resultEl.classList.remove("hidden");
      chipsEl.innerHTML = "<div class=\"fridge-scanning\">🔍 認識中...</div>";
      actionsEl.style.display = "none";
      try {
        const b64 = await new Promise(function(res, rej) {
          const r = new FileReader();
          r.onload = function() { res(r.result.split(",")[1]); };
          r.onerror = rej;
          r.readAsDataURL(file);
        });
        const session = await getSession();
        const resp = await fetch("https://sfhtvtcmgueystyuhzvd.supabase.co/functions/v1/tavera-fridge-scan", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + (session?.access_token || ""),
          },
          body: JSON.stringify({ image: b64, mediaType: file.type })
        });
        const d = await resp.json();
        if (d.error) throw new Error(d.error);
        const items = d.items || [];
        if (!items.length) {
          chipsEl.innerHTML = "<span style=\"font-size:0.82rem;color:var(--muted)\">食材を認識できませんでした。別の写真を試してください。</span>";
          actionsEl.style.display = "flex";
          e.target.value = "";
          return;
        }
        chipsEl.innerHTML = items.map(function(item) {
          return "<button class=\"fridge-scan-chip\" onclick=\"this.classList.toggle('deselected')\">" + item + "</button>";
        }).join("");
        actionsEl.style.display = "flex";
      } catch(err) {
        chipsEl.innerHTML = "<span style=\"font-size:0.82rem;color:var(--terra)\">" + (err.message || "エラーが発生しました。") + "</span>";
        actionsEl.style.display = "flex";
      }
      e.target.value = "";
    }
    function cancelFridgeScan() {
      document.getElementById("fridgeScanResult").classList.add("hidden");
    }
    async function confirmFridgeScan() {
      const chips = document.querySelectorAll("#fridgeScanChips .fridge-scan-chip:not(.deselected)");
      const items = Array.from(chips).map(function(c) { return c.textContent.trim(); });
      if (!items.length) { cancelFridgeScan(); return; }
      const existing = (await getFridgeItems(householdId)).map(function(i) { return i.name; });
      const newItems = items.filter(function(i) { return !existing.includes(i); });
      for (var n = 0; n < newItems.length; n++) {
        await addFridgeItem(householdId, newItems[n], null);
      }
      cancelFridgeScan();
      await renderFridgeItems();
      showToast(newItems.length + "件の食材を追加しました 🧊");
    }

    function showAccountMenu() {
      const menu = document.getElementById('accountMenu');
      getUser().then(user => {
        if (user) document.getElementById('accountMenuEmail').textContent = user.email;
      });
      menu.style.display = 'block';
    }
    function hideAccountMenu() {
      document.getElementById('accountMenu').style.display = 'none';
    }
    async function confirmSignOut() {
      hideAccountMenu();
      await signOut();
    }
    async function switchAccount() {
      hideAccountMenu();
      if (typeof isInAppBrowser === 'function' && isInAppBrowser()) {
        showExternalBrowserGuide();
        return;
      }
      // ログアウト後、Googleのアカウント選択画面を直接開く（prompt=select_accountで強制表示）
      await db.auth.signOut();
      const { error } = await db.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: 'https://tavera.taskra.jp/home.html',
          queryParams: { prompt: 'select_account' }
        }
      });
      if (error) window.location.href = 'index.html?lp=1';
    }

    init();
    initPullToRefresh(async () => { await init(); });
  </script>
</body>
