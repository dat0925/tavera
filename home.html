<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>ホーム - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/menu-log.js"></script>
  <style>
    .date-strip {
      display: flex;
      gap: 6px;
      padding: 16px 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .date-strip::-webkit-scrollbar { display: none; }

    .date-chip {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--border);
      background: var(--white);
      cursor: pointer;
      transition: all var(--transition);
      min-width: 44px;
    }
    .date-chip.active {
      background: var(--terra);
      border-color: var(--terra);
      color: var(--white);
    }
    .date-chip.has-log { border-color: var(--amber); }
    .date-chip .chip-day { font-size: 0.65rem; color: inherit; opacity: 0.7; }
    .date-chip .chip-date { font-size: 1rem; font-weight: 700; }
    .date-chip.active .chip-day { opacity: 0.8; }

    .today-section { padding: 16px 20px 0; }
    .today-date {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--brown);
      margin-bottom: 14px;
    }

    .liked-section { padding: 0 20px; }
    .liked-list { display: flex; flex-direction: column; gap: 8px; }
    .liked-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .liked-rank {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--amber);
      width: 24px;
      text-align: center;
    }
    .liked-name { font-size: 0.9rem; font-weight: 500; flex: 1; }

    .fab {
      position: fixed;
      bottom: 90px;
      right: calc(50% - 230px);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--terra);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(200,82,42,0.40);
      transition: all var(--transition);
      z-index: 50;
      font-size: 1.5rem;
      text-decoration: none;
    }
    .fab:hover { transform: scale(1.08); background: #b8451f; }

    @media (max-width: 480px) {
      .fab { right: 20px; }
    }

    /* =====================
       冷蔵庫セクション
    ===================== */
    .fridge-section { padding: 0 20px; }

    .fridge-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      min-height: 32px;
    }

    .fridge-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 99px;
      background: #EEF3E2;
      border: 1.5px solid var(--olive);
      color: var(--olive);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
    }
    .fridge-chip:hover { background: #e2ebd3; }

    .fridge-chip.expiring-soon {
      background: #FEF3EC;
      border-color: var(--terra);
      color: var(--terra);
    }
    .fridge-chip.expiring-soon:hover { background: #fde8d8; }

    .fridge-chip .chip-del {
      background: none;
      border: none;
      color: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      padding: 0;
      opacity: 0.6;
      line-height: 1;
      margin-left: 2px;
    }
    .fridge-chip .chip-del:hover { opacity: 1; }

    /* インライン期限ピッカー */
    .chip-expiry-row {
      width: 100%;
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--white);
      border: 1.5px solid var(--olive);
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeIn 0.15s ease;
    }
    .chip-expiry-label {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .chip-expiry-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 5px 8px;
      font-size: 0.82rem;
      outline: none;
      font-family: var(--font-body);
      color: var(--brown);
    }
    .chip-expiry-input:focus { border-color: var(--olive); }
    .chip-expiry-save {
      background: var(--olive);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: var(--font-body);
    }
    .chip-expiry-clear {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      padding: 2px 4px;
    }

    .fridge-add-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .fridge-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 99px;
      padding: 9px 16px;
      font-size: 0.88rem;
      outline: none;
      background: var(--white);
      font-family: var(--font-body);
      color: var(--brown);
      transition: border-color var(--transition);
    }
    .fridge-input:focus { border-color: var(--olive); }
    .fridge-input::placeholder { color: var(--border); }

    .fridge-guide {
      font-size: 0.75rem;
      color: var(--terra);
      margin-top: 6px;
      padding: 0 2px;
    }

    .fridge-empty {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 4px 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <div id="userAvatar" style="cursor:pointer" onclick="signOut()"></div>
      <a href="kyushoku.html" style="font-size:0.75rem;color:var(--muted);white-space:nowrap;padding:4px 8px;border:1px solid var(--border);border-radius:99px;text-decoration:none;flex-shrink:0">&#128203; 給食</a>
    </header>

    <div class="page">
      <!-- 日付スクロールバー -->
      <div class="date-strip" id="dateStrip"></div>

      <!-- 今日の献立 -->
      <div class="today-section">
        <div class="today-date" id="todayLabel">今日の献立</div>
        <div class="meal-grid" id="mealGrid">
          <div class="meal-cell">
            <div class="meal-type">朝</div>
            <div class="meal-empty">未登録</div>
          </div>
          <div class="meal-cell">
            <div class="meal-type">昼</div>
            <div class="meal-empty">未登録</div>
          </div>
          <div class="meal-cell">
            <div class="meal-type">夜</div>
            <div class="meal-empty">未登録</div>
          </div>
        </div>
      </div>

      <!-- 区切り -->
      <div class="divider" style="margin:20px 20px 0;"></div>

      <!-- 冷蔵庫食材メモ -->
      <div class="section-header">
        <span class="section-title">🧊 冷蔵庫の食材</span>
        <span style="font-size:0.75rem;color:var(--muted);">AI提案に自動反映</span>
      </div>
      <div class="fridge-section">
        <!-- 登録済み食材チップ -->
        <div class="fridge-chips" id="fridgeChips">
          <span class="fridge-empty">食材を登録するとAIが献立を提案しやすくなります</span>
        </div>
        <!-- 追加フォーム -->
        <div class="fridge-add-row">
          <input type="text" id="fridgeInput" class="fridge-input"
                 placeholder="早めに使いたい食材を登録（Enterで追加）"
                 maxlength="20"
                 onkeydown="if(event.key==='Enter')addFridgeItemUI()">
        </div>
        <div id="fridgeGuide" class="fridge-guide hidden"></div>
      </div>

      <!-- 区切り -->
      <div class="divider" style="margin:20px 20px 0;"></div>

      <!-- また食べたいランキング -->
      <div class="section-header">
        <span class="section-title">⭐ また食べたいランキング</span>
      </div>
      <div class="liked-section">
        <div class="liked-list" id="likedList">
          <div class="empty-state" style="padding:24px 0;">
            <p class="text-sm text-muted">献立を記録すると<br>ランキングが表示されます</p>
          </div>
        </div>
      </div>
    </div>

    <!-- FAB：献立を記録 -->
    <a href="log.html" class="fab" title="献立を記録">＋</a>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <a href="home.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="log.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        記録
      </a>
      <a href="history.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="suggest.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
    </nav>
  </div>

  <script>
    const DAY_LABELS = ['日','月','火','水','木','金','土'];
    let selectedDate = toDateStr();
    let householdId = null;

    async function init() {
      const user = await requireAuth();
      if (!user) return;

      renderUserInfo('userAvatar');
      householdId = await getOrCreateHousehold(user.id);
      currentHousehold = householdId;

      renderDateStrip();
      await renderMealGrid(selectedDate);
      await renderFridgeItems();
      await renderLikedList();
    }

    function renderDateStrip() {
      const strip = document.getElementById('dateStrip');
      strip.innerHTML = '';
      const today = new Date();

      for (let i = -3; i <= 3; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const dateStr = toDateStr(d);

        const chip = document.createElement('div');
        chip.className = 'date-chip' + (dateStr === selectedDate ? ' active' : '');
        chip.innerHTML = `
          <span class="chip-day">${DAY_LABELS[d.getDay()]}</span>
          <span class="chip-date">${d.getDate()}</span>
        `;
        chip.addEventListener('click', () => selectDate(dateStr, chip));
        strip.appendChild(chip);
      }
    }

    async function selectDate(dateStr, chipEl) {
      selectedDate = dateStr;
      document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');

      const d = new Date(dateStr);
      const label = dateStr === toDateStr()
        ? '今日の献立'
        : `${d.getMonth()+1}月${d.getDate()}日（${DAY_LABELS[d.getDay()]}）の献立`;
      document.getElementById('todayLabel').textContent = label;

      await renderMealGrid(dateStr);
    }

    async function renderMealGrid(dateStr) {
      const grid = document.getElementById('mealGrid');
      if (!householdId) return;

      const logs = await getLogsByDate(householdId, dateStr);
      const logMap = {};
      logs.forEach(l => logMap[l.meal_type] = l);

      const meals = ['breakfast','lunch','dinner'];
      const labels = { breakfast:'朝', lunch:'昼', dinner:'夜' };

      grid.innerHTML = meals.map(type => {
        const log = logMap[type];
        return `
          <div class="meal-cell ${log ? 'has-entry' : ''}"
               onclick="location.href='log.html?date=${dateStr}&meal=${type}'">
            <div class="meal-type">${labels[type]}</div>
            ${log
              ? `<div class="meal-name">${log.dish_name}</div>`
              : `<div class="meal-empty">タップして登録</div>`
            }
          </div>
        `;
      }).join('');
    }

    // ---- 冷蔵庫食材 ----
    let openExpiryId = null; // 現在期限ピッカーが開いているチップのID

    function buildExpiryLabel(item, today) {
      if (!item.expires_on) return '';
      const diffDays = Math.ceil((new Date(item.expires_on) - new Date(today)) / 86400000);
      if (diffDays <= 0) return ' <small>(期限切れ)</small>';
      if (diffDays <= 3) return ` <small>(あと${diffDays}日)</small>`;
      return ` <small style="opacity:.7">(${item.expires_on.slice(5).replace('-','/')})</small>`;
    }

    async function renderFridgeItems() {
      const container = document.getElementById('fridgeChips');
      if (!householdId) return;

      const items = await getFridgeItems(householdId);
      if (items.length === 0) {
        container.innerHTML = '<span class="fridge-empty">食材を登録するとAIが献立を提案しやすくなります</span>';
        openExpiryId = null;
        return;
      }

      const today = toDateStr();
      const html = items.map(item => {
        const expiringSoon = item.expires_on &&
          Math.ceil((new Date(item.expires_on) - new Date(today)) / 86400000) <= 3;
        const expiresLabel = buildExpiryLabel(item, today);
        const chipClass = expiringSoon ? 'fridge-chip expiring-soon' : 'fridge-chip';

        let pickerHtml = '';
        if (openExpiryId === item.id) {
          pickerHtml = `
            <div class="chip-expiry-row" onclick="event.stopPropagation()">
              <span class="chip-expiry-label">消費期限</span>
              <input type="date" class="chip-expiry-input" id="expiryInput_${item.id}"
                     value="${item.expires_on || ''}">
              <button class="chip-expiry-save" onclick="saveExpiry('${item.id}')">保存</button>
              <button class="chip-expiry-clear" onclick="clearExpiry('${item.id}')" title="期限を削除">✕</button>
            </div>`;
        }

        return `
          <span class="${chipClass}" onclick="toggleExpiry('${item.id}', event)">
            ${item.name}${expiresLabel}
            <button class="chip-del" onclick="event.stopPropagation(); removeFridgeItem('${item.id}')" title="削除">✕</button>
          </span>${pickerHtml}`;
      }).join('');

      container.innerHTML = html;
    }

    function toggleExpiry(itemId, event) {
      event.stopPropagation();
      openExpiryId = (openExpiryId === itemId) ? null : itemId;
      renderFridgeItems();
    }

    async function saveExpiry(itemId) {
      const input = document.getElementById('expiryInput_' + itemId);
      const val = input ? input.value || null : null;
      const ok = await updateFridgeExpiry(itemId, val);
      if (ok) {
        openExpiryId = null;
        await renderFridgeItems();
        showToast(val ? '期限を設定しました' : '期限を削除しました');
      } else {
        showToast('更新に失敗しました', 'error');
      }
    }

    async function clearExpiry(itemId) {
      const ok = await updateFridgeExpiry(itemId, null);
      if (ok) {
        openExpiryId = null;
        await renderFridgeItems();
        showToast('期限を削除しました');
      } else {
        showToast('更新に失敗しました', 'error');
      }
    }

    const FRIDGE_MAX = 30;

    async function addFridgeItemUI() {
      const input = document.getElementById('fridgeInput');
      const name = input.value.trim();
      if (!name) return;

      const current = document.querySelectorAll('.fridge-chip').length;
      if (current >= FRIDGE_MAX) {
        const guide = document.getElementById('fridgeGuide');
        guide.textContent = '上限（' + FRIDGE_MAX + '個）に達しました。使い切った食材を削除してください。';
        guide.classList.remove('hidden');
        return;
      }

      input.value = '';
      const guide = document.getElementById('fridgeGuide');
      guide.classList.add('hidden');

      const result = await addFridgeItem(householdId, name, null);
      if (result) {
        await renderFridgeItems();
        const after = document.querySelectorAll('.fridge-chip').length;
        if (after >= FRIDGE_MAX - 5) {
          guide.textContent = '残り' + (FRIDGE_MAX - after) + '個登録できます。調味料など常備品は登録不要です。';
          guide.classList.remove('hidden');
        }
      } else {
        showToast('追加に失敗しました', 'error');
      }
    }

    async function removeFridgeItem(itemId) {
      if (openExpiryId === itemId) openExpiryId = null;
      const ok = await deleteFridgeItem(itemId);
      if (ok) {
        await renderFridgeItems();
      } else {
        showToast('削除に失敗しました', 'error');
      }
    }

    // ---- また食べたいランキング ----
    async function renderLikedList() {
      const list = document.getElementById('likedList');
      if (!householdId) return;

      const dishes = await getLikedDishes(householdId, 5);
      if (!dishes.length) return;

      const medals = ['🥇','🥈','🥉','4','5'];
      list.innerHTML = dishes.map((d, i) => `
        <div class="liked-item fade-in" style="animation-delay:${i*0.08}s">
          <div class="liked-rank">${medals[i]}</div>
          <div class="liked-name">${d.dish_name}</div>
          <div style="margin-left:auto;display:flex;align-items:center;gap:6px;">
            <span style="font-size:0.75rem;color:var(--muted)">${d.rating >= 5 ? '❤️ また食べたい' : '★'.repeat(d.rating)}</span>
          </div>
        </div>
      `).join('');
    }

    init();
  </script>
</body>
</html>
