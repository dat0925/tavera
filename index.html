<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Tavera - 献立管理</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
      background: var(--cream);
      position: relative;
      overflow: hidden;
    }

    /* 背景の装飾円 */
    .login-page::before {
      content: '';
      position: absolute;
      top: -120px;
      right: -80px;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(232,147,42,0.12) 0%, transparent 70%);
    }
    .login-page::after {
      content: '';
      position: absolute;
      bottom: -80px;
      left: -60px;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,82,42,0.08) 0%, transparent 70%);
    }

    .login-logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 8px;
      animation: fadeInUp 0.5s ease;
    }

    .login-brand {
      font-family: var(--font-display);
      font-size: 2.4rem;
      color: var(--terra);
      letter-spacing: 0.04em;
      margin-bottom: 8px;
      animation: fadeInUp 0.5s ease 0.1s both;
    }

    .login-tagline {
      font-size: 0.9rem;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 48px;
      animation: fadeInUp 0.5s ease 0.2s both;
    }

    .login-card {
      width: 100%;
      max-width: 320px;
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 32px 24px;
      box-shadow: 0 8px 32px var(--shadow);
      animation: fadeInUp 0.5s ease 0.3s both;
    }

    .login-card h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--brown);
      text-align: center;
      margin-bottom: 24px;
    }

    .btn-google {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--white);
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--brown);
      transition: all var(--transition);
      cursor: pointer;
      font-family: var(--font-body);
    }

    .btn-google:hover {
      background: var(--surface);
      border-color: var(--terra);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px var(--shadow);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .login-features {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeInUp 0.5s ease 0.4s both;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .feature-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .feature-text h3 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 2px;
    }

    .feature-text p {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .login-footer {
      margin-top: 32px;
      font-size: 0.72rem;
      color: var(--muted);
      text-align: center;
      animation: fadeInUp 0.5s ease 0.5s both;
    }
  </style>
</head>
<body>
  <div class="login-page">
    <img src="assets/logo.png" alt="Tavera" class="login-logo">
    <div class="login-brand">Tavera</div>
    <p class="login-tagline">
      毎日の「今日何食べる？」を<br>もっとかんたんに。
    </p>

    <div class="login-card">
      <h2>はじめる</h2>
      <button class="btn-google" id="googleLoginBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Googleでログイン
      </button>
    </div>

    <div class="login-features">
      <div class="feature-item">
        <div class="feature-icon">📅</div>
        <div class="feature-text">
          <h3>献立をログに残す</h3>
          <p>朝・昼・夜の献立を記録。ホワイトボードでは残らなかった「あの日の夕食」が見つかる。</p>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">✨</div>
        <div class="feature-text">
          <h3>AIが献立を提案</h3>
          <p>冷蔵庫の食材・予算・気分を伝えるだけ。今日の献立をAIが考えてくれる。</p>
        </div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">👨‍👩‍👧</div>
        <div class="feature-text">
          <h3>家族で共有</h3>
          <p>Googleアカウントで招待するだけで家族全員が同じ献立カレンダーを確認できる。</p>
        </div>
      </div>
    </div>

    <p class="login-footer">
      ログインすることで利用規約・プライバシーポリシーに同意したとみなします
    </p>
  </div>

  <script>
    // 認証済みなら即リダイレクト
    redirectIfAuthed();

    document.getElementById('googleLoginBtn').addEventListener('click', signInWithGoogle);
  </script>
</body>
</html>
