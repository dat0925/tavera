<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tavera Admin</title>
<link rel="icon" href="assets/logo.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --terra:#C8522A;--amber:#E8932A;--cream:#FDF6EC;
  --olive:#6B7A3A;--brown:#4A2E1A;--muted:#9B8878;
  --white:#FFFFFF;--surface:#FFF9F2;--border:#EAD9C8;
  --font-body:'Zen Kaku Gothic New',sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
body{font-family:var(--font-body);background:#f5f5f5;color:var(--brown);font-size:14px;}
a{text-decoration:none;color:inherit;}

/* PIN画面 */
.pin-screen{
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;background:var(--cream);
}
.pin-box{
  background:var(--white);border-radius:16px;padding:40px 32px;
  text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08);width:320px;
}
.pin-logo{font-size:2rem;margin-bottom:8px;}
.pin-title{font-size:1.1rem;font-weight:700;color:var(--brown);margin-bottom:24px;}
.pin-input{
  width:100%;padding:12px 16px;border:1.5px solid var(--border);
  border-radius:10px;font-size:1.2rem;text-align:center;letter-spacing:0.3em;
  font-family:monospace;margin-bottom:16px;
}
.pin-input:focus{outline:none;border-color:var(--terra);}
.pin-btn{
  width:100%;padding:12px;background:var(--terra);color:#fff;
  border:none;border-radius:10px;font-size:1rem;cursor:pointer;font-family:var(--font-body);
}
.pin-error{color:var(--terra);font-size:0.82rem;margin-top:8px;}
.pin-btn{width:100%;padding:12px;background:var(--terra);color:#fff;border:none;border-radius:10px;font-size:1rem;cursor:pointer;font-family:var(--font-body);}

/* 管理画面 */
.admin-wrap{display:none;min-height:100vh;}
.admin-header{
  background:var(--brown);color:#fff;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
}
.admin-header-title{font-size:1rem;font-weight:700;}
.admin-header-sub{font-size:0.75rem;opacity:.6;}
.admin-body{max-width:900px;margin:0 auto;padding:20px 16px 80px;}

/* サマリーカード */
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.summary-card{
  background:var(--white);border-radius:12px;padding:16px;
  border:1px solid var(--border);text-align:center;
}
.summary-num{font-size:1.8rem;font-weight:700;color:var(--terra);}
.summary-label{font-size:0.72rem;color:var(--muted);margin-top:4px;}

/* フィルター */
.filter-row{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center;
}
.filter-select,.filter-input{
  padding:7px 12px;border:1px solid var(--border);border-radius:8px;
  font-size:0.82rem;font-family:var(--font-body);color:var(--brown);background:var(--white);
}
.filter-input{flex:1;min-width:160px;}

/* ユーザーカード（スマホ向け） */
.user-card{
  background:var(--white);border-radius:12px;border:1px solid var(--border);
  padding:14px 16px;margin-bottom:10px;
}
.user-card-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;
}
.user-email{font-size:0.85rem;font-weight:600;word-break:break-all;}
.user-date{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.plan-badge{
  display:inline-block;padding:3px 10px;border-radius:99px;font-size:0.72rem;font-weight:700;white-space:nowrap;
}
.plan-badge.premium{background:#FEF3EC;color:var(--terra);border:1px solid var(--terra);}
.plan-badge.free{background:#F0F0F0;color:#888;border:1px solid #ddd;}
.user-stats{
  display:flex;gap:16px;margin-bottom:12px;
}
.user-stat{font-size:0.75rem;color:var(--muted);}
.user-stat strong{color:var(--brown);font-weight:700;}
.user-actions{display:flex;gap:8px;flex-wrap:wrap;}
.action-btn{
  padding:6px 14px;border-radius:8px;font-size:0.78rem;cursor:pointer;
  font-family:var(--font-body);border:1.5px solid;transition:all .15s;
}
.action-btn.to-premium{color:var(--terra);border-color:var(--terra);background:var(--white);}
.action-btn.to-premium:hover{background:var(--terra);color:#fff;}
.action-btn.to-free{color:#888;border-color:#ddd;background:var(--white);}
.action-btn.to-free:hover{background:#f0f0f0;}

/* ページネーション */
.pagination{display:flex;justify-content:center;gap:8px;margin-top:20px;flex-wrap:wrap;}
.page-btn{
  padding:7px 14px;border:1px solid var(--border);border-radius:8px;
  background:var(--white);cursor:pointer;font-size:0.82rem;font-family:var(--font-body);
}
.page-btn.active{background:var(--terra);color:#fff;border-color:var(--terra);}
.page-btn:disabled{opacity:.4;cursor:default;}

/* トースト */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--brown);color:#fff;padding:10px 20px;border-radius:10px;
  font-size:0.85rem;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1;}

.hidden{display:none!important;}
.loading{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>

<!-- 認証待機画面 -->
<div class="pin-screen" id="pinScreen">
  <div class="pin-box">
    <div class="pin-logo">🍽️</div>
    <div class="pin-title">Tavera Admin</div>
    <div id="authStatus" style="font-size:0.85rem;color:var(--muted);margin-bottom:16px;">認証を確認中...</div>
    <div id="authError" class="pin-error hidden">このアカウントにアクセス権限がありません</div>
  </div>
</div>

<!-- 管理画面 -->
<div class="admin-wrap" id="adminWrap">
  <header class="admin-header">
    <div>
      <div class="admin-header-title">🍽️ Tavera Admin</div>
      <div class="admin-header-sub" id="headerSub">読み込み中...</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;">
      <button onclick="loadUsers()" style="background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:0.78rem;">更新</button>
      <a href="home.html" style="font-size:0.7rem;color:rgba(255,255,255,0.4);text-decoration:none;">← アプリへ</a>
    </div>
  </header>

  <div class="admin-body">
    <!-- サマリー -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-num" id="sumTotal">-</div>
        <div class="summary-label">総ユーザー</div>
      </div>
      <div class="summary-card">
        <div class="summary-num" id="sumPremium">-</div>
        <div class="summary-label">Premiumプラン</div>
      </div>
      <div class="summary-card">
        <div class="summary-num" id="sumAiMonth">-</div>
        <div class="summary-label">今月AI利用回数</div>
      </div>
    </div>

    <!-- フィルター -->
    <div class="filter-row">
      <input type="search" class="filter-input" id="searchInput" placeholder="メールで検索..."
             oninput="applyFilter()">
      <select class="filter-select" id="planFilter" onchange="applyFilter()">
        <option value="">すべてのプラン</option>
        <option value="premium">Premium</option>
        <option value="free">Free</option>
        <option value="none">未設定</option>
      </select>
    </div>

    <!-- ユーザー一覧 -->
    <div id="userList"><div class="loading">読み込み中...</div></div>

    <!-- ページネーション -->
    <div class="pagination" id="pagination"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const ADMIN_EMAIL = 'mstd0520@gmail.com';
  const PER_PAGE = 10;
  // SUPABASE_URL/ANONはsupabase.jsの共通dbを使用

  let allUsers = [];
  let filteredUsers = [];
  let currentPage = 1;

  // Google認証チェック
  async function checkAuth() {
    const user = await getUser();
    if (!user) {
      document.getElementById('authStatus').textContent = 'Googleアカウントでログインしてください。';
      document.getElementById('authStatus').textContent = 'ログインしてからアクセスしてください。';
      const loginBtn = document.createElement('button');
      loginBtn.className = 'pin-btn';
      loginBtn.textContent = 'ログインページへ';
      loginBtn.style.marginTop = '16px';
      loginBtn.onclick = function() { location.href = 'index.html'; };
      document.getElementById('authStatus').insertAdjacentElement('afterend', loginBtn);
      return;
    }
    if (user.email !== ADMIN_EMAIL) {
      document.getElementById('authStatus').textContent = '';
      document.getElementById('authError').classList.remove('hidden');
      return;
    }
    // 認証OK
    document.getElementById('pinScreen').style.display = 'none';
    document.getElementById('adminWrap').style.display = 'block';
    loadUsers();
  }

  // ユーザー読み込み
  async function loadUsers() {
    document.getElementById('userList').innerHTML = '<div class="loading">読み込み中...</div>';
    try {
      const session = await getSession();
      if (!session) { showToast('ログインが必要です'); return; }

      // RPC経由で全ユーザー取得（SECURITY DEFINER）
      const { data: rows, error } = await db.rpc('admin_get_all_users');
      if (error) throw error;

      allUsers = rows.map(r => ({
        id: r.id,
        email: r.email || r.id.slice(0, 8) + '...',
        plan: r.plan || 'free',
        plan_expires_at: r.plan_expires_at,
        created_at: r.created_at,
        ai_total: Number(r.ai_total) || 0,
        ai_month: Number(r.ai_month) || 0,
        household_name: r.household_name || '-',
      }));

      // サマリー
      const totalAiMonth = allUsers.reduce((s, u) => s + u.ai_month, 0);
      document.getElementById('sumTotal').textContent = allUsers.length;
      document.getElementById('sumPremium').textContent = allUsers.filter(u => u.plan === 'premium').length;
      document.getElementById('sumAiMonth').textContent = totalAiMonth;
      document.getElementById('headerSub').textContent = `${allUsers.length}ユーザー · 最終更新 ${new Date().toLocaleTimeString('ja-JP')}`;

      applyFilter();
    } catch(e) {
      document.getElementById('userList').innerHTML = '<div class="loading">エラー: ' + e.message + '</div>';
    }
  }

  function applyFilter() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const plan = document.getElementById('planFilter').value;
    filteredUsers = allUsers.filter(u => {
      const matchQ = !q || u.email.toLowerCase().includes(q) || u.id.toLowerCase().includes(q);
      const matchPlan = !plan ||
        (plan === 'none' ? (!u.plan || u.plan === 'free') :
         plan === 'free' ? u.plan === 'free' : u.plan === plan);
      return matchQ && matchPlan;
    });
    currentPage = 1;
    renderUsers();
  }

  function renderUsers() {
    const start = (currentPage - 1) * PER_PAGE;
    const page = filteredUsers.slice(start, start + PER_PAGE);
    const totalPages = Math.ceil(filteredUsers.length / PER_PAGE);

    if (!page.length) {
      document.getElementById('userList').innerHTML = '<div class="loading">該当なし</div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    document.getElementById('userList').innerHTML = page.map(u => {
      const isPremium = u.plan === 'premium';
      const createdDate = u.created_at ? new Date(u.created_at).toLocaleDateString('ja-JP') : '-';
      const expires = u.plan_expires_at ? new Date(u.plan_expires_at).toLocaleDateString('ja-JP') : null;
      return `<div class="user-card">
        <div class="user-card-head">
          <div>
            <div class="user-email">${u.email}</div>
            <div class="user-date">登録: ${createdDate}${expires ? ' · 期限: ' + expires : ''}</div>
          </div>
          <span class="plan-badge ${isPremium ? 'premium' : 'free'}">${isPremium ? 'Premium' : 'Free'}</span>
        </div>
        <div class="user-stats">
          <div class="user-stat">AI今月 <strong>${u.ai_month}回</strong></div>
          <div class="user-stat">AI累計 <strong>${u.ai_total}回</strong></div>
          <div class="user-stat">世帯名 <strong>${u.household_name}</strong></div>
        </div>
        <div class="user-actions">
          ${!isPremium ? `<button class="action-btn to-premium" onclick="changePlan('${u.id}','premium')">Premiumに変更</button>` : ''}
          ${isPremium ? `<button class="action-btn to-free" onclick="changePlan('${u.id}','free')">Freeに戻す</button>` : ''}
        </div>
      </div>`;
    }).join('');

    // ページネーション
    let pages = '';
    pages += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (totalPages <= 7 || i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
        pages += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 2) {
        pages += `<span style="padding:7px 4px;color:var(--muted)">…</span>`;
      }
    }
    pages += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>›</button>`;
    document.getElementById('pagination').innerHTML = pages;
  }

  function goPage(p) {
    const totalPages = Math.ceil(filteredUsers.length / PER_PAGE);
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderUsers();
    window.scrollTo(0, 0);
  }

  async function changePlan(userId, newPlan) {
    const label = newPlan === 'premium' ? 'Premiumに変更' : 'Freeに戻す';
    if (!confirm(label + 'しますか？')) return;
    try {
      const expires = newPlan === 'premium'
        ? new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString()
        : null;
      const { error } = await db
        .from('menu_members')
        .update({ plan: newPlan, plan_expires_at: expires })
        .eq('id', userId);
      if (error) throw error;
      showToast('✅ プランを変更しました');
      const u = allUsers.find(u => u.id === userId);
      if (u) { u.plan = newPlan; u.plan_expires_at = expires; }
      renderUsers();
      document.getElementById('sumPremium').textContent = allUsers.filter(u => u.plan === 'premium').length;
    } catch(e) {
      showToast('❌ ' + e.message);
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // 認証チェック実行
  checkAuth();
</script>
</body>
</html>
