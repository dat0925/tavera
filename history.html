<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>履歴 - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tavera">
  <meta name="theme-color" content="#C8522A">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=20260629"></script>
  <script src="js/auth.js?v=20260629"></script>
  <script src="js/menu-log.js?v=20260703c"></script>
  <style>
    /* ---- ツールバー ---- */
    .toolbar {
      padding: 12px 20px 10px;
      position: sticky;
      top: 57px;
      background: var(--white);
      z-index: 10;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    @media (min-width: 769px) {
      .toolbar {
        grid-column: 2;
        grid-row: 1;
        top: 0;
      }
      #listView, #calView {
        grid-column: 2;
        grid-row: 2;
      }
    }
    .toolbar-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-input-wrap {
      position: relative;
      flex: 1;
    }
    .search-input-wrap input { padding-left: 36px; }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.95rem;
    }
    .view-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      margin-left: auto;
    }
    .view-toggle button {
      padding: 7px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .view-toggle button.active {
      background: var(--terra);
      color: #fff;
    }

    /* ---- リストビュー ---- */
    .history-list {
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .history-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
    }
    .history-item:hover { border-color: var(--amber); box-shadow: 0 2px 8px var(--shadow); }
    .history-item.is-today { border-color: var(--terra); box-shadow: 0 0 0 2px rgba(198, 93, 62, 0.15); }
    .history-today-label { font-size: 0.65rem; font-weight: 700; color: var(--terra); flex-shrink: 0; }
    .history-date-badge { text-align: center; flex-shrink: 0; width: 44px; padding-top: 2px; }
    .history-date-badge .month { font-size: 0.65rem; color: var(--muted); }
    .history-date-badge .day   { font-size: 1.2rem; font-weight: 700; color: var(--brown); font-family: var(--font-display); }
    .history-meal-badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; }
    .badge-breakfast { background:#FFF3CD; color:#856404; }
    .badge-lunch     { background:#D1ECF1; color:#0C5460; }
    .badge-dinner    { background:#E8ECFF; color:#3042a0; }
    /* 1行にすべて詰め込むと料理名が極端に狭くなり縦割れするため、
       「バッジ＋料理名」の行と「評価・アイコン類」の行に分ける */
    .history-content { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .history-row-main { display: flex; align-items: flex-start; gap: 8px; }
    .history-dish   { font-size: 0.95rem; font-weight: 500; flex: 1; min-width: 0; }
    .history-row-sub { display: flex; align-items: center; gap: 10px; }
    .history-row-sub-spacer { flex: 1; }
    .history-rating { font-size: 0.75rem; color: var(--amber); flex-shrink: 0; }
    .heart-btn {
      font-size: 1.2rem; flex-shrink: 0; background: none; border: none;
      cursor: pointer; line-height: 1; padding: 4px; transition: transform 0.15s ease;
    }
    .heart-btn:active { transform: scale(1.4); }

    /* ---- 献立コメント ---- */
    .history-comment-btn {
      position: relative; flex-shrink: 0;
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 50%; color: var(--muted);
    }
    .history-comment-btn.has-comments {
      border-color: var(--terra); color: var(--terra); background: #FEF3EC;
    }
    .history-comment-btn .count {
      position: absolute; top: -5px; right: -5px;
      background: var(--terra); color: #fff;
      font-size: 0.58rem; font-weight: 700;
      min-width: 14px; height: 14px; padding: 0 2px;
      border-radius: 99px;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .bottom-sheet-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      animation: fadeIn 0.2s ease;
    }
    .bottom-sheet-overlay.open { display: block; }
    .bottom-sheet {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 40px;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .bottom-sheet.open { transform: translateY(0); }
    .bs-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 18px;
    }
    .bs-title {
      font-size: 1rem; font-weight: 700;
      color: var(--brown); margin-bottom: 16px;
    }
    .comment-sheet-label {
      font-size: 0.82rem; color: var(--muted); margin-bottom: 12px;
    }
    .comment-list {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 30vh; overflow-y: auto;
      margin-bottom: 14px;
    }
    .comment-item {
      background: var(--surface); border-radius: 12px;
      padding: 8px 12px; font-size: 0.85rem; color: var(--brown);
    }
    .comment-item .meta {
      font-size: 0.68rem; color: var(--muted); margin-top: 3px;
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .comment-action-btn {
      background: none; border: none; padding: 0; margin-left: 6px;
      font-size: 0.68rem; color: var(--olive); font-family: inherit; cursor: pointer;
      text-decoration: underline; -webkit-tap-highlight-color: transparent;
    }
    .comment-edited-tag { color: var(--muted); }
    .comment-edit-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #FEF3EC; border: 1px solid var(--terra);
      border-radius: 10px; padding: 8px 12px; margin-bottom: 10px;
      font-size: 0.8rem; color: var(--terra);
    }
    .comment-edit-bar button {
      background: none; border: none; color: var(--terra);
      font-size: 0.75rem; text-decoration: underline; cursor: pointer; font-family: inherit;
    }
    .comment-empty {
      font-size: 0.82rem; color: var(--muted); text-align: center; padding: 12px 0;
    }
    .comment-role-toggle {
      display: flex;
      background: var(--surface);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
      margin-bottom: 10px;
    }
    .comment-role-toggle button {
      flex: 1; padding: 8px 6px;
      font-size: 0.72rem; font-weight: 600;
      border: none; background: none; color: var(--muted);
      cursor: pointer; transition: all 0.15s; font-family: inherit;
      white-space: nowrap;
    }
    .comment-role-toggle button.active {
      background: var(--terra); color: #fff;
    }
    .comment-stamps {
      display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;
    }
    .comment-stamp-btn {
      padding: 7px 12px; border-radius: 99px;
      border: 1.5px solid var(--border); background: var(--white);
      font-size: 0.8rem; color: var(--brown); cursor: pointer;
      font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .comment-stamp-btn:active { border-color: var(--terra); color: var(--terra); background: #FEF3EC; }
    .comment-input-row {
      display: flex; gap: 8px;
    }
    .comment-input-row input {
      flex: 1;
      border: 1.5px solid var(--border); border-radius: 99px;
      padding: 10px 14px; font-size: 0.85rem;
      outline: none; font-family: var(--font-body); color: var(--brown);
    }
    .comment-input-row input:focus { border-color: var(--olive); }
    .comment-send-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--terra); color: #fff; border: none;
      font-size: 1rem; flex-shrink: 0; cursor: pointer;
    }

    /* ---- カレンダービュー ---- */
    .cal-wrap { padding: 0 16px 16px; }
    .cal-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px 12px;
    }
    .cal-nav-btn {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 1.1rem;
      cursor: pointer;
      color: var(--brown);
      display: flex; align-items: center; justify-content: center;
    }
    .cal-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      color: var(--brown);
      font-weight: 700;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .cal-wd {
      background: var(--cream);
      text-align: center;
      padding: 5px 2px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--muted);
      min-width: 0;
    }
    .cal-wd:first-child { color: #c0392b; }
    .cal-wd:last-child  { color: #2980b9; }
    .cal-cell {
      background: var(--white);
      min-height: 72px;
      min-width: 0;
      padding: 4px 3px 3px;
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
      overflow: hidden;
    }
    .cal-cell:hover { background: var(--cream); }
    .cal-cell.other { background: var(--surface); opacity: 0.5; pointer-events: none; }
    .cal-cell.today .cal-day { background: var(--terra); color: #fff; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; }
    .cal-cell.has-log { border-top: 2px solid var(--amber); }
    .cal-cell.selected { background: #FEF3EC; }
    .cal-day {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--brown);
      width: 22px; height: 22px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 2px;
    }
    .cal-cell:nth-child(7n+1) .cal-day { color: #c0392b; }
    .cal-cell:nth-child(7n)   .cal-day { color: #2980b9; }
    .cal-cell.today:nth-child(7n+1) .cal-day,
    .cal-cell.today:nth-child(7n)   .cal-day { color: #fff; }
    .cal-chip {
      font-size: 0.6rem;
      padding: 1px 4px;
      border-radius: 3px;
      margin-bottom: 1px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      display: block;
      line-height: 1.4;
    }
    .chip-breakfast { background: #FFF3CD; color: #856404; }
    .chip-lunch     { background: #D1ECF1; color: #0C5460; }
    .chip-dinner    { background: #E8ECFF; color: #3042a0; }
    .cal-more { font-size: 0.55rem; color: var(--muted); padding: 0 2px; }

    /* ---- 選択日パネル ---- */
    .cal-detail {
      margin-top: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
    }
    .cal-detail-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 10px;
    }
    .cal-detail-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .cal-detail-item:last-child { border-bottom: none; }
    .cal-detail-empty { font-size: 0.82rem; color: var(--muted); padding: 4px 0; }

    /* ---- 詳細モーダル ---- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(74,46,26,0.4);
      z-index: 200;
      display: flex; align-items: flex-end; justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
    .modal-sheet {
      width: 100%; max-width: 480px;
      background: var(--white);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      padding: 24px 20px 40px;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp { from { transform:translateY(60px);opacity:0 } to { transform:translateY(0);opacity:1 } }
    .modal-handle { width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 20px; }
    .modal-title { font-family:var(--font-display);font-size:1.2rem;color:var(--brown);margin-bottom:4px; }
    .modal-meta  { font-size:0.8rem;color:var(--muted);margin-bottom:16px; }
    .modal-section { background:var(--surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px; }
    .modal-section-label { font-size:0.7rem;font-weight:700;color:var(--muted);letter-spacing:0.06em;margin-bottom:6px; }
    .modal-section-value { font-size:0.88rem;color:var(--brown);line-height:1.6; }
    .modal-actions { display:flex;gap:10px;margin-top:20px; }
    .modal-actions .btn { flex:1;padding:14px;font-size:0.88rem; }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <img src="assets/logo.png" alt="Tavera">
        <span class="logo-text">Tavera</span>
      </div>
      <span class="header-title">献立履歴</span>
    </header>

    <div class="toolbar">
      <div class="toolbar-top">
        <div class="search-input-wrap" id="searchWrap">
          <span class="search-icon">&#128269;</span>
          <input type="text" id="searchInput" class="form-input"
                 placeholder="料理名で検索..." oninput="onSearch(this.value)">
        </div>
        <div class="view-toggle">
          <button id="btnList" class="active" onclick="switchView('list')">リスト</button>
          <button id="btnCal"              onclick="switchView('cal')">カレンダー</button>
        </div>
      </div>
    </div>

    <!-- リストビュー -->
    <div id="listView" class="page" style="padding-bottom:80px">
      <div class="history-list" id="historyList">
        <div class="empty-state">
          <div class="empty-icon">&#128214;</div>
          <p>まだ献立が記録されていません</p>
          <a href="log.html" class="btn btn-primary">最初の献立を記録する</a>
        </div>
      </div>
    </div>

    <!-- カレンダービュー -->
    <div id="calView" class="page" style="padding-bottom:80px;display:none">
      <div class="cal-wrap">
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="calPrev()">&#8249;</button>
          <span class="cal-title" id="calTitle"></span>
          <button class="cal-nav-btn" onclick="calNext()">&#8250;</button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div id="calDetail" style="display:none"></div>
      </div>
    </div>

    <!-- 献立コメントボトムシート -->
    <div class="bottom-sheet-overlay" id="csOverlay" onclick="closeCommentSheet()"></div>
    <div class="bottom-sheet" id="commentSheet">
      <div class="bs-handle"></div>
      <div class="bs-title" id="csTitle">コメント</div>
      <div class="comment-sheet-label" id="csLabel"></div>
      <div class="comment-list" id="csList"></div>
      <div class="comment-edit-bar" id="csEditBar" style="display:none;">
        <span>✏️ コメントを編集中</span>
        <button type="button" onclick="cancelCommentEdit()">キャンセル</button>
      </div>
      <div class="comment-role-toggle" id="csRoleToggle">
        <button id="csRoleEater" onclick="setCommentStampMode('eater')">🙏 いただく側</button>
        <button id="csRoleCooker" onclick="setCommentStampMode('cooker')">👩‍🍳 つくってくれる側</button>
      </div>
      <div class="comment-stamps" id="csStamps"></div>
      <div class="comment-input-row">
        <input type="text" id="csInput" placeholder="一言メモ（任意）" maxlength="100"
               onkeydown="if(event.key==='Enter')sendComment(null)">
        <button class="comment-send-btn" onclick="sendComment(null)">➤</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="home.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        ホーム
      </a>
      <a href="history.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        履歴
      </a>
      <a href="log.html" class="nav-add">
        <div class="nav-add-inner">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </a>
      <a href="suggest.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        AI提案
      </a>
      <a href="settings.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        設定
      </a>
      <a href="kyushoku.html" class="nav-sidebar-only">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        給食
      </a>
    </nav>
  </div>

  <script>
    let householdId = null;
    let currentMemberId = null;
    let searchTimer = null;
    let allLogs = [];
    let currentView = 'list';
    let allCommentCounts = {};

    // カレンダー状態
    const today = new Date();
    let calYear  = today.getFullYear();
    let calMonth = today.getMonth(); // 0-indexed
    let calSelDate = null;
    let calLogsCache = {}; // "YYYY-MM" -> logs[]

    const MEAL_BADGE = {
      breakfast: ['朝食', 'badge-breakfast'],
      lunch:     ['昼食', 'badge-lunch'],
      dinner:    ['夕食', 'badge-dinner'],
    };
    const CHIP_CLASS = { breakfast: 'chip-breakfast', lunch: 'chip-lunch', dinner: 'chip-dinner' };
    const MEAL_ORDER = ['breakfast', 'lunch', 'dinner'];
    const WD = ['日','月','火','水','木','金','土'];

    async function init() {
      const user = await requireAuth();
      if (!user) return;
      currentMemberId = user.id;
      householdId = await getOrCreateHousehold(user.id);
      await renderHistory('');
      await renderCalendar();
    }

    // =====================
    //  ビュー切り替え
    // =====================
    function switchView(v) {
      currentView = v;
      document.getElementById('listView').style.display = v === 'list' ? '' : 'none';
      document.getElementById('calView').style.display  = v === 'cal'  ? '' : 'none';
      document.getElementById('btnList').classList.toggle('active', v === 'list');
      document.getElementById('btnCal').classList.toggle('active', v === 'cal');
      // カレンダー表示時は検索欄を非表示
      document.getElementById('searchWrap').style.visibility = v === 'list' ? '' : 'hidden';
    }

    // =====================
    //  リストビュー
    // =====================
    async function onSearch(val) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => renderHistory(val.trim()), 300);
    }

    async function renderHistory(keyword) {
      const list = document.getElementById('historyList');
      list.innerHTML = '<div class="loading-dots" style="padding:24px 0;justify-content:center"><span></span><span></span><span></span></div>';

      let data = [];
      if (keyword) {
        data = await searchLogs(householdId, keyword);
      } else {
        const { data: d } = await db
          .from('menu_logs')
          .select('*')
          .eq('household_id', householdId)
          .order('date', { ascending: false })
          .order('meal_type')
          .limit(100);
        data = d || [];
      }
      allLogs = data;

      if (!data.length) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">&#127869;&#65039;</div>
            <p>${keyword ? `&#12300;${keyword}&#12301;の記録が見つかりません` : 'まだ献立が記録されていません'}</p>
            <a href="log.html" class="btn btn-primary">献立を記録する</a>
          </div>`;
        return;
      }

      const todayStr = today.toISOString().slice(0, 10);
      allCommentCounts = await getAllMealCommentCounts(householdId);

      list.innerHTML = data.map((log, i) => {
        const d = new Date(log.date);
        const [label, badgeClass] = MEAL_BADGE[log.meal_type] || ['?', ''];
        const isLoved = log.rating === 5;
        const isToday = log.date === todayStr;
        const commentCount = allCommentCounts[log.date + '_' + log.meal_type] || 0;
        return `
          <div class="history-item fade-in ${isToday ? 'is-today' : ''}" style="animation-delay:${i*0.04}s"
               data-date="${log.date}" data-meal="${log.meal_type}"
               onclick="openModal(allLogs[${i}])">
            <div class="history-date-badge">
              <div class="month">${d.getMonth()+1}&#26376;</div>
              <div class="day">${d.getDate()}</div>
            </div>
            <div class="history-content">
              <div class="history-row-main">
                <span class="history-meal-badge ${badgeClass}">${label}</span>
                <div class="history-dish">${log.dish_name}${srcBadge(log)}</div>
              </div>
              <div class="history-row-sub">
                ${isToday ? '<span class="history-today-label">本日</span>' : ''}
                ${log.rating ? `<div class="history-rating">${'&#9733;'.repeat(log.rating)}</div>` : ''}
                <div class="history-row-sub-spacer"></div>
                <button class="history-comment-btn ${commentCount ? 'has-comments' : ''}"
                  onclick="event.stopPropagation(); openCommentSheet('${log.date}', '${log.meal_type}', '${label}')">
                  &#128172;${commentCount ? `<span class="count">${commentCount > 9 ? '9+' : commentCount}</span>` : ''}
                </button>
                <button class="heart-btn ${isLoved ? 'loved' : ''}"
                  onclick="event.stopPropagation(); toggleLove('${log.id}', ${isLoved}, this)">
                  ${isLoved ? '&#10084;&#65039;' : '&#129293;'}
                </button>
              </div>
            </div>
          </div>`;
      }).join('');

      if (!keyword) scrollToToday();
    }

    // 開いた直後は「本日」の記録位置にスクロール（無ければ本日に一番近い直近の記録）
    function scrollToToday() {
      const list = document.getElementById('historyList');
      const items = Array.from(list.querySelectorAll('.history-item'));
      if (!items.length) return;
      const todayStr = today.toISOString().slice(0, 10);
      let target = items.find(el => el.dataset.date === todayStr);
      if (!target) {
        // 本日の記録が無い場合、本日以前で最も新しい記録（＝本日の位置に一番近い行）にスクロール
        target = items.find(el => el.dataset.date < todayStr) || items[0];
      }
      requestAnimationFrame(() => {
        target.scrollIntoView({ behavior: 'auto', block: 'center' });
      });
    }

    // =====================
    //  カレンダービュー
    // =====================
    async function fetchCalLogs(year, month) {
      const key = year + '-' + String(month+1).padStart(2, '0');
      if (calLogsCache[key]) return calLogsCache[key];
      const from = key + '-01';
      const lastDay = new Date(year, month+1, 0).getDate();
      const to = key + '-' + String(lastDay).padStart(2, '0');
      const { data } = await db
        .from('menu_logs')
        .select('*')
        .eq('household_id', householdId)
        .gte('date', from)
        .lte('date', to)
        .order('meal_type');
      calLogsCache[key] = data || [];
      return calLogsCache[key];
    }

    async function renderCalendar() {
      const logs = await fetchCalLogs(calYear, calMonth);

      // 日付ごとにグループ化
      const byDate = {};
      logs.forEach(l => {
        (byDate[l.date] = byDate[l.date] || []).push(l);
      });

      const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
      document.getElementById('calTitle').textContent = calYear + '年 ' + monthNames[calMonth];

      const todayStr = today.toISOString().slice(0, 10);
      const firstWd = new Date(calYear, calMonth, 1).getDay();
      const lastDate = new Date(calYear, calMonth+1, 0).getDate();

      let cells = [];
      // 前月の空白
      for (let i = 0; i < firstWd; i++) cells.push({ date: null });
      // 当月
      for (let d = 1; d <= lastDate; d++) {
        const ds = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        cells.push({ date: ds });
      }
      // 末尾を必要な行数に揃える（空行を作らない）
      const neededRows = Math.ceil(cells.length / 7);
      while (cells.length < neededRows * 7) cells.push({ date: null });

      const grid = document.getElementById('calGrid');
      // 曜日ヘッダー
      let html = WD.map(w => `<div class="cal-wd">${w}</div>`).join('');

      cells.forEach(cell => {
        if (!cell.date) {
          html += '<div class="cal-cell other"></div>';
          return;
        }
        const dayLogs = byDate[cell.date] || [];
        const isToday = cell.date === todayStr;
        const isSel   = cell.date === calSelDate;
        const hasLog  = dayLogs.length > 0;
        const dayNum  = parseInt(cell.date.slice(8));
        let cls = 'cal-cell';
        if (isToday) cls += ' today';
        if (isSel)   cls += ' selected';
        if (hasLog)  cls += ' has-log';

        // 朝昼夜順に最大3件チップ
        const sorted = MEAL_ORDER.map(m => dayLogs.find(l => l.meal_type === m)).filter(Boolean);
        const chips = sorted.slice(0, 3).map(l =>
          `<span class="cal-chip ${CHIP_CLASS[l.meal_type] || ''}">${l.dish_name}</span>`
        ).join('');
        const more = dayLogs.length > 3 ? `<div class="cal-more">+${dayLogs.length-3}</div>` : '';

        html += `<div class="${cls}" data-date="${cell.date}" onclick="calSelectDate('${cell.date}')">
          <div class="cal-day">${dayNum}</div>
          ${chips}${more}
        </div>`;
      });

      grid.innerHTML = html;

      // 選択日の詳細更新
      updateCalDetail(byDate);
    }

    function updateCalDetail(byDate) {
      const el = document.getElementById('calDetail');
      if (!calSelDate) { el.style.display = 'none'; return; }

      const logs = byDate[calSelDate] || [];
      const d = new Date(calSelDate + 'T00:00:00');
      const title = `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;

      if (!logs.length) {
        el.style.display = '';
        el.innerHTML = `<div class="cal-detail"><div class="cal-detail-title">${title}</div><div class="cal-detail-empty">この日の記録はありません</div></div>`;
        return;
      }

      const sorted = MEAL_ORDER.map(m => logs.find(l => l.meal_type === m)).filter(Boolean);
      const items = sorted.map((log, i) => {
        const [label, badgeClass] = MEAL_BADGE[log.meal_type] || ['?', ''];
        const idx = allLogs.findIndex(l => l.id === log.id);
        const clickFn = idx >= 0 ? `openModal(allLogs[${idx}])` : `openModalDirect(${JSON.stringify(log).replace(/"/g,'&quot;')})`;
        return `<div class="cal-detail-item" onclick="${clickFn}">
          <span class="history-meal-badge ${badgeClass}">${label}</span>
          <span style="flex:1;font-size:0.9rem;color:var(--brown)">${log.dish_name}${srcBadge(log)}</span>
          ${log.rating ? `<span style="font-size:0.75rem;color:var(--amber)">${'&#9733;'.repeat(log.rating)}</span>` : ''}
        </div>`;
      }).join('');

      el.style.display = '';
      el.innerHTML = `<div class="cal-detail"><div class="cal-detail-title">${title}</div>${items}</div>`;
    }

    function calSelectDate(date) {
      calSelDate = (calSelDate === date) ? null : date;
      renderCalendar();
    }

    function calPrev() {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      calSelDate = null;
      renderCalendar();
    }

    function calNext() {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      calSelDate = null;
      renderCalendar();
    }

    // =====================
    //  モーダル
    // =====================
    const DAY_LABELS_H = ['日','月','火','水','木','金','土'];

    function openModalDirect(log) { openModal(log); }

    function openModal(log) {
      const d = new Date(log.date + 'T00:00:00');
      const [label] = MEAL_BADGE[log.meal_type] || ['?'];
      document.getElementById('modalDishName').textContent = log.dish_name;
      document.getElementById('modalSrcBadge').classList.toggle('hidden', log.source !== 'kyushoku');
      document.getElementById('modalMeta').textContent =
        `${d.getMonth()+1}月${d.getDate()}日（${DAY_LABELS_H[d.getDay()]}）${label}`;

      const ingWrap = document.getElementById('modalIngredientsWrap');
      const ingEl   = document.getElementById('modalIngredients');
      if (log.ingredients && log.ingredients.length) {
        ingEl.textContent = log.ingredients.join('・');
        ingWrap.classList.remove('hidden');
      } else { ingWrap.classList.add('hidden'); }

      const memoWrap = document.getElementById('modalMemoWrap');
      const memoEl   = document.getElementById('modalMemo');
      if (log.memo) {
        memoEl.textContent = log.memo;
        memoWrap.classList.remove('hidden');
      } else { memoWrap.classList.add('hidden'); }

      const r = log.rating || 0;
      document.getElementById('modalRating').textContent =
        r ? '★'.repeat(r) + '☆'.repeat(5-r) : '未設定';

      document.getElementById('modalEditBtn').onclick = () => {
        location.href = `log.html?date=${log.date}&meal=${log.meal_type}&edit=1`;
      };
      document.getElementById('modalCopyBtn').onclick = () => {
        const t = new Date().toISOString().split('T')[0];
        location.href = `log.html?date=${t}&meal=dinner&dish=${encodeURIComponent(log.dish_name)}`;
      };
      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal(e) {
      if (e.target.id === 'detailModal') {
        document.getElementById('detailModal').classList.add('hidden');
      }
    }

    async function toggleLove(logId, isLoved, btn) {
      const newRating = isLoved ? 3 : 5;
      const { error } = await db.from('menu_logs').update({ rating: newRating }).eq('id', logId);
      if (!error) {
        const loved = !isLoved;
        btn.innerHTML = loved ? '&#10084;&#65039;' : '&#129293;';
        btn.classList.toggle('loved', loved);
        btn.style.transform = 'scale(1.5)';
        setTimeout(() => btn.style.transform = '', 200);
        showToast(loved ? 'また食べたいに追加！' : 'また食べたいを解除', loved ? 'success' : 'info');
        const idx = allLogs.findIndex(l => l.id === logId);
        if (idx !== -1) allLogs[idx].rating = newRating;
        // カレンダーキャッシュを無効化
        const dateKey = allLogs[idx]?.date?.slice(0,7);
        if (dateKey) delete calLogsCache[dateKey];
      }
    }

    // ---- 献立コメント ----
    let commentSheetDate = null;
    let commentSheetMeal = null;
    let lastComments = [];
    let editingCommentId = null;
    let editingStamp = null;
    let currentMemberRole = null;   // 'owner' | 'member'
    let commentStampMode = 'eater'; // 'eater' | 'cooker'（コメントシートを開くたびroleから初期化）

    async function openCommentSheet(dateStr, mealType, label) {
      commentSheetDate = dateStr;
      commentSheetMeal = mealType;
      document.getElementById('csTitle').textContent = `${label}のコメント`;
      const d = new Date(dateStr + 'T00:00:00');
      document.getElementById('csLabel').textContent = `${d.getMonth()+1}月${d.getDate()}日`;
      cancelCommentEdit();
      if (currentMemberRole === null) currentMemberRole = await getMemberRole(currentMemberId);
      setCommentStampMode(currentMemberRole === 'owner' ? 'cooker' : 'eater');
      document.getElementById('csOverlay').classList.add('open');
      document.getElementById('commentSheet').classList.add('open');
      await renderCommentList();
    }

    function setCommentStampMode(mode) {
      commentStampMode = mode;
      document.getElementById('csRoleEater').classList.toggle('active', mode === 'eater');
      document.getElementById('csRoleCooker').classList.toggle('active', mode === 'cooker');
      const stamps = mode === 'eater' ? EATER_STAMPS : COOKER_STAMPS;
      document.getElementById('csStamps').innerHTML = Object.entries(stamps).map(([key, label]) =>
        `<button class="comment-stamp-btn" onclick="sendComment('${key}')">${label}</button>`
      ).join('');
    }

    function closeCommentSheet() {
      document.getElementById('csOverlay').classList.remove('open');
      document.getElementById('commentSheet').classList.remove('open');
    }

    async function renderCommentList() {
      const list = document.getElementById('csList');
      list.innerHTML = '<div class="loading-dots" style="justify-content:center;padding:8px 0"><span></span><span></span><span></span></div>';
      const comments = await getMealComments(householdId, commentSheetDate, commentSheetMeal);
      lastComments = comments;
      if (!comments.length) {
        list.innerHTML = '<div class="comment-empty">まだコメントはありません</div>';
        return;
      }
      list.innerHTML = comments.map(c => {
        const name = c.menu_members?.name || (c.source === 'line' ? 'LINEから' : '家族');
        const text = [c.stamp ? MEAL_COMMENT_STAMPS[c.stamp] || c.stamp : null, c.body].filter(Boolean).join('　');
        const time = new Date(c.created_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
        const editedTag = c.edited_at
          ? `<span class="comment-edited-tag">（編集済み ${new Date(c.edited_at).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' })}）</span>`
          : '';
        const actions = c.author_id === currentMemberId
          ? `<button class="comment-action-btn" onclick="startEditComment('${c.id}')">編集</button><button class="comment-action-btn" onclick="deleteCommentItem('${c.id}')">削除</button>`
          : '';
        return `
          <div class="comment-item">
            <div>${text}</div>
            <div class="meta">${name}・${time}${c.source === 'line' ? '・LINE' : ''}${editedTag}${actions}</div>
          </div>`;
      }).join('');
      list.scrollTop = list.scrollHeight;
    }

    function startEditComment(id) {
      const c = lastComments.find(x => x.id === id);
      if (!c) return;
      editingCommentId = id;
      editingStamp = c.stamp || null;
      if (c.stamp && COOKER_STAMPS[c.stamp]) setCommentStampMode('cooker');
      else if (c.stamp && EATER_STAMPS[c.stamp]) setCommentStampMode('eater');
      const input = document.getElementById('csInput');
      input.value = c.body || '';
      input.focus();
      document.getElementById('csEditBar').style.display = 'flex';
    }

    function cancelCommentEdit() {
      editingCommentId = null;
      editingStamp = null;
      document.getElementById('csInput').value = '';
      document.getElementById('csEditBar').style.display = 'none';
    }

    // その行の💬バッジ件数だけをその場で更新（一覧全体を再取得しない）
    function refreshHistoryCommentBadge(dateStr, mealType, count) {
      const row = document.querySelector(`.history-item[data-date="${dateStr}"][data-meal="${mealType}"] .history-comment-btn`);
      if (!row) return;
      row.classList.toggle('has-comments', count > 0);
      const existing = row.querySelector('.count');
      if (existing) existing.remove();
      if (count > 0) {
        const span = document.createElement('span');
        span.className = 'count';
        span.textContent = count > 9 ? '9+' : String(count);
        row.appendChild(span);
      }
    }

    async function deleteCommentItem(id) {
      if (!confirm('このコメントを削除しますか？')) return;
      const ok = await deleteMealComment(id);
      if (!ok) { showToast('削除に失敗しました', 'error'); return; }
      if (editingCommentId === id) cancelCommentEdit();
      await renderCommentList();
      const counts = await getMealCommentCounts(householdId, commentSheetDate);
      refreshHistoryCommentBadge(commentSheetDate, commentSheetMeal, counts[commentSheetMeal] || 0);
    }

    async function sendComment(stamp) {
      const input = document.getElementById('csInput');
      const body = input.value.trim();

      if (editingCommentId) {
        const finalStamp = stamp || editingStamp;
        if (!finalStamp && !body) { showToast('内容を入力してください', 'error'); return; }
        const result = await updateMealComment(editingCommentId, { stamp: finalStamp, body: body || null });
        cancelCommentEdit();
        if (!result) { showToast('コメントの更新に失敗しました', 'error'); return; }
        await renderCommentList();
        return;
      }

      if (!stamp && !body) return;
      const result = await postMealComment(householdId, commentSheetDate, commentSheetMeal, currentMemberId, { stamp, body: body || null });
      if (!result) { showToast('コメントの投稿に失敗しました', 'error'); return; }
      input.value = '';
      await renderCommentList();
      const counts = await getMealCommentCounts(householdId, commentSheetDate);
      refreshHistoryCommentBadge(commentSheetDate, commentSheetMeal, counts[commentSheetMeal] || 0);
    }

    init();
    initPullToRefresh(async () => { await init(); });
  </script>

  <!-- 詳細モーダル -->
  <div class="modal-overlay hidden" id="detailModal" onclick="closeModal(event)">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-title" id="modalDishName"></div><span class="src-badge-kyushoku hidden" id="modalSrcBadge">🍱 給食</span>
      <div class="modal-meta" id="modalMeta"></div>
      <div class="modal-section" id="modalIngredientsWrap">
        <div class="modal-section-label">使用食材</div>
        <div class="modal-section-value" id="modalIngredients"></div>
      </div>
      <div class="modal-section" id="modalMemoWrap">
        <div class="modal-section-label">メモ</div>
        <div class="modal-section-value" id="modalMemo"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-label">また食べたい度</div>
        <div class="modal-section-value" id="modalRating"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modalEditBtn">&#9999;&#65039; 編集する</button>
        <button class="btn btn-primary"   id="modalCopyBtn">&#127859; 今日も作る</button>
      </div>
    </div>
  </div>
</body>
</html>
