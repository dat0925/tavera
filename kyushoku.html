<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>給食インポート - Tavera</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    .ky-wrap { padding: 20px; }

    .ky-intro {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: var(--brown);
      line-height: 1.7;
      border-left: 3px solid var(--amber);
    }
    .ky-intro strong { color: var(--terra); }

    /* アップロードエリア */
    .hidden { display: none !important; }
    .ky-input-tabs { display: flex; gap: 0; margin-bottom: 12px; border-radius: var(--radius-md); border: 1px solid var(--border); }
    .ky-input-tab {
      flex: 1; padding: 9px 0; font-size: 0.82rem; font-weight: 600;
      text-align: center; cursor: pointer; background: var(--white);
      color: var(--muted); border: none; font-family: inherit; transition: all .15s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    .ky-input-tab.active { background: var(--terra); color: #fff; }
    .ky-url-area { display: flex; gap: 8px; margin-bottom: 4px; }
    .ky-url-input {
      flex: 1; padding: 10px 14px; border: 1px solid var(--border);
      border-radius: var(--radius-md); font-size: 0.85rem; font-family: inherit;
      color: var(--brown);
    }
    .ky-url-input:focus { outline: none; border-color: var(--terra); }
    .ky-url-load-btn {
      padding: 10px 16px; background: var(--terra); color: #fff;
      border: none; border-radius: var(--radius-md); font-size: 0.85rem;
      font-family: inherit; cursor: pointer; white-space: nowrap;
    }
    .ky-url-hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition);
      background: var(--surface);
      margin-bottom: 16px;
      position: relative;
    }
    .upload-area:hover, .upload-area.dragover {
      border-color: var(--terra);
      background: #FEF3EC;
    }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
      pointer-events: none;
    }
    #panelFile:not(.hidden) .upload-area input[type="file"] {
      pointer-events: auto;
    }
    .upload-icon { font-size: 2.5rem; margin-bottom: 8px; }
    .upload-label { font-size: 0.9rem; font-weight: 600; color: var(--brown); margin-bottom: 4px; }
    .upload-sub   { font-size: 0.75rem; color: var(--muted); }
    .upload-preview {
      max-width: 100%; max-height: 200px; border-radius: var(--radius-sm);
      object-fit: contain; margin-top: 12px; display: none;
    }
    .upload-filename {
      font-size: 0.8rem; color: var(--terra); margin-top: 8px;
      font-weight: 600; display: none;
    }

    /* 年月選択 */
    .ky-month-row {
      display: flex; gap: 10px; align-items: center; margin-bottom: 16px;
    }
    .ky-month-row label { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
    .ky-month-row select {
      flex: 1; padding: 8px 10px;
      border: 1.5px solid var(--border); border-radius: var(--radius-sm);
      background: var(--white); color: var(--brown);
      font-family: var(--font-body); font-size: 0.88rem;
    }

    /* 解析ボタン */
    .ky-parse-btn {
      width: 100%; padding: 14px;
      background: var(--terra); color: #fff;
      border: none; border-radius: var(--radius-md);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; transition: opacity var(--transition);
      font-family: var(--font-body);
      margin-bottom: 20px;
    }
    .ky-parse-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 解析結果 */
    .ky-results { margin-bottom: 80px; }
    .ky-results-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .ky-results-title { font-size: 0.85rem; font-weight: 700; color: var(--brown); }
    .ky-select-all {
      font-size: 0.75rem; color: var(--terra); background: none; border: none;
      cursor: pointer; padding: 0; font-family: var(--font-body);
    }

    .ky-day-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
      margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start;
      transition: border-color var(--transition);
    }
    .ky-day-card.checked { border-color: var(--amber); background: #FFFBF5; }
    .ky-day-card input[type="checkbox"] {
      width: 20px; height: 20px; accent-color: var(--terra);
      flex-shrink: 0; margin-top: 2px; cursor: pointer;
    }
    .ky-day-info { flex: 1; }
    .ky-day-date {
      font-size: 0.82rem; font-weight: 700; color: var(--muted);
      margin-bottom: 4px;
    }
    .ky-day-dish-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ky-day-memo {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.5;
    }
    .ky-edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
      opacity: 0.6;
    }
    .ky-edit-btn:hover { opacity: 1; color: var(--terra); }
    .ky-dish-input {
      width: 100%;
      border: 1.5px solid var(--terra);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 0.85rem;
      font-family: inherit;
      color: var(--brown);
      background: var(--white);
    }
    .ky-dish-input:focus { outline: none; }
    .ky-day-dish {
      font-size: 0.92rem; color: var(--brown); line-height: 1.5;
    }
    .ky-already {
      font-size: 0.7rem; color: var(--muted);
      background: var(--border); padding: 1px 7px; border-radius: 99px;
      margin-left: 6px;
    }
    .ky-allergy-note {
      font-size: 0.78rem; color: var(--terra); line-height: 1.6;
      background: #FEF3EC; border: 1.5px solid var(--terra);
      border-radius: var(--radius-sm); padding: 10px 12px;
      margin-bottom: 10px;
    }
    .ky-allergy-alert {
      font-size: 0.78rem; color: var(--terra); line-height: 1.6;
      background: #FEF3EC; border: 1.5px solid var(--terra);
      border-radius: var(--radius-sm); padding: 8px 10px;
      margin-top: 6px;
    }
    .ky-allergy-reason {
      font-size: 0.72rem; color: var(--muted); font-weight: 400;
    }

    /* インポートボタン（固定） */
    .ky-import-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(60px + env(safe-area-inset-bottom));
      padding: 12px 20px;
      background: var(--white);
      border-top: 2px solid var(--border);
      z-index: 200;
    }
    @media (min-width: 769px) {
      .ky-import-bar {
        left: 220px;
        bottom: 0;
      }
    }
    .ky-import-btn {
      width: 100%; padding: 14px;
      background: var(--olive); color: #fff;
      border: none; border-radius: var(--radius-md);
      font-size: 0.95rem; font-weight: 700;
      cursor: pointer; font-family: var(--font-body);
      transition: opacity var(--transition);
    }
    .ky-import-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>

        <div id="panelFile">
          <div class="upload-area" id="uploadArea">

            <div class="upload-icon">&#128247;</div>

  <script>
    const WD = ['日','月','火','水','木','金','土'];
    const MONTH_NAMES = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

    let householdId = null;
    let familyMembers = [];  // アレルギー照合用
    let fileData = null;   // { base64, mediaType } or null if URL mode
    let pendingUrl = null; // URLモード時にセット
    let parsedMenu = [];   // [{ date, dishes, checked, alreadyExists, allergyHits }]

    // =====================
    //  初期化
    // =====================
    async function init() {
      const user = await requireAuth();
      if (!user) return;
      householdId = await getOrCreateHousehold(user.id);
      try { familyMembers = await getFamilyMembers(householdId); } catch(e) { familyMembers = []; }
      setupMonthSelectors();
    }

    // 家族メンバー全員の登録アレルゲンを重複無しでまとめた配列
    // （Edge Functionに渡し、Geminiに判定させるための対象アレルゲン一覧）
    function getHouseholdAllergyList() {
      const set = new Set();
      (familyMembers || []).forEach(m => (m.allergies || []).forEach(a => { if (a) set.add(a); }));
      return Array.from(set);
    }

    function setupMonthSelectors() {
      const now = new Date();
      const yearSel  = document.getElementById('kyYear');
      const monthSel = document.getElementById('kyMonth');
      // 年: 今年・来年
      for (let y = now.getFullYear() - 1; y <= now.getFullYear() + 1; y++) {
        const opt = document.createElement('option');
        opt.value = y; opt.textContent = y + '年';
        if (y === now.getFullYear()) opt.selected = true;
        yearSel.appendChild(opt);
      }
      // 月
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m; opt.textContent = m + '月';
        if (m === now.getMonth() + 1) opt.selected = true;
        monthSel.appendChild(opt);
      }
    }

    // =====================
    //  タブ切り替え
    // =====================
    function switchTab(tab) {
      var tabFile = document.getElementById('tabFile');
      var tabUrl = document.getElementById('tabUrl');
      var panelFile = document.getElementById('panelFile');
      var panelUrl = document.getElementById('panelUrl');
      if (tab === 'file') {
        tabFile.classList.add('active');
        tabUrl.classList.remove('active');
        panelFile.classList.remove('hidden');
        panelUrl.classList.add('hidden');
      } else {
        tabUrl.classList.add('active');
        tabFile.classList.remove('active');
        panelUrl.classList.remove('hidden');
        panelFile.classList.add('hidden');
      }
    }

    // =====================
    //  URLから読み込む
    // =====================
    async function loadFromUrl() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      const status = document.getElementById('urlStatus');
      status.textContent = '読み込み中...';

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('取得できませんでした（' + res.status + '）');
        const blob = await res.blob();
        const mediaType = blob.type || (url.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg');

        const b64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result.split(',')[1]);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        });

        fileData = { base64: b64, mediaType };
        pendingUrl = null;
        status.textContent = '✅ 読み込み完了（' + Math.round(blob.size / 1024) + 'KB）';
        document.getElementById('parseBtn').disabled = false;
        document.getElementById('resultsSection').classList.add('hidden');
        document.getElementById('importBar').style.display = 'none';
        parsedMenu = [];
      } catch (err) {
        // CORSエラーの場合はEdge Function経由でフェッチ
        if (err.message.includes('Failed to fetch') || err.message.includes('CORS') || err.message.includes('Load failed') || err.message.includes('NetworkError')) {
          // base64をフロントに戻さず、URLをEdge Functionに直接渡すモードで保存
          pendingUrl = url;
          fileData = null;
          status.textContent = '✅ 読み込み完了（サーバー経由で解析します）';
          document.getElementById('parseBtn').disabled = false;
          document.getElementById('resultsSection').classList.add('hidden');
          document.getElementById('importBar').style.display = 'none';
          parsedMenu = [];
        } else {
          status.textContent = '❌ ' + err.message;
        }
      }
    }

    // =====================
    //  ファイル選択
    // =====================
    function onFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const result = ev.target.result; // data:xxx;base64,yyy
        const base64 = result.split(',')[1];
        fileData = { base64, mediaType: file.type };
        pendingUrl = null;

        // プレビュー
        const preview  = document.getElementById('uploadPreview');
        const filename = document.getElementById('uploadFilename');
        if (file.type.startsWith('image/')) {
          preview.src = result;
          preview.style.display = 'block';
          filename.style.display = 'none';
        } else {
          preview.style.display = 'none';
          filename.textContent = '&#128196; ' + file.name;
          filename.style.display = 'block';
        }
        document.getElementById('parseBtn').disabled = false;
        // 前回の結果をリセット
        document.getElementById('resultsSection').classList.add('hidden');
        document.getElementById('importBar').style.display = 'none';
        parsedMenu = [];
      };
      reader.readAsDataURL(file);
    }

    // =====================
    //  AI解析
    // =====================
    async function parseMenu() {
      if (!fileData && !pendingUrl) return;
      const btn = document.getElementById('parseBtn');
      btn.disabled = true;
      btn.textContent = '解析中...'
      const year  = parseInt(document.getElementById('kyYear').value);
      const month = parseInt(document.getElementById('kyMonth').value);

      try {
        const session = await getSession();
        const allergyList = getHouseholdAllergyList();
        // URLモード: base64をフロントに経由させずEdge Functionが直接fetch
        const bodyPayload = pendingUrl
          ? { url: pendingUrl, year, month, allergies: allergyList }
          : { image: fileData.base64, mediaType: fileData.mediaType, year, month, allergies: allergyList };
        const res = await fetch(SUPABASE_URL + '/functions/v1/tavera-kyushoku', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + (session?.access_token || ''),
          },
          body: JSON.stringify(bodyPayload),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (!data.menu || !data.menu.length) {
          showToast('献立を読み取れませんでした。画像を確認してください', 'error');
          return;
        }

        // 既存ログを取得して重複チェック
        const mm = String(month).padStart(2, '0');
        const from = year + '-' + mm + '-01';
        const to   = year + '-' + mm + '-31';
        const { data: existing } = await db.from('menu_logs')
          .select('date,meal_type')
          .eq('household_id', householdId)
          .eq('meal_type', 'lunch')
          .gte('date', from).lte('date', to);
        const existingDates = new Set((existing || []).map(l => l.date));

        parsedMenu = data.menu.map(item => {
          // アレルギーチェック：①Geminiが料理名から推測したallergenHits
          //                   ②食材・料理名そのものの文字列一致（保険のダブルチェック）
          const geminiHits = mapAllergensToMembers(item.allergenHits || [], familyMembers);
          const localHits = checkAllergies([...(item.dishes || []), ...(item.ingredients || [])], familyMembers);
          const allergyHits = dedupeAllergyHits([...geminiHits, ...localHits]);
          return {
            date: item.date,
            dishes: item.dishes || [],
            ingredients: item.ingredients || [],
            allergyHits,
            // アレルギーの可能性がある日は、見落として一括登録しないよう既定でチェックを外す
            checked: !existingDates.has(item.date) && allergyHits.length === 0,
            alreadyExists: existingDates.has(item.date),
          };
        });

        renderResults(year, month);
      } catch (e) {
        showToast('エラー: ' + e.message, 'error');
        console.error(e);
      } finally {
        btn.disabled = false;
        btn.textContent = '🤖 AIで献立を解析する';
      }
    }

    // =====================
    //  結果表示
    // =====================
    function renderResults(year, month) {
      const section = document.getElementById('resultsSection');
      const cards   = document.getElementById('dayCards');
      document.getElementById('resultsTitle').textContent =
        year + '年' + month + '月の給食（' + parsedMenu.length + '日分）';

      const hasAnyAllergyHit = parsedMenu.some(m => m.allergyHits && m.allergyHits.length > 0);
      const noteEl = document.getElementById('allergyNote');
      if (noteEl) {
        noteEl.classList.toggle('hidden', !hasAnyAllergyHit);
      }

      cards.innerHTML = parsedMenu.map((item, i) => {
        const d  = new Date(item.date + 'T00:00:00');
        const dateLabel = (d.getMonth()+1) + '月' + d.getDate() + '日（' + WD[d.getDay()] + '）';
        const dishText  = item.dishes.join('・');
        const badge     = item.alreadyExists ? '<span class="ky-already">登録済み</span>' : '';
        let allergyHtml = '';
        if (item.allergyHits && item.allergyHits.length > 0) {
          const lines = item.allergyHits.map(h =>
            '⚠️ ' + h.memberName + '：' + h.allergen + 'が含まれる可能性があります' +
            '<br><span class="ky-allergy-reason">└ ' + (h.reason || 'AIが料理内容から判断') + '</span>'
          );
          allergyHtml = '<div class="ky-allergy-alert">' + lines.join('<br>') + '</div>';
        }
        return `<div class="ky-day-card ${item.checked ? 'checked' : ''}" id="card-${i}">
          <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck(${i}, this.checked)">
          <div class="ky-day-info">
            <div class="ky-day-date">${dateLabel}${badge}</div>
            <div class="ky-day-dish-wrap">
              <div class="ky-day-dish" id="dish-text-${i}">${dishText}</div>
              <button class="ky-edit-btn" onclick="startEditDish(${i})" title="編集">✏️</button>
            </div>
            ${item.ingredients && item.ingredients.length ? `<div class="ky-day-memo">【材料】${item.ingredients.join('・')}</div>` : ''}
            ${allergyHtml}
          </div>
        </div>`;
      }).join('');

      section.classList.remove('hidden');
      updateImportBar();
    }

    function toggleCheck(i, checked) {
      parsedMenu[i].checked = checked;
      const card = document.getElementById('card-' + i);
      card.classList.toggle('checked', checked);
      updateImportBar();
    }

    function startEditDish(i) {
      const wrap = document.getElementById('card-' + i).querySelector('.ky-day-dish-wrap');
      const dishText = parsedMenu[i].dishes.join('・');
      wrap.innerHTML =
        '<input type="text" class="ky-dish-input" id="dish-input-' + i + '" value="' + dishText.replace(/"/g, '&quot;') + '">' +
        '<button class="ky-edit-btn" onclick="saveDish(' + i + ')" title="保存">✅</button>';
      const input = document.getElementById('dish-input-' + i);
      input.focus();
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') saveDish(i);
        if (e.key === 'Escape') cancelEditDish(i);
      });
    }

    function saveDish(i) {
      const input = document.getElementById('dish-input-' + i);
      if (!input) return;
      const newText = input.value.trim();
      if (newText) {
        parsedMenu[i].dishes = newText.split('・').map(function(d) { return d.trim(); }).filter(Boolean);
      }
      renderDishCell(i);
    }

    function cancelEditDish(i) {
      renderDishCell(i);
    }

    function renderDishCell(i) {
      const wrap = document.getElementById('card-' + i).querySelector('.ky-day-dish-wrap');
      const dishText = parsedMenu[i].dishes.join('・');
      wrap.innerHTML =
        '<div class="ky-day-dish" id="dish-text-' + i + '">' + dishText + '</div>' +
        '<button class="ky-edit-btn" onclick="startEditDish(' + i + ')" title="編集">✏️</button>';
    }

    function toggleSelectAll() {
      const anyUnchecked = parsedMenu.some(m => !m.checked);
      parsedMenu.forEach((m, i) => {
        m.checked = anyUnchecked;
        const card = document.getElementById('card-' + i);
        card.classList.toggle('checked', anyUnchecked);
        card.querySelector('input').checked = anyUnchecked;
      });
      updateImportBar();
    }

    function updateImportBar() {
      const count = parsedMenu.filter(m => m.checked).length;
      document.getElementById('importCount').textContent = count;
      const bar = document.getElementById('importBar');
      bar.style.display = count > 0 ? 'block' : 'none';
    }

    // =====================
    //  インポート実行
    // =====================
    async function doImport() {
      const targets = parsedMenu.filter(m => m.checked);
      if (!targets.length) return;
      const btn = document.getElementById('importBtn');
      btn.disabled = true;
      btn.textContent = '登録中...';

      const user = await getUser();
      let success = 0;
      let failCount = 0;
      let lastErrorMsg = '';
      const succeededIndexes = [];

      for (const item of targets) {
        const dishName = item.dishes.join('・');
        const idx = parsedMenu.indexOf(item);
        const { error } = await db.from('menu_logs').upsert({
          household_id: householdId,
          date: item.date,
          meal_type: 'lunch',
          dish_name: dishName,
          ingredients: item.ingredients && item.ingredients.length ? item.ingredients : null,
          created_by: user.id,
          source: 'kyushoku',
        }, { onConflict: 'household_id,date,meal_type' });
        if (!error) {
          success++;
          succeededIndexes.push(idx);
        } else {
          failCount++;
          lastErrorMsg = error.message || String(error);
          console.error('[kyushoku] import failed:', item.date, error);
        }
      }

      btn.disabled = false;
      btn.innerHTML = '&#10003; 選択した献立をインポート（<span id="importCount">0</span>日分）';

      if (failCount > 0) {
        showToast(success + '日分登録・' + failCount + '日分失敗しました（' + lastErrorMsg + '）', 'error');
      } else {
        showToast(success + '日分の給食を登録しました！', 'success');
      }

      // 成功した分だけ「登録済み」に更新（失敗分はチェックを保持し再試行できるようにする）
      succeededIndexes.forEach(function(i) {
        const m = parsedMenu[i];
        m.alreadyExists = true;
        m.checked = false;
        const card = document.getElementById('card-' + i);
        if (card) {
          card.classList.remove('checked');
          card.querySelector('input').checked = false;
          const badge = card.querySelector('.ky-already');
          if (!badge) {
            card.querySelector('.ky-day-date').insertAdjacentHTML('beforeend', '<span class="ky-already">登録済み</span>');
          }
        }
      });
      updateImportBar();
    }

    init();
  </script>
</body>
</html>
